<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Şeker Patlatma - Match 3</title>
<style>
  :root {
    --board-size: min(92vw, 60vh, 520px);
    --cell: calc(var(--board-size) / 8);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #2b1055 0%, #7597de 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
  }
  h1 {
    color: #fff;
    font-size: clamp(20px, 4vw, 32px);
    text-shadow: 0 2px 8px rgba(0,0,0,.4);
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  .hud {
    display: flex;
    gap: 10px;
    width: var(--board-size);
    margin-bottom: 12px;
  }
  .hud .box {
    flex: 1;
    background: rgba(255,255,255,.15);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 12px;
    padding: 8px 4px;
    text-align: center;
    color: #fff;
  }
  .hud .label { font-size: 11px; opacity: .8; text-transform: uppercase; letter-spacing: 1px; }
  .hud .value { font-size: clamp(16px, 3.5vw, 24px); font-weight: 700; }
  .progress-wrap {
    width: var(--board-size);
    height: 10px;
    background: rgba(0,0,0,.3);
    border-radius: 5px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    border-radius: 5px;
    transition: width .4s ease;
  }
  #board {
    position: relative;
    width: var(--board-size);
    height: var(--board-size);
    background: rgba(0,0,0,.35);
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4), inset 0 0 20px rgba(0,0,0,.3);
    touch-action: none;
  }
  .candy {
    position: absolute;
    width: var(--cell);
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--cell) * .62);
    cursor: pointer;
    transition: top .25s cubic-bezier(.5,1.5,.5,1), left .25s cubic-bezier(.5,1.5,.5,1), transform .15s;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.35));
    z-index: 1;
  }
  .candy.selected {
    transform: scale(1.25);
    z-index: 2;
    filter: drop-shadow(0 0 10px #fff) drop-shadow(0 3px 4px rgba(0,0,0,.35));
  }
  .candy.pop {
    animation: pop .3s forwards;
    z-index: 3;
  }
  @keyframes pop {
    50% { transform: scale(1.35); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
  }
  .candy.striped-h::after, .candy.striped-v::after {
    content: '';
    position: absolute;
    inset: 18%;
    border-radius: 50%;
    pointer-events: none;
  }
  .candy.striped-h::after { background: repeating-linear-gradient(0deg, transparent 0 4px, rgba(255,255,255,.75) 4px 7px); }
  .candy.striped-v::after { background: repeating-linear-gradient(90deg, transparent 0 4px, rgba(255,255,255,.75) 4px 7px); }
  .candy.bomb {
    animation: glow 1s infinite alternate;
  }
  @keyframes glow {
    from { filter: drop-shadow(0 0 4px #fff) drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
    to   { filter: drop-shadow(0 0 14px #ff0) drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
  }
  .score-float {
    position: absolute;
    color: #ffe259;
    font-weight: 800;
    font-size: calc(var(--cell) * .4);
    text-shadow: 0 2px 4px rgba(0,0,0,.6);
    pointer-events: none;
    z-index: 10;
    animation: floatUp .8s forwards;
  }
  @keyframes floatUp {
    to { transform: translateY(-50px); opacity: 0; }
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #overlay.show { display: flex; }
  .modal {
    background: linear-gradient(160deg, #43217a, #2b1055);
    border: 2px solid rgba(255,255,255,.3);
    border-radius: 20px;
    padding: 36px 44px;
    text-align: center;
    color: #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    animation: modalIn .35s cubic-bezier(.5,1.5,.5,1);
  }
  @keyframes modalIn {
    from { transform: scale(.6); opacity: 0; }
  }
  .modal h2 { font-size: 30px; margin-bottom: 8px; }
  .modal p { opacity: .85; margin-bottom: 20px; font-size: 16px; }
  .modal button {
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    border: none;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    padding: 12px 34px;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(255,78,80,.5);
    transition: transform .15s;
  }
  .modal button:hover { transform: scale(1.07); }
  .hint { color: rgba(255,255,255,.65); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>

<h1>🍬 Şeker Patlatma</h1>

<div class="hud">
  <div class="box"><div class="label">Seviye</div><div class="value" id="level">1</div></div>
  <div class="box"><div class="label">Skor</div><div class="value" id="score">0</div></div>
  <div class="box"><div class="label">Hedef</div><div class="value" id="target">1000</div></div>
  <div class="box"><div class="label">Hamle</div><div class="value" id="moves">20</div></div>
</div>

<div class="progress-wrap"><div class="progress-bar" id="progress"></div></div>

<div id="board"></div>
<div class="hint">Yan yana iki şekeri sürükleyerek veya tıklayarak yer değiştir. 3+ eşleştir!</div>

<div id="overlay">
  <div class="modal">
    <h2 id="modal-title">Tebrikler! 🎉</h2>
    <p id="modal-text"></p>
    <button id="modal-btn">Devam</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  const SIZE = 8;
  const TYPES = ['🍬','🍭','🍩','🍪','🧁','🍫'];
  const NUM_TYPES = TYPES.length;

  // Özel şeker türleri
  const NORMAL = 0, STRIPED_H = 1, STRIPED_V = 2, BOMB = 3;
  const BOMB_ICON = '🌈';

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const movesEl = document.getElementById('moves');
  const levelEl = document.getElementById('level');
  const targetEl = document.getElementById('target');
  const progressEl = document.getElementById('progress');
  const overlay = document.getElementById('overlay');
  const modalTitle = document.getElementById('modal-title');
  const modalText = document.getElementById('modal-text');
  const modalBtn = document.getElementById('modal-btn');

  let grid = [];        // grid[r][c] = {type, special, el} | null
  let score = 0;
  let moves = 20;
  let level = 1;
  let target = 1000;
  let busy = false;     // animasyon sırasında girişi kilitle
  let selected = null;  // {r, c}
  let gameOver = false;

  const cellPx = () => boardEl.clientWidth / SIZE;
  const rand = n => Math.floor(Math.random() * n);

  function makeCandy(r, c, type, special = NORMAL) {
    const el = document.createElement('div');
    el.className = 'candy';
    setCandyFace(el, type, special);
    positionEl(el, r, c);
    boardEl.appendChild(el);
    return { type, special, el };
  }

  function setCandyFace(el, type, special) {
    el.classList.remove('striped-h', 'striped-v', 'bomb');
    if (special === BOMB) {
      el.textContent = BOMB_ICON;
      el.classList.add('bomb');
    } else {
      el.textContent = TYPES[type];
      if (special === STRIPED_H) el.classList.add('striped-h');
      if (special === STRIPED_V) el.classList.add('striped-v');
    }
  }

  function positionEl(el, r, c) {
    el.style.top = (r * cellPx()) + 'px';
    el.style.left = (c * cellPx()) + 'px';
  }

  // --- Tahta kurulumu: başlangıçta eşleşme olmasın ---
  function initBoard() {
    boardEl.innerHTML = '';
    grid = [];
    for (let r = 0; r < SIZE; r++) {
      grid[r] = [];
      for (let c = 0; c < SIZE; c++) {
        let t;
        do { t = rand(NUM_TYPES); } while (createsMatchAt(r, c, t));
        grid[r][c] = makeCandy(r, c, t);
      }
    }
    if (!hasValidMove()) shuffleBoard();
  }

  function createsMatchAt(r, c, t) {
    if (c >= 2 && grid[r][c-1] && grid[r][c-2] &&
        grid[r][c-1].type === t && grid[r][c-2].type === t) return true;
    if (r >= 2 && grid[r-1] && grid[r-2] && grid[r-1][c] && grid[r-2][c] &&
        grid[r-1][c].type === t && grid[r-2][c].type === t) return true;
    return false;
  }

  // --- Eşleşme bulma: yatay/dikey 3+ koşuları ---
  function findRuns() {
    const runs = [];
    // yatay
    for (let r = 0; r < SIZE; r++) {
      let start = 0;
      for (let c = 1; c <= SIZE; c++) {
        const same = c < SIZE && grid[r][c] && grid[r][start] &&
                     grid[r][c].special !== BOMB && grid[r][start].special !== BOMB &&
                     grid[r][c].type === grid[r][start].type;
        if (!same) {
          if (c - start >= 3 && grid[r][start]) {
            const cells = [];
            for (let i = start; i < c; i++) cells.push({ r, c: i });
            runs.push({ cells, dir: 'h' });
          }
          start = c;
        }
      }
    }
    // dikey
    for (let c = 0; c < SIZE; c++) {
      let start = 0;
      for (let r = 1; r <= SIZE; r++) {
        const same = r < SIZE && grid[r][c] && grid[start][c] &&
                     grid[r][c].special !== BOMB && grid[start][c].special !== BOMB &&
                     grid[r][c].type === grid[start][c].type;
        if (!same) {
          if (r - start >= 3 && grid[start][c]) {
            const cells = [];
            for (let i = start; i < r; i++) cells.push({ r: i, c });
            runs.push({ cells, dir: 'v' });
          }
          start = r;
        }
      }
    }
    return runs;
  }

  // --- Bir hücreyi patlat; özel şekerlerin alan etkilerini kuyruğa ekle ---
  function collectClears(runs, swapPos) {
    // key -> true; özel etkiler zincirleme yayılır
    const toClear = new Set();
    const specialQueue = [];
    const newSpecials = []; // {r, c, type, special}

    for (const run of runs) {
      const len = run.cells.length;
      // 4'lü → çizgili, 5'li → bomba. Yeni özel şeker, mümkünse takas edilen konumda doğar.
      if (len >= 4) {
        let spawn = run.cells.find(p => swapPos && p.r === swapPos.r && p.c === swapPos.c)
                 || run.cells[Math.floor(len / 2)];
        const t = grid[run.cells[0].r][run.cells[0].c].type;
        const spec = len >= 5 ? BOMB : (run.dir === 'h' ? STRIPED_V : STRIPED_H);
        newSpecials.push({ r: spawn.r, c: spawn.c, type: t, special: spec });
      }
      for (const p of run.cells) addClear(p.r, p.c, toClear, specialQueue);
    }

    // Özel şeker etkilerini zincirleme işle
    while (specialQueue.length) {
      const { r, c, special, type } = specialQueue.shift();
      if (special === STRIPED_H) {
        for (let i = 0; i < SIZE; i++) addClear(r, i, toClear, specialQueue);
      } else if (special === STRIPED_V) {
        for (let i = 0; i < SIZE; i++) addClear(i, c, toClear, specialQueue);
      } else if (special === BOMB) {
        // Bomba kendiliğinden bir koşuya girmez; en çok bulunan rengi temizle
        const counts = {};
        for (let rr = 0; rr < SIZE; rr++)
          for (let cc = 0; cc < SIZE; cc++)
            if (grid[rr][cc] && grid[rr][cc].special !== BOMB)
              counts[grid[rr][cc].type] = (counts[grid[rr][cc].type] || 0) + 1;
        let best = type, bestN = -1;
        for (const k in counts) if (counts[k] > bestN) { bestN = counts[k]; best = +k; }
        for (let rr = 0; rr < SIZE; rr++)
          for (let cc = 0; cc < SIZE; cc++)
            if (grid[rr][cc] && grid[rr][cc].type === best)
              addClear(rr, cc, toClear, specialQueue);
      }
    }

    // Yeni doğan özel şekerlerin hücrelerini temizleme listesinden çıkar
    for (const s of newSpecials) toClear.delete(s.r + ',' + s.c);
    return { toClear, newSpecials };
  }

  function addClear(r, c, toClear, specialQueue) {
    const key = r + ',' + c;
    if (toClear.has(key) || !grid[r][c]) return;
    toClear.add(key);
    const cell = grid[r][c];
    if (cell.special !== NORMAL) {
      specialQueue.push({ r, c, special: cell.special, type: cell.type });
    }
  }

  // --- Bomba takası: bombayla takas edilen rengin tamamını patlat ---
  function bombSwapClears(bombPos, otherPos) {
    const toClear = new Set();
    const specialQueue = [];
    const other = grid[otherPos.r][otherPos.c];
    addClear(bombPos.r, bombPos.c, toClear, specialQueue);
    // kuyruktan bombayı çıkar; hedef rengi elle temizleyeceğiz
    specialQueue.length = 0;
    if (other.special === BOMB) {
      // çifte bomba: her şeyi temizle
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++) addClear(r, c, toClear, specialQueue);
    } else {
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (grid[r][c] && grid[r][c].type === other.type)
            addClear(r, c, toClear, specialQueue);
    }
    // zincirleme özel etkiler
    while (specialQueue.length) {
      const { r, c, special } = specialQueue.shift();
      if (special === STRIPED_H) for (let i = 0; i < SIZE; i++) addClear(r, i, toClear, specialQueue);
      else if (special === STRIPED_V) for (let i = 0; i < SIZE; i++) addClear(i, c, toClear, specialQueue);
      else if (special === BOMB && !(r === bombPos.r && c === bombPos.c)) {
        for (let rr = 0; rr < SIZE; rr++)
          for (let cc = 0; cc < SIZE; cc++) addClear(rr, cc, toClear, specialQueue);
      }
    }
    return { toClear, newSpecials: [] };
  }

  // --- Patlatma + puan + animasyon ---
  function clearCells({ toClear, newSpecials }, chainMult) {
    const n = toClear.size;
    if (n === 0 && newSpecials.length === 0) return 0;
    const gained = n * 10 * chainMult;

    let fr = 0, fc = 0;
    for (const key of toClear) {
      const [r, c] = key.split(',').map(Number);
      fr += r; fc += c;
      const cell = grid[r][c];
      if (!cell) continue;
      cell.el.classList.add('pop');
      const el = cell.el;
      setTimeout(() => el.remove(), 320);
      grid[r][c] = null;
    }

    // Özel şekere dönüşen hücreler
    for (const s of newSpecials) {
      const cell = grid[s.r][s.c];
      if (cell) {
        cell.special = s.special;
        setCandyFace(cell.el, cell.type, cell.special);
      }
    }

    if (n > 0) {
      showFloatScore(gained, (fr / n) * cellPx(), (fc / n) * cellPx());
      score += gained;
      updateHud();
    }
    return n;
  }

  function showFloatScore(points, top, left) {
    const el = document.createElement('div');
    el.className = 'score-float';
    el.textContent = '+' + points;
    el.style.top = top + 'px';
    el.style.left = (left + cellPx() * 0.2) + 'px';
    boardEl.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }

  // --- Yerçekimi + yeni şekerler ---
  function dropAndFill() {
    for (let c = 0; c < SIZE; c++) {
      let write = SIZE - 1;
      for (let r = SIZE - 1; r >= 0; r--) {
        if (grid[r][c]) {
          if (write !== r) {
            grid[write][c] = grid[r][c];
            grid[r][c] = null;
            positionEl(grid[write][c].el, write, c);
          }
          write--;
        }
      }
      // üstten yenilerini doldur
      let spawn = -1;
      for (let r = write; r >= 0; r--) {
        const t = rand(NUM_TYPES);
        const cell = makeCandy(spawn, c, t);
        // önce ekran dışına koy, sonra hedefe düşür
        cell.el.style.top = (spawn * cellPx()) + 'px';
        grid[r][c] = cell;
        const targetR = r;
        requestAnimationFrame(() => requestAnimationFrame(() => positionEl(cell.el, targetR, c)));
        spawn--;
      }
    }
  }

  // --- Ana çözümleme döngüsü: eşleş → patlat → düşür → tekrarla ---
  async function resolveBoard(initialClears) {
    busy = true;
    let chain = 1;
    let clears = initialClears || null;

    while (true) {
      if (!clears) {
        const runs = findRuns();
        if (runs.length === 0) break;
        clears = collectClears(runs, null);
      }
      clearCells(clears, chain);
      clears = null;
      chain++;
      await wait(330);
      dropAndFill();
      await wait(330);
    }

    if (!hasValidMove()) {
      await wait(300);
      shuffleBoard();
    }
    busy = false;
    checkEndState();
  }

  const wait = ms => new Promise(res => setTimeout(res, ms));

  // --- Hamle kontrolü ---
  function hasValidMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] && grid[r][c].special === BOMB) return true;
        if (c < SIZE - 1 && trySwapCheck(r, c, r, c + 1)) return true;
        if (r < SIZE - 1 && trySwapCheck(r, c, r + 1, c)) return true;
      }
    }
    return false;
  }

  function trySwapCheck(r1, c1, r2, c2) {
    const a = grid[r1][c1], b = grid[r2][c2];
    if (!a || !b) return false;
    grid[r1][c1] = b; grid[r2][c2] = a;
    const ok = findRuns().length > 0;
    grid[r1][c1] = a; grid[r2][c2] = b;
    return ok;
  }

  function shuffleBoard() {
    // türleri topla, karıştır, eşleşmesiz yeniden dağıt
    const cells = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c]) cells.push(grid[r][c]);
    let tries = 0;
    do {
      for (let i = cells.length - 1; i > 0; i--) {
        const j = rand(i + 1);
        [cells[i], cells[j]] = [cells[j], cells[i]];
      }
      let k = 0;
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (grid[r][c]) grid[r][c] = cells[k++];
      tries++;
    } while ((findRuns().length > 0 || !hasValidMove()) && tries < 50);

    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c]) positionEl(grid[r][c].el, r, c);
  }

  // --- Takas ---
  async function attemptSwap(p1, p2) {
    if (busy || gameOver) return;
    const a = grid[p1.r][p1.c], b = grid[p2.r][p2.c];
    if (!a || !b) return;
    busy = true;

    // görsel takas
    swapCells(p1, p2);
    await wait(280);

    const aIsBomb = grid[p2.r][p2.c].special === BOMB;
    const bIsBomb = grid[p1.r][p1.c].special === BOMB;
    let clears = null;

    if (aIsBomb || bIsBomb) {
      const bombPos = aIsBomb ? p2 : p1;
      const otherPos = aIsBomb ? p1 : p2;
      clears = bombSwapClears(bombPos, otherPos);
    } else {
      const runs = findRuns();
      if (runs.length === 0) {
        // geçersiz hamle: geri al
        swapCells(p1, p2);
        await wait(280);
        busy = false;
        return;
      }
      clears = collectClears(runs, p2);
    }

    moves--;
    updateHud();
    await resolveBoard(clears);
  }

  function swapCells(p1, p2) {
    const a = grid[p1.r][p1.c], b = grid[p2.r][p2.c];
    grid[p1.r][p1.c] = b;
    grid[p2.r][p2.c] = a;
    positionEl(a.el, p2.r, p2.c);
    positionEl(b.el, p1.r, p1.c);
  }

  // --- HUD & seviye ---
  function updateHud() {
    scoreEl.textContent = score;
    movesEl.textContent = moves;
    levelEl.textContent = level;
    targetEl.textContent = target;
    progressEl.style.width = Math.min(100, (score / target) * 100) + '%';
  }

  function checkEndState() {
    if (gameOver) return;
    if (score >= target) {
      gameOver = true;
      modalTitle.textContent = 'Seviye Tamamlandı! 🎉';
      modalText.textContent = `Skor: ${score} — Seviye ${level + 1} seni bekliyor!`;
      modalBtn.textContent = 'Sonraki Seviye';
      modalBtn.onclick = nextLevel;
      overlay.classList.add('show');
    } else if (moves <= 0) {
      gameOver = true;
      modalTitle.textContent = 'Hamleler Bitti 😢';
      modalText.textContent = `Skor: ${score} / ${target}. Tekrar dene!`;
      modalBtn.textContent = 'Yeniden Başla';
      modalBtn.onclick = restart;
      overlay.classList.add('show');
    }
  }

  function nextLevel() {
    level++;
    target = Math.round(target * 1.6 / 100) * 100;
    moves = 20 + Math.min(10, level * 2);
    score = 0;
    gameOver = false;
    overlay.classList.remove('show');
    updateHud();
    initBoard();
  }

  function restart() {
    level = 1;
    target = 1000;
    moves = 20;
    score = 0;
    gameOver = false;
    overlay.classList.remove('show');
    updateHud();
    initBoard();
  }

  // --- Girdi: tıklama ve sürükleme (fare + dokunmatik) ---
  function posFromEvent(e) {
    const rect = boardEl.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    const c = Math.floor(x / cellPx());
    const r = Math.floor(y / cellPx());
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return null;
    return { r, c };
  }

  let dragStart = null;

  function onDown(e) {
    if (busy || gameOver) return;
    const p = posFromEvent(e);
    if (!p) return;
    dragStart = p;

    if (selected) {
      const dr = Math.abs(selected.r - p.r), dc = Math.abs(selected.c - p.c);
      if (dr + dc === 1) {
        const from = selected;
        clearSelection();
        dragStart = null;
        attemptSwap(from, p);
        return;
      }
      clearSelection();
    }
    if (grid[p.r][p.c]) {
      selected = p;
      grid[p.r][p.c].el.classList.add('selected');
    }
    e.preventDefault();
  }

  function onMove(e) {
    if (!dragStart || busy || gameOver) return;
    const p = posFromEvent(e);
    if (!p) return;
    const dr = p.r - dragStart.r, dc = p.c - dragStart.c;
    if (Math.abs(dr) + Math.abs(dc) >= 1) {
      // baskın eksende bir adım
      const step = Math.abs(dr) > Math.abs(dc)
        ? { r: dragStart.r + Math.sign(dr), c: dragStart.c }
        : { r: dragStart.r, c: dragStart.c + Math.sign(dc) };
      const from = dragStart;
      dragStart = null;
      clearSelection();
      attemptSwap(from, step);
    }
    e.preventDefault();
  }

  function onUp() { dragStart = null; }

  function clearSelection() {
    if (selected && grid[selected.r][selected.c]) {
      grid[selected.r][selected.c].el.classList.remove('selected');
    }
    selected = null;
  }

  boardEl.addEventListener('mousedown', onDown);
  boardEl.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  boardEl.addEventListener('touchstart', onDown, { passive: false });
  boardEl.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);

  window.addEventListener('resize', () => {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c]) positionEl(grid[r][c].el, r, c);
  });

  // --- Başlat ---
  updateHud();
  initBoard();
})();
</script>
</body>
</html>
