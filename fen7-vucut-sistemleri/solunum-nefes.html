<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soluk Al, Soluk Ver · Solunum Sistemi Simülasyonu</title>
<link rel="stylesheet" href="assets/zd.css">
<style>
  .zd-body{padding:2px 16px 16px}
  .sim{display:grid;grid-template-columns:268px minmax(0,1fr) 318px;grid-template-rows:auto minmax(0,1fr);gap:10px 12px;
    height:clamp(500px,calc(100vh - 190px),900px)}
  .bar{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .bar .sp{flex:1}
  .lbl-s{font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase}
  .sim .zd-seg button{min-height:44px;padding:8px 15px;font-size:13.5px}
  .sim .zd-seg.dis{opacity:.4;pointer-events:none}
  .tgl{display:inline-flex;align-items:center;gap:9px;padding:6px 14px 6px 7px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--line);
    font-size:13.5px;font-weight:600;color:var(--muted);min-height:44px;transition:.2s var(--ease)}
  .tgl i{width:40px;height:24px;border-radius:99px;background:#24384f;position:relative;transition:.25s;flex:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
  .tgl i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#cfe0f2;transition:.3s var(--spring)}
  .tgl.on{color:var(--text);border-color:rgba(47,227,155,.45)}
  .tgl.on i{background:linear-gradient(180deg,#3ff0a8,#16b979)}
  .tgl.on i::after{left:19px;background:#fff}
  .tgl.dis{opacity:.4;pointer-events:none}

  .lp,.rp{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
  .mp{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:auto;scrollbar-width:thin}
  .mp>.card{padding:14px 15px}
  .card{background:linear-gradient(180deg,rgba(26,48,76,.72),rgba(14,30,50,.72));border:1px solid var(--line);border-radius:18px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 34px rgba(0,0,0,.28)}
  .ttl{font-size:11.5px;font-weight:800;letter-spacing:1.8px;color:var(--cyan);text-transform:uppercase}

  /* sahne */
  .scene{position:relative;min-height:0;min-width:0;border-radius:22px;overflow:hidden;
    background:radial-gradient(55% 60% at 45% 52%,rgba(53,238,252,.08),transparent 70%),radial-gradient(30% 30% at 88% 84%,rgba(255,59,85,.07),transparent 70%),rgba(3,10,20,.38);
    border:1px solid var(--line);box-shadow:inset 0 0 40px rgba(53,238,252,.05)}
  .scene svg,.scene canvas{position:absolute;inset:0;width:100%;height:100%}
  .scene canvas{pointer-events:none}
  .scene svg text{font-family:var(--font)}
  .scene .part{transition:filter .2s}
  .scene.pick .part{cursor:pointer}
  .scene.pick .part:hover{filter:url(#fHover)}
  .scene .part.sel{filter:url(#fSel)!important}
  .scene .part.okf{filter:url(#fOk)!important}
  .scene .part.badf{filter:url(#fBad)!important}
  #labels{transition:opacity .35s}
  .scene.nolabels #labels{opacity:0;pointer-events:none}
  .lbl rect{fill:rgba(7,20,37,.86);stroke:rgba(53,238,252,.55);stroke-width:1.3}
  .lbl text{fill:#eef6ff;font-size:16px;font-weight:700}
  .lbl text .sub{font-size:12.5px;font-weight:600}
  .lbl .ld{stroke:rgba(53,238,252,.75);stroke-width:1.6;fill:none}
  .lbl .ldot{fill:#35eefc;stroke:#04222a;stroke-width:1.5}
  .lbl.info rect{fill:rgba(7,20,37,.6);stroke-dasharray:4 3}
  .lbl.sel rect,.lbl.okf rect{stroke:#fff;stroke-width:2}
  .scene-tag{position:absolute;left:14px;top:12px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:2}
  .ph-pill{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:1.4px;background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--muted);transition:.3s}
  .ph-pill.p-in{color:#04262c;background:linear-gradient(180deg,#9ff8ff,#35eefc);border-color:#35eefc;box-shadow:0 0 18px rgba(53,238,252,.45)}
  .ph-pill.p-out{color:#fff;background:linear-gradient(180deg,#b993ff,#7c4dff);border-color:#b993ff;box-shadow:0 0 18px rgba(168,121,255,.45)}
  .ph-pill.p-hold{color:#3a2300;background:linear-gradient(180deg,#ffd36b,#ffa41b);border-color:#ffd36b;box-shadow:0 0 18px rgba(255,187,61,.45)}

  /* basılı tut butonu */
  .holdwrap{display:flex;flex-direction:column;gap:6px}
  .hold{position:relative;width:100%;min-height:70px;border-radius:22px;overflow:hidden;display:flex;align-items:center;gap:12px;padding:10px 16px;
    background:linear-gradient(180deg,#1d4166,#10253e);border:2px solid rgba(73,243,255,.85);color:#fff;
    box-shadow:0 0 0 1px rgba(53,238,252,.25),0 0 22px rgba(53,238,252,.38),0 7px 0 rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.16);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .14s var(--ease),box-shadow .2s,border-color .2s}
  .hold:hover{filter:brightness(1.06)}
  .hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(53,238,252,.18),rgba(53,238,252,.42));pointer-events:none}
  .hold .fill::after{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:#bff8ff;box-shadow:0 0 12px #35eefc}
  .hold.on{transform:translateY(5px);border-color:#3ff0a8;box-shadow:0 0 0 1px rgba(47,227,155,.45),0 0 36px rgba(47,227,155,.55),0 2px 0 rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.16)}
  .hold.on .fill{background:linear-gradient(90deg,rgba(47,227,155,.22),rgba(47,227,155,.5))}
  .hold .ic{width:48px;height:48px;flex:none;position:relative;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
  .hold .t{position:relative;text-align:left;display:flex;flex-direction:column;gap:2px;line-height:1.15}
  .hold .t b{font-size:16px;font-weight:800;letter-spacing:.3px}
  .hold .t small{font-size:12.5px;color:#bfe9f5;font-weight:500}
  .hold.ring{animation:hring 1.4s infinite}
  @keyframes hring{50%{box-shadow:0 0 0 6px rgba(53,238,252,.25),0 0 30px rgba(53,238,252,.55),0 7px 0 rgba(0,0,0,.38)}}
  .zd-howto strong{color:#fff;font-weight:800}
  kbd{font-family:var(--font);font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}

  /* bilgi kartı */
  .info .hd{display:flex;align-items:center;gap:10px;margin:8px 0 6px}
  .info .sw{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.08),0 0 12px currentColor}
  .info h3{font-size:20px;font-weight:800;line-height:1.15}
  .info .sub2{font-size:12.5px;color:var(--amber);font-weight:600;margin:-2px 0 6px}
  .info p{font-size:14px;line-height:1.52;color:#d3e3f3}
  .info .src{font-size:11px;color:var(--dim);margin-top:8px}
  .info{flex:1}
  .ktop{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .kcnt{font-size:12px;font-weight:700;color:var(--muted)} .kcnt b{color:var(--green);font-size:15px}
  .info .analog{margin-top:8px;padding:8px 10px;border-radius:12px;background:rgba(95,200,74,.1);border:1px solid rgba(95,200,74,.35);font-size:13.5px;color:#d8ffc8}
  .info .analog b{color:#bdf5a0}
  .prog{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted);font-weight:600}
  .prog .zd-meter{flex:1;height:8px}
  .tree .row{display:flex;gap:10px;align-items:center}
  .tree svg{width:96px;height:108px;flex:none}
  .tree ul{list-style:none;display:grid;gap:6px;flex:1}
  .tree li{font-size:13.5px;line-height:1.2;padding:5px 9px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);cursor:pointer;transition:.2s;min-height:44px;display:flex;flex-direction:column;justify-content:center}
  .tree li:hover{border-color:var(--line-2);background:rgba(53,238,252,.08)}
  .tree li b{font-weight:800;color:#bdf5a0}
  .tree li span{color:#d6e4f3}

  /* antrenör */
  .story{padding:11px 14px!important}
  .story p{font-size:13.5px;line-height:1.45;color:#d6e4f3;margin-top:7px}
  .ringwrap{position:relative;width:136px;height:136px;margin:0 auto}
  .ringwrap svg{width:100%;height:100%}
  .ringwrap .trk{fill:none;stroke:rgba(255,255,255,.08);stroke-width:12}
  .ringwrap .trk2{fill:none;stroke-width:3;transition:stroke .25s}
  .ringwrap .arc{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke .3s}
  .ringwrap .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .ringwrap .rc b{font-size:40px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .ringwrap .rc span{font-size:11.5px;font-weight:800;letter-spacing:.8px;margin-top:3px;max-width:96px;line-height:1.15}
  .trsub{text-align:center;font-size:13px;color:#cfe0f2;min-height:42px;margin-top:4px;line-height:1.3}
  .trsub .st{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800}
  .trsub .st.ok{background:rgba(47,227,155,.15);color:var(--green)}
  .trsub .st.no{background:rgba(255,84,104,.15);color:#ff8a98}
  .trsteps{display:flex;gap:6px;justify-content:center;margin-top:8px}
  .trsteps span{white-space:nowrap;font-size:11px;font-weight:800;letter-spacing:.3px;padding:5px 7px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--muted);transition:.25s}
  .trsteps span.on[data-k="in"]{color:#04262c;background:#35eefc;border-color:#35eefc}
  .trsteps span.on[data-k="hold"]{color:#3a2300;background:#ffbb3d;border-color:#ffbb3d}
  .trsteps span.on[data-k="out"]{color:#fff;background:#8f63ff;border-color:#b993ff}
  .trrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
  .trrow .zd-btn{min-height:44px}
  .heart{width:46px;height:46px;display:grid;place-items:center}
  .heart svg{width:42px;height:40px;animation:hb 1s infinite;filter:drop-shadow(0 0 10px rgba(255,77,100,.55))}
  @keyframes hb{0%,100%{transform:scale(1)}12%{transform:scale(1.18)}24%{transform:scale(.98)}36%{transform:scale(1.1)}}
  .bpm b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
  .bpm small{display:block;font-size:12px;font-weight:700}
  .uy{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:8px}
  .uy .zd-meter{flex:1}
  .uy b{color:var(--text);min-width:40px;text-align:right}

  /* görev */
  .task .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .dots{display:flex;gap:5px}
  .dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.12);transition:.3s}
  .dots i.cur{background:transparent;box-shadow:0 0 0 2px var(--cyan)}
  .dots i.ok{background:var(--green);box-shadow:0 0 8px rgba(47,227,155,.6)}
  .dots i.late{background:var(--amber)}
  .task h3{font-size:19px;font-weight:800;line-height:1.3;margin:12px 0 6px}
  .task .hint{font-size:13.5px;color:var(--muted);line-height:1.45}
  .fb{margin-top:10px;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.5;display:none}
  .fb.bad{display:block;background:rgba(255,84,104,.1);border:1px solid rgba(255,84,104,.4);color:#ffd0d6}
  .fb.good{display:block;background:rgba(47,227,155,.1);border:1px solid rgba(47,227,155,.4);color:#c9ffe6}
  .task .acts{display:flex;gap:8px;margin-top:12px}

  /* ortam */
  .opt{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .opt .zd-seg{width:100%}
  .opt .zd-seg button{flex:1}
  .cnt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cnt div{padding:9px 10px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
  .cnt b{display:block;font-size:26px;font-weight:900;line-height:1.05;color:var(--green);font-variant-numeric:tabular-nums}
  .cnt .bad b{color:#ff8a98}
  .cnt span{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.25;display:block;margin-top:2px}
  .envmsg{font-size:13.5px;line-height:1.45;color:#d6e4f3;margin-top:10px}
  .tips{display:grid;gap:7px}
  .tip{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line);font-size:13.5px;line-height:1.35;color:#d6e4f3}
  .tip svg{width:30px;height:30px;flex:none;color:var(--cyan)}
  .note{font-size:12.5px;line-height:1.45;color:#cfe9d6;padding:10px 12px;border-radius:14px;background:linear-gradient(180deg,rgba(47,227,155,.12),rgba(47,227,155,.05));border:1px solid rgba(47,227,155,.35)}
  .note b{color:#7ff0c0}

  /* sağ panel */
  .st{padding:11px 11px}
  .st-hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .st-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:8px 0 6px;padding:3px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
  .st-tabs button{min-height:30px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted);transition:.2s}
  .st-tabs button.on[data-t="in"]{background:linear-gradient(180deg,#bff8ff,#35eefc);color:#04262c}
  .st-tabs button.on[data-t="out"]{background:linear-gradient(180deg,#c9b0ff,#8f63ff);color:#fff}
  .st-list{list-style:none;display:grid;gap:3px}
  .st-list li{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:10px;font-size:13.3px;line-height:1.25;color:#6f8aa8;border:1px solid transparent;transition:color .3s,background .3s,border-color .3s}
  .st-list li i{width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.14);color:transparent;transition:.3s var(--spring)}
  .st-list li i svg{width:13px;height:13px}
  .st-list li.on{color:#eef6ff;background:rgba(47,227,155,.07);border-color:rgba(47,227,155,.22)}
  .st-list li.on i{background:var(--green);border-color:var(--green);color:#03291b;box-shadow:0 0 10px rgba(47,227,155,.6)}
  .st-list.out li.on{background:rgba(168,121,255,.08);border-color:rgba(168,121,255,.25)}
  .st-list.out li.on i{background:#a879ff;border-color:#a879ff;color:#fff;box-shadow:0 0 10px rgba(168,121,255,.6)}
  .st-list li.pop i{animation:pop .5s var(--spring)}
  @keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
  .spc{padding:11px 11px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
  .sp-hd{display:flex;align-items:baseline;justify-content:space-between}
  .sp-hd b{font-size:20px;font-weight:900;color:var(--cyan);font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(53,238,252,.4)}
  #spiro{width:100%;height:84px;flex:1 1 0;min-height:40px;max-height:170px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
  .cav{display:grid;grid-template-columns:96px 1fr 76px;gap:8px;align-items:center;font-size:12.5px;color:#c9d8ea;font-weight:600}
  .cav .b2{height:9px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden}
  .cav .b2 i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#14c3dc,#35eefc);box-shadow:0 0 10px rgba(53,238,252,.5)}
  .cav .b2.am i{background:linear-gradient(90deg,#ffa41b,#ffd36b);box-shadow:0 0 10px rgba(255,187,61,.5)}
  .cav em{font-style:normal;font-size:12px;font-weight:800;text-align:right;color:var(--muted)}
  .cav em.up{color:var(--green)} .cav em.dn{color:#ff9aa8}
  .rate{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-size:12.5px;color:#c9d8ea;font-weight:600}
  .rate b{font-size:19px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
  .rate em{font-style:normal;margin-left:auto;font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--amber)}
  .rdot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e9ffff,#35eefc 60%,#0a8fa3);box-shadow:0 0 10px #35eefc;flex:none}

  .m-kesif [data-stat="s1"]{min-width:150px}
  /* duyarlı */
  @media (max-width:1100px){ .sim{grid-template-columns:250px minmax(0,1fr) 270px} }
  @media (max-width:860px){
    .zd-body{padding:2px 10px 12px}
    .sim{grid-template-columns:minmax(0,1fr);height:auto;gap:10px}
    .scene{aspect-ratio:820/680;height:auto}
    .lp .holdwrap{order:-1}
    .mp{overflow:visible}
    #modeSeg{display:grid;grid-template-columns:1fr 1fr;width:100%;border-radius:18px}
    #modeSeg button{white-space:normal;line-height:1.2}
    .bar .sp{display:none}
    .bar{gap:8px}
    #actSeg{flex:1}
    #actSeg button{flex:1;padding:8px 8px}
    .zd-stat .v{font-size:19px}
    .zd-stat{padding:0 8px}
    .zd-stat .l{font-size:9.5px;letter-spacing:.8px}
    .zd-title h1{font-size:19px}
    .scene-tag{left:8px;top:8px}
    .ph-pill{font-size:10.5px;padding:4px 9px}
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/zd.js"></script>
<script>
(function(){
'use strict';
const {$,$$,clamp,lerp} = ZD;
const CX=350, VW=820, VH=680;
const f1=n=>Math.round(n*10)/10;
const DEG=Math.PI/180;

/* =====================  KİTAP BİLGİLERİ  ===================== */
const INFO={
  burun:{name:'Burun',color:'#ff9aa8',text:'Solunum sistemi burunla başlar. Vücuda burundan giren hava, solunum sistemini dolaştıktan sonra tekrar burundan çıkar. Burnun iç yüzeyinde bulunan mukus sıvısı kuru havayı nemlendirirken kılcal damarlar havayı ısıtır. Burundaki kıllar havada bulunan toz ve mikropları tutarak havayı temizlemeye yardımcı olur.',short:'Mukus kuru havayı nemlendirir, kılcal damarlar ısıtır, kıllar toz ve mikropları tutar.'},
  yutak:{name:'Yutak',color:'#ff7f95',text:'Burun ve ağız boşluklarının arkasında yer alan, soluk borusu ile yemek borusunu birleştiren esnek bir yapıdır. Burundan gelen hava buradan gırtlağa geçer.',short:'Burun ve ağız boşluklarının arkasında; soluk borusu ile yemek borusunu birleştirir.'},
  girtlak:{name:'Gırtlak',color:'#cfe3ff',text:'Yutakla soluk borusu arasında bulunur. Esnek ve kıkırdak yapıdadır. Gırtlağın yapısında ses telleri bulunur. Bu teller sesin oluşmasını sağlar.',short:'Yutak ile soluk borusu arasındadır; ses telleri burada bulunur.'},
  soluk:{name:'Soluk borusu',color:'#e8f2ff',text:'Alınan havanın akciğerlere ulaşmasını sağlayan yapıdır. Kıkırdak yapıdadır. Gırtlak ile akciğerler arasında bulunur.',short:'Gırtlak ile akciğerler arasındaki kıkırdak yapılı boru; havayı akciğerlere ulaştırır.'},

function cm(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return [0,1].map(j=>.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3));}
function crPath(pts,closed){
  const n=pts.length,g=i=>closed?pts[(i+n)%n]:pts[Math.max(0,Math.min(n-1,i))];
  let d=`M${f1(pts[0][0])} ${f1(pts[0][1])}`;const last=closed?n:n-1;
  for(let i=0;i<last;i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    d+=`C${f1(p1[0]+(p2[0]-p0[0])/6)} ${f1(p1[1]+(p2[1]-p0[1])/6)} ${f1(p2[0]-(p3[0]-p1[0])/6)} ${f1(p2[1]-(p3[1]-p1[1])/6)} ${f1(p2[0])} ${f1(p2[1])}`;}
  return closed?d+'Z':d;
}
function crSample(pts,per){const n=pts.length,g=i=>pts[Math.max(0,Math.min(n-1,i))],o=[];
  for(let i=0;i<n-1;i++)for(let k=0;k<per;k++)o.push(cm(g(i-1),g(i),g(i+1),g(i+2),k/per));o.push(pts[n-1].slice());return o;}
function yAt(poly,x){if(x<=poly[0][0])return poly[0][1];for(let i=1;i<poly.length;i++){if(x<=poly[i][0]){const a=poly[i-1],c=poly[i];return lerp(a[1],c[1],(x-a[0])/((c[0]-a[0])||1));}}return poly[poly.length-1][1];}
function bez(p,t){const u=1-t;return [0,1].map(j=>u*u*u*p[0][j]+3*u*u*t*p[1][j]+3*u*t*t*p[2][j]+t*t*t*p[3][j]);}
function cum(pts){const c=[0];for(let i=1;i<pts.length;i++)c.push(c[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return c;}
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};}

const testCtx=document.createElement('canvas').getContext('2d');
function buildTree(side,hil,lobars,seed){
  const path=new Path2D(crPath(lungPts(side<0?LUNG.R:LUNG.L,0),true));
  const inside=(x,y)=>[[0,0],[7,0],[-7,0],[0,7],[0,-7]].every(([a,c])=>testCtx.isPointInPath(path,x+a,y+c));
  const R=rng(seed),segs=[],tips=[];
  function grow(x,y,ang,len,lvl,chain){
    let L=len,ex,ey,ok=false;
    for(let k=0;k<4;k++){ex=x+Math.cos(ang)*L;ey=y+Math.sin(ang)*L;if(inside(ex,ey)){ok=true;break;}L*=.72;}
    if(!ok)return false;
    const bend=(R()-.5)*9,mx=(x+ex)/2-Math.sin(ang)*bend,my=(y+ey)/2+Math.cos(ang)*bend;
    segs.push({x1:x,y1:y,cx:mx,cy:my,x2:ex,y2:ey,lvl});
    const ch=chain.concat([[mx,my],[ex,ey]]);
    if(lvl>=3){tips.push({x:ex,y:ey,chain:ch});return true;}
    const sp=.36+R()*.2;
    const a=grow(ex,ey,ang-sp,len*.68,lvl+1,ch),c=grow(ex,ey,ang+sp,len*.68,lvl+1,ch);
    if(!a&&!c)tips.push({x:ex,y:ey,chain:ch});
    return true;
  }
  lobars.forEach(([a,l])=>grow(hil[0],hil[1],a*DEG,l,1,[[hil[0],hil[1]]]));
  return {segs,tips};
}

let VS=1,VOX=0,VOY=0,DPR=1,CW=0,CH=0;
function resize(){
  const r=scene.getBoundingClientRect();DPR=Math.min(2,devicePixelRatio||1);CW=r.width;CH=r.height;
  cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);
  VS=Math.min(r.width/VW,r.height/VH);VOX=(r.width-VW*VS)/2;VOY=(r.height-VH*VS)/2;
  const sp=$('#spiro'),sr=sp.getBoundingClientRect();sp.width=Math.round(sr.width*DPR);sp.height=Math.round(sr.height*DPR);
}
function sprite(core,glow,rim){const c=document.createElement('canvas');c.width=c.height=48;const g=c.getContext('2d');const gr=g.createRadialGradient(24,24,0,24,24,24);
  gr.addColorStop(0,glow);gr.addColorStop(.62,glow.replace(/[\d.]+\)$/,'0.12)'));gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,48,48);
  g.fillStyle=rim||'rgba(3,16,30,.7)';g.beginPath();g.arc(24,24,10.5,0,7);g.fill();
  const cg=g.createRadialGradient(20,20,1,24,24,9);cg.addColorStop(0,'#fff');cg.addColorStop(.35,core);cg.addColorStop(1,core);g.fillStyle=cg;g.beginPath();g.arc(24,24,8.6,0,7);g.fill();
  g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.arc(20.5,20.5,2.4,0,7);g.fill();return c;}

function spawnDust(){dust.push({x:150+Math.random()*92,y:86+Math.random()*120,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,st:'air',r:2.4+Math.random()*1.8,soot:Math.random()<.45});}
/* büyüteç */
const CAPSM=CAPS.map(c=>{const s=crSample(c,8);return{s,c:cum(s)};});
const CAPPTS=[];CAPSM.forEach(c=>c.s.forEach(p=>CAPPTS.push(p)));
const cells=Array.from({length:18},(_,i)=>({c:i%3,s:Math.random()}));
const gas=[];let gasAcc=0,co2Acc=0;
function nearCap(x,y){let best=null,bd=1e9;for(const p of CAPPTS){const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd&&d>4){bd=d;best=p;}}return best;}
function spawnGas(kind){
  const a=ALV[(Math.random()*6)|0],ang=Math.random()*6.28,rr=Math.random()*a[2]*.5;const ip=[a[0]+Math.cos(ang)*rr,a[1]+Math.sin(ang)*rr];
  const cp=nearCap(ip[0]+(Math.random()-.5)*20,ip[1]+(Math.random()-.5)*20);
  if(kind==='o2')gas.push({kind,x0:ip[0],y0:ip[1],x1:cp[0],y1:cp[1],t:0,dur:1.5+Math.random()*.6});
  else gas.push({kind,x0:cp[0],y0:cp[1],x1:ip[0],y1:ip[1],t:0,dur:1.5+Math.random()*.6});
}
function lerpCol(a,b,t){return `rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(',')})`;}
const DEOX=[91,108,255],OXY=[255,59,85];

function stepParticles(dt){
  const fl=S.flow,v=clamp(fl,-2.6,2.6)*360;
  if(fl>.05){accIn+=fl*40*dt;while(accIn>=1&&parts.length<280){accIn--;spawnAir(Math.random()<.35?'o2':'air',false);}}
  else accIn=0;
  if(fl<-.05){accOut+=-fl*36*dt;while(accOut>=1&&parts.length<280){accOut--;spawnAir(Math.random()<.58?'co2':'air',true);}}
  else accOut=0;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    if(p.free){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.life-=dt*.75;}
    else{p.s+=v*dt*(.8+.4*p.r);
      if(p.s>=p.pa.len){p.s=p.pa.len;p.life-=dt*3.5;if(!p.abs&&p.kind!=='co2'){p.abs=1;magBoost=Math.min(3,magBoost+.12);}}
      else if(p.s<=0){p.free=true;const q=posAt(p.pa,0);p.x=q[0];p.y=q[1];p.vx=-60-Math.random()*50;p.vy=(Math.random()-.5)*40;}
      if(Math.abs(fl)<.04)p.life-=dt*.3;}
    if(p.life<=0)parts.splice(i,1);}
  /* toz */
  if(S.mode==='ortam'&&S.air==='dirty'){while(dust.filter(d=>d.st==='air').length<42)spawnDust();}
  const E0=ENTRY[S.route];
  for(let i=dust.length-1;i>=0;i--){const d=dust[i];
    if(d.st==='air'){
      const dx=E0[0]-d.x,dy=E0[1]-d.y,dd=Math.hypot(dx,dy),pull=S.mode==='ortam'&&fl>.06&&dd<40+110*Math.min(1,fl);
      if(!pull){d.vx+=(Math.random()-.5)*30*dt;d.vy+=(Math.random()-.5)*30*dt;d.vx*=.98;d.vy*=.98;d.x+=d.vx*dt;d.y+=d.vy*dt;
        if(d.x<140||d.x>248)d.vx*=-1;if(d.y<70||d.y>215)d.vy*=-1;d.x=clamp(d.x,140,248);d.y=clamp(d.y,70,215);}
      if(pull){const k=Math.min(1,dt*(1.2+fl*3)*(90/(dd+20)));d.x+=dx*k;d.y+=dy*k;
        if(dd<7){const list=PATHS[S.route];d.pa=list[(Math.random()*list.length)|0];d.s=d.pa.entryS;d.st='in';d.route=S.route;
          d.trap=S.route==='nose'?Math.random()<.84:Math.random()<.14;d.trapAt=d.s+(S.route==='nose'?6+Math.random()*90:10+Math.random()*120);}}
      if(S.air!=='dirty'||S.mode!=='ortam'){d.life=(d.life??1)-dt*1.5;if(d.life<=0)dust.splice(i,1);}
    }else{
      d.s+=v*dt*.92;const q=posAt(d.pa,d.s);d.x=q[0];d.y=q[1];
      if(d.trap&&d.s>=d.trapAt){stuck.push({x:d.x+(Math.random()-.5)*5,y:d.y+(Math.random()-.5)*5,r:d.r,soot:d.soot});if(stuck.length>110)stuck.shift();S.trapped++;dust.splice(i,1);ortamStats();}
      else if(d.s>=d.pa.len-1){const t=d.pa.tip;dep.push({x:t.x+(Math.random()-.5)*12,y:t.y+(Math.random()-.5)*12,side:t.side,r:d.r*.9,soot:d.soot});if(dep.length>160)dep.shift();S.reached++;dust.splice(i,1);ortamStats();}
      else if(d.s<d.pa.entryS-2){d.st='air';}
    }}
  /* büyüteç gaz alışverişi */
  magBoost=Math.max(0,magBoost-dt*.5);
  gasAcc+=dt*(.9+1.8*S.b+magBoost);co2Acc+=dt*(.9+1.2*S.b+magBoost*.5);
  while(gasAcc>=1){gasAcc--;if(gas.length<26)spawnGas('o2');}
  while(co2Acc>=1){co2Acc--;if(gas.length<26)spawnGas('co2');}
  for(let i=gas.length-1;i>=0;i--){const g=gas[i];g.t+=dt/g.dur;if(g.t>=1.25)gas.splice(i,1);}
  cells.forEach(c=>{c.s+=dt*.14;if(c.s>1)c.s-=1;});
}
function drawParticles(){
  cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);
  cx.setTransform(DPR*VS,0,0,DPR*VS,DPR*VOX,DPR*VOY);
  /* birikmiş kirleticiler */
  for(const d of dep){const [x,y]=mapPt(d.x,d.y,d.side,S.b);cx.globalAlpha=.85;cx.drawImage(d.soot?SPR.soot:SPR.dust,x-d.r*2.6,y-d.r*2.6,d.r*5.2,d.r*5.2);}
  for(const d of stuck){cx.globalAlpha=.9;cx.fillStyle='rgba(214,224,140,.28)';cx.beginPath();cx.arc(d.x,d.y,d.r*1.9,0,7);cx.fill();cx.drawImage(d.soot?SPR.soot:SPR.dust,d.x-d.r*2.4,d.y-d.r*2.4,d.r*4.8,d.r*4.8);}
  for(const d of dust){cx.globalAlpha=d.life==null?1:clamp(d.life,0,1);cx.drawImage(d.soot?SPR.soot:SPR.dust,d.x-d.r*2.6,d.y-d.r*2.6,d.r*5.2,d.r*5.2);
    cx.strokeStyle='rgba(255,220,180,.35)';cx.lineWidth=.6;cx.beginPath();cx.arc(d.x,d.y,d.r*.95,0,7);cx.stroke();}
  /* hava parçacıkları */
  cx.font='800 11px Lexend,system-ui,sans-serif';cx.textAlign='center';
  for(const p of parts){let x,y;if(p.free){x=p.x;y=p.y;}else{[x,y]=posAt(p.pa,p.s);}
    const a=clamp(p.life,0,1);cx.globalAlpha=a;const sz=p.kind==='air'?13:15;
    cx.drawImage(SPR[p.kind],x-sz/2,y-sz/2,sz,sz);
    if(p.lab&&p.kind!=='air'){cx.globalAlpha=a*.95;cx.fillStyle=p.kind==='co2'?'#e3d4ff':'#d7f1ff';cx.strokeStyle='rgba(3,12,24,.85)';cx.lineWidth=3;cx.strokeText(p.kind==='co2'?'CO₂':'O₂',x+9,y-7);cx.fillText(p.kind==='co2'?'CO₂':'O₂',x+9,y-7);}}
  /* büyüteç */
  cx.save();cx.globalAlpha=1;cx.beginPath();cx.arc(MG.x,MG.y,MG.r-4,0,7);cx.clip();cx.translate(MG.x,MG.y);
  for(const c of cells){const cs=CAPSM[c.c];const L=cs.c[cs.c.length-1],s=c.s*L;let k=1;while(k<cs.c.length-1&&cs.c[k]<s)k++;
    const t=(s-cs.c[k-1])/((cs.c[k]-cs.c[k-1])||1),x=lerp(cs.s[k-1][0],cs.s[k][0],t),y=lerp(cs.s[k-1][1],cs.s[k][1],t);
    const u=clamp((x+80)/160,0,1);cx.fillStyle=lerpCol(DEOX,OXY,u);cx.beginPath();cx.ellipse(x,y,3.6,2.6,Math.atan2(cs.s[k][1]-cs.s[k-1][1],cs.s[k][0]-cs.s[k-1][0]),0,7);cx.fill();
    cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.arc(x,y,1.1,0,7);cx.fill();}
  cx.font='800 10px Lexend,system-ui,sans-serif';
  for(const g of gas){const t=clamp(g.t,0,1),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;const x=lerp(g.x0,g.x1,e),y=lerp(g.y0,g.y1,e);
    const al=g.t<.15?g.t/.15:g.t>1?clamp(1-(g.t-1)/.25,0,1):1;cx.globalAlpha=al;
    const o=g.kind==='o2';cx.drawImage(o?SPR.o2:SPR.co2,x-8,y-8,16,16);
    cx.fillStyle=o?'#ffffff':'#ead9ff';cx.strokeStyle='rgba(10,5,20,.85)';cx.lineWidth=2.6;cx.strokeText(o?'O₂':'CO₂',x,y-7);cx.fillText(o?'O₂':'CO₂',x,y-7);}
  cx.restore();cx.globalAlpha=1;
}

const spBuf=[];let spAcc=0;
function drawSpiro(dt){
  spAcc+=dt;if(spAcc>=1/30){spAcc=0;spBuf.push({b:S.b,d:S.flow});if(spBuf.length>360)spBuf.shift();}
  const c=$('#spiro'),g=c.getContext('2d'),w=c.width,h=c.height;g.clearRect(0,0,w,h);
  g.strokeStyle='rgba(140,200,255,.1)';g.lineWidth=1;
  for(let i=1;i<4;i++){const y=h*i/4;g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}
  for(let i=1;i<12;i++){const x=w*i/12;g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();}
  if(spBuf.length<2)return;const pad=6*DPR,X=i=>w-(spBuf.length-1-i)*(w/359),Y=b=>h-pad-b*(h-2*pad);
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(53,238,252,.32)');gr.addColorStop(1,'rgba(53,238,252,0)');
  g.beginPath();g.moveTo(X(0),h);spBuf.forEach((p,i)=>g.lineTo(X(i),Y(p.b)));g.lineTo(X(spBuf.length-1),h);g.closePath();g.fillStyle=gr;g.fill();
  g.lineWidth=2.4*DPR;g.lineCap='round';
  for(let i=1;i<spBuf.length;i++){const p=spBuf[i];g.strokeStyle=p.d>.03?'#35eefc':p.d<-.03?'#b993ff':'#8fa8c4';g.beginPath();g.moveTo(X(i-1),Y(spBuf[i-1].b));g.lineTo(X(i),Y(p.b));g.stroke();}
  const l=spBuf[spBuf.length-1];g.fillStyle='#fff';g.shadowColor='#35eefc';g.shadowBlur=10*DPR;g.beginPath();g.arc(X(spBuf.length-1)-3*DPR,Y(l.b),4*DPR,0,7);g.fill();g.shadowBlur=0;
}

const stList=$('#stList');let stShown='in',stLit=0,stTarget=0,stLast=0,stManual=false;
function renderSt(){stList.className='st-list '+stShown;stList.innerHTML=(stShown==='in'?INH:EXH).map((t,i)=>`<li class="${i<stLit?'on':''}"><i>${ZD.I.check}</i><span>${t}</span></li>`).join('');
  $$('.st-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===stShown));}

const TH=[0,.1,.24,.4,.56,.74];
function stUpdate(now){
  const ph=S.phase;let want=stShown;
  if(ph==='in'||ph==='hold')want='in';else if(ph==='out')want='out';
  if(want!==stShown&&(ph!=='rest')){stShown=want;stLit=0;stManual=false;renderSt();}
  if(!stManual){let p=null;
    if(ph==='in')p=(S.b-S.phaseB0)/Math.max(.05,1-S.phaseB0);else if(ph==='hold')p=1;else if(ph==='out')p=(S.phaseB0-S.b)/Math.max(.05,S.phaseB0);
    if(p!=null)stTarget=TH.filter(t=>p>=t).length;}
  if(stLit<stTarget&&now-stLast>140){stLit++;stLast=now;const li=stList.children[stLit-1];if(li){li.classList.add('on','pop');}}
}

function trPhase(){return TR.pi<0?PREP:TRP[TR.pi];}
function heartAnim(){const h=$('#trHeart svg');if(h)h.style.animationDuration=(60/TR.bpm).toFixed(2)+'s';}
function trTick(dt){
  if(S.mode!=='antrenor')return;
  if(TR.run){
    TR.pt+=dt;const ph=trPhase();
    let ok=null;if(ph.k!=='prep'){const want=ph.k!=='out';ok=S.holding===want;TR.tot[TR.cyc]+=dt;if(ok)TR.m[TR.cyc]+=dt;}
    if(TR.pt>=ph.d){TR.pt=0;
      if(TR.pi<0)TR.pi=0;else{TR.pi++;if(TR.pi>2){const sc=TR.tot[TR.cyc]?TR.m[TR.cyc]/TR.tot[TR.cyc]:0;TR.bpmT=Math.max(76,TR.bpmT-(4+12*sc));
          ZD.toast(`${TR.cyc+1}. döngü bitti · uyum %${Math.round(sc*100)}`,sc>=.7?'good':'',1800);ZD.sfx(sc>=.7?'good':'tap');TR.cyc++;TR.pi=0;
          ui.stat('s1',TR.cyc+'/3',true);if(TR.cyc>=3){finishTrainer();return;}}}
      ZD.sfx('pop');}
    const P2=trPhase(),C=414.7;
    $('#trArc').setAttribute('stroke-dashoffset',(C*(1-TR.pt/P2.d)).toFixed(1));$('#trArc').setAttribute('stroke',P2.col);
    $('#trSec').textContent=Math.max(1,Math.ceil(P2.d-TR.pt));$('#trLbl').textContent=P2.lbl;$('#trLbl').style.color=P2.col;
    const key=P2.k+(ok===null?'':ok?'1':'0');
    if(key!==TR.last){TR.last=key;$('#trSub').innerHTML=P2.sub+(ok===null?'':`<br><span class="st ${ok?'ok':'no'}">${ok?'Harika, doğru!':(P2.k==='out'?'Butonu bırak!':'Basılı tut!')}</span>`);
      $$('.trsteps span').forEach(s=>s.classList.toggle('on',s.dataset.k===P2.k));
      $('#trOk').setAttribute('stroke',ok===null?'rgba(255,255,255,.06)':ok?'rgba(47,227,155,.55)':'rgba(255,84,104,.55)');}
    const mm=TR.m.reduce((a,b)=>a+b,0),tt=TR.tot.reduce((a,b)=>a+b,0),uy=tt?mm/tt:0;
    $('#trMeter').style.width=(uy*100).toFixed(0)+'%';$('#trUy').textContent='%'+Math.round(uy*100);ui.stat('s2','%'+Math.round(uy*100));
  }
  const pb=Math.round(TR.bpm);TR.bpm+=(TR.bpmT-TR.bpm)*Math.min(1,dt*.5);
  if(Math.round(TR.bpm)!==pb){const b=Math.round(TR.bpm);$('#trBpm')&&($('#trBpm').textContent=b);ui.stat('s3',b);heartAnim();
    const c=$('#trCalm');if(c){c.textContent=b>104?'Heyecan: yüksek':b>90?'Heyecan: azalıyor':'Sakin ve hazır';c.style.color=b>104?'#ff8a98':b>90?'#ffbb3d':'#2fe39b';}}
}

function showTask(){const T=TASKS[G.i];G.tries=0;G.hint=false;G.armed=false;G.busy=false;
  $('#tkN').textContent=G.i+1;$('#tkQ').textContent=T.q;$('#tkH').textContent=T.act?T.h:'Sahnedeki doğru yapıya dokun.';$('#tkFb').className='fb';
  $$('#tkDots i').forEach((d,i)=>{d.className=i<G.i?(G.res[i]?'ok':'late'):i===G.i?'cur':'';});ui.stat('s1',(G.i+1)+'/8',true);}
function taskCorrect(part){
  if(G.busy)return;G.busy=true;const clean=G.tries===0&&!G.hint;const pts=clean?100+Math.min(G.streak,5)*20:40;
  if(clean){G.first++;G.streak++;}else G.streak=0;G.score+=pts;G.res[G.i]=clean;
  ui.stat('s2',G.score,true);ui.stat('s4',G.streak,true);ZD.sfx('good');
  const T=TASKS[G.i];const msg=T.act?(T.act==='in'?'Diyafram kasıldı ve düzleşti; akciğerler havayla doldu!':'Kaburgalar arasındaki kaslar gevşedi, hava dışarı atıldı!'):`${PARTNAME(part)}: ${INFO[PART2INFO(part)].short}`;
  ZD.toast(`Doğru! +${pts}`,'good',1500);$('#tkFb').className='fb good';$('#tkFb').textContent=msg;
  if(part){hl(part,'okf',1200);}
  const card=$('#taskCard');card.classList.remove('zd-glow-good');void card.offsetWidth;card.classList.add('zd-glow-good');
  setTimeout(()=>{G.i++;if(G.i>=TASKS.length)finishTasks();else showTask();},1500);

function taskWrong(part){

  else if(T.a==='akciger-sag')why+=' Bu görevde akciğerlerden birine dokunmalısın.';
  $('#tkFb').className='fb bad';$('#tkFb').textContent=why;ZD.toast('Tekrar dene!','bad',1400);
  hl(part,'badf',700);const card=$('#taskCard');card.classList.remove('zd-shake');void card.offsetWidth;card.classList.add('zd-shake');
}
function taskTick(){
  if(S.mode!=='gorev'||G.busy||G.i>=TASKS.length)return;const T=TASKS[G.i];if(!T.act)return;

/* =====================  ANA DÖNGÜ  ===================== */
let lastT=performance.now(),prevB=0;
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  /* hedef */
  let target=0,tau;const tr=S.mode==='antrenor';
  if(S.holding)target=1;
  else if(S.auto&&!tr){const T=60/RATE[S.act];S.autoT=(S.autoT+dt)%T;target=S.autoT<T*.42?1:0;}
  if(S.auto&&!S.holding&&!tr)tau=(60/RATE[S.act])*.12;else tau=target>S.b?(tr?1.25:.7):(tr?1.9:.95);
  prevB=S.b;S.b+=(target-S.b)*(1-Math.exp(-dt/tau));
  const fl=(S.b-prevB)/Math.max(dt,1e-4);S.flow=lerp(S.flow,fl,.35);
  /* aşama */
  let ph;if(target===1)ph=S.b>.965?'hold':'in';else ph=S.b>.03?'out':'rest';
  if(ph!==S.phase){const prev=S.phase;S.phase=ph;if(ph==='in'||ph==='out')S.phaseB0=prevB;if(!(prev==='in'&&ph==='hold'))phaseChanged();else phaseChanged();}
  if(Math.abs(S.b-lastDrawB)>.0006){drawAnatomy(S.b);lastDrawB=S.b;}
  drawArrows();
  /* vokal kordlar: nefeste açık */
  stepParticles(dt);drawParticles();drawSpiro(dt);stUpdate(now);
  trTick(dt);taskTick();
  /* gösterge */
  $('#holdFill').style.width=(S.b*100).toFixed(1)+'%';
  const vol=Math.round(S.b*100);$('#volV').textContent='%'+vol;if(S.mode==='kesif')ui.stat('s2','%'+vol);
  $('#cavC').style.width=(48+52*S.b).toFixed(1)+'%';$('#cavA').style.width=(100-42*S.b).toFixed(1)+'%';
  requestAnimationFrame(loop);
}
function phaseChanged(){
  const ph=S.phase,pill=$('#phPill');
  const N={in:'SOLUK ALMA',out:'SOLUK VERME',hold:'NEFES TUTULUYOR',rest:'DİNLENME'};
  pill.textContent=N[ph];pill.className='ph-pill '+(ph==='rest'?'':'p-'+ph);
  if(S.mode==='kesif')ui.stat('s1',{in:'Soluk al',out:'Soluk ver',hold:'Tut',rest:'Dinlenme'}[ph]);
  $('#stNote').textContent={in:'Şimdi',out:'Şimdi',hold:'Akciğerler dolu',rest:S.holding?'':'Butona basılı tut'}[ph];
  const ct=$('#cavCt'),at=$('#cavAt');
  if(ph==='in'){ct.textContent='Genişler ▲';ct.className='up';at.textContent='Daralır ▼';at.className='dn';}
  else if(ph==='out'){ct.textContent='Daralır ▼';ct.className='dn';at.textContent='Genişler ▲';at.className='up';}
  else if(ph==='hold'){ct.textContent='En geniş';ct.className='';at.textContent='En dar';at.className='';}
  else{ct.textContent='—';ct.className='';at.textContent='—';at.className='';}
  setLabelSub('dia',ph==='in'?'kasılır · düzleşir':ph==='hold'?'kasılı · düz':ph==='out'?'gevşer · kubbeleşir':'gevşek · kubbeli',ph==='in'||ph==='hold'?'#7ff6ff':ph==='out'?'#c9b0ff':'#8fa8c4');
  setLabelSub('kab',ph==='in'||ph==='hold'?'kasılır':ph==='out'?'gevşer':'gevşek',ph==='in'||ph==='hold'?'#7ff6ff':ph==='out'?'#c9b0ff':'#8fa8c4');
  E.vocal.setAttribute('d',ph==='rest'?'M-12 219 L-6 236 L0 219':'M-13 219 L-6 237 L1 219');
  const hb=$('#holdB'),hs=$('#holdS');
  if(S.holding){hb.textContent=ph==='hold'?'NEFES TUTULUYOR':'SOLUK ALINIYOR…';hs.textContent='Bırakınca soluk verilir';}
  else if(ph==='out'){hb.textContent='SOLUK VERİLİYOR…';hs.innerHTML='Tekrar basılı tut: soluk al';}
  else{hb.textContent='BASILI TUT: SOLUK AL';hs.innerHTML='veya <kbd>Boşluk</kbd> tuşuna basılı tut';}
}

/* =====================  BAŞLAT  ===================== */
renderSt();updRate();setMode('kesif');drawAnatomy(0);lastDrawB=0;phaseChanged();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{LABELS.forEach(measureLabel);updLabels();});
new ResizeObserver(resize).observe(scene);resize();
requestAnimationFrame(loop);
holdBtn.classList.add('ring');
ZD.intro({kicker:'SİMÜLASYON · SOLUNUM SİSTEMİ',title:'Soluk Al, Soluk Ver',
  art:`<div style="width:84px;height:84px;margin:0 auto 6px;filter:drop-shadow(0 0 18px rgba(255,159,184,.45))">${LUNGICON.replace('class="ic"','style="width:84px;height:84px"').replace(/hiL/g,'hiL2')}</div>`,
  text:'Diyafram, kaburgalar ve akciğerler soluk alıp verirken nasıl hareket ediyor? Canlı modelde keşfet!',
  steps:['<strong>BASILI TUT: SOLUK AL</strong> butonuna (veya Boşluk tuşuna) basılı tut: diyafram kasılıp düzleşir, akciğerler havayla dolar. Bırakınca soluk verirsin.',
    'Sağdaki <strong>Durum tablosu</strong> o anda olanları sırayla işaretler; büyüteçte alveollerdeki O₂ ve CO₂ alışverişini izle.',
    'Üstten mod seç: Serbest Keşif, Doğru Nefes Antrenörü, Görevler ve Ortam Testi.'],
  start:'Başla',onStart:()=>{setTimeout(()=>ZD.pointAt(holdBtn,{ms:3000}),350);}});
})();
</script>
