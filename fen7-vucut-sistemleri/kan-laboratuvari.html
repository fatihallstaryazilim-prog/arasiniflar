<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kan Laboratuvarı: Mikroskop Altında Kan</title>
<link rel="stylesheet" href="assets/zd.css">
<style>
:root{--S:520px}
.zd-body{padding:2px 22px 20px}
/* ---- üst sıra: modlar + tarih çipi ---- */
.kl-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;min-width:0}
.kl-top .zd-seg{overflow-x:auto;max-width:100%;scrollbar-width:none;flex:0 1 auto}
.kl-top .zd-seg::-webkit-scrollbar{display:none}
.kl-top .zd-seg button{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:7px 15px 7px 8px;font-size:13.5px}
.kl-top .zd-seg button i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:rgba(255,255,255,.08);color:var(--muted)}
.kl-top .zd-seg button.on i{background:#06303a;color:#bff4ff}
.hist{margin-left:auto;display:inline-flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border-radius:999px;min-height:44px;text-align:left;
  background:linear-gradient(180deg,rgba(255,187,61,.16),rgba(255,187,61,.05));border:1px solid rgba(255,187,61,.45);box-shadow:0 0 16px rgba(255,187,61,.14);transition:.2s var(--ease)}
.hist:hover{transform:translateY(-1px);box-shadow:0 0 24px rgba(255,187,61,.3)}
.hist .hi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff1c4,#ffbb3d 60%,#b8741a);color:#3a2300;box-shadow:inset 0 -2px 4px rgba(0,0,0,.2)}
.hist .hi svg{width:19px;height:19px}
.hist small{display:block;font-size:10px;font-weight:700;letter-spacing:1.6px;color:var(--amber)}
.hist b{font-size:14px;font-weight:700}

/* ---- laboratuvar ızgarası ---- */
.lab{display:grid;grid-template-columns:var(--S) 150px minmax(0,1fr);gap:16px;height:var(--S)}
.lab[hidden],.don[hidden]{display:none}
.scope-wrap{position:relative;width:var(--S);height:var(--S)}
.bezel{position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,#2b3c55 0deg 2.25deg,#121d2d 2.25deg 4.5deg);
  box-shadow:0 0 0 1.5px rgba(73,243,255,.6),0 0 28px rgba(73,243,255,.33),0 26px 50px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.08)}
.bezel::after{content:"";position:absolute;inset:8px;border-radius:50%;background:linear-gradient(145deg,#3d4f69,#0a1321 60%,#1b2a3f);box-shadow:inset 0 2px 3px rgba(255,255,255,.18),inset 0 -3px 6px rgba(0,0,0,.5)}
.scope{position:absolute;inset:16px;border-radius:50%;overflow:hidden;background:#0d0905;box-shadow:inset 0 0 0 2px rgba(0,0,0,.7);transform:translateZ(0)}
.scope canvas,.scope .ov{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.scope .ov{pointer-events:none}
#uc{cursor:crosshair;touch-action:manipulation}
.scope-wrap.zd-shake .scope{filter:drop-shadow(0 0 14px rgba(255,84,104,.7))}
.magtag{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);z-index:3;padding:5px 14px;border-radius:999px;white-space:nowrap;
  background:#0b1a2d;border:1px solid rgba(73,243,255,.6);font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--muted);box-shadow:0 0 14px rgba(73,243,255,.3)}
.magtag b{color:var(--cyan);font-size:15px;letter-spacing:.5px;margin-left:4px}
.blurpill{position:absolute;left:50%;top:15%;transform:translate(-50%,-6px);z-index:3;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;
  background:rgba(40,24,4,.82);border:1px solid rgba(255,187,61,.7);color:#ffd88a;box-shadow:0 0 20px rgba(255,187,61,.35);opacity:0;pointer-events:none;transition:.35s var(--ease)}
.blurpill.show{opacity:1;transform:translate(-50%,0)}
.blurpill i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:8px;box-shadow:0 0 0 0 rgba(255,187,61,.7);animation:zd-pd 1.6s infinite}

/* ---- kontrol sütunu ---- */
.ctrl{display:flex;flex-direction:column;gap:10px;min-width:0}
.mscope{width:100%;height:auto;overflow:visible;display:block}
.knob{cursor:grab;touch-action:none;outline:none}
.knob:active{cursor:grabbing}
.knob:focus-visible .kring{stroke:#35eefc;stroke-width:2.5}
#msTurret{transition:transform .6s var(--spring);transform-box:view-box;transform-origin:72px 92px}
#msStage{transition:transform .12s linear}
.ctrl-r{display:flex;flex-direction:column;gap:10px}
.fwrap{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:16px;padding:9px 11px 4px}
.fwrap .fl{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--muted)}
.fstat{font-size:10.5px;padding:2px 8px;border-radius:99px;background:rgba(255,187,61,.15);color:var(--amber);letter-spacing:.8px}
.fstat.ok{background:rgba(47,227,155,.16);color:var(--green)}
input.kr{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;touch-action:none;cursor:pointer}
input.kr::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,#14c3dc,#35eefc) 0 0/var(--p,10%) 100% no-repeat,rgba(0,0,0,.5);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
input.kr::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d3e2ef 60%,#8ea3bb);box-shadow:0 0 0 3px rgba(53,238,252,.45),0 4px 10px rgba(0,0,0,.5)}
input.kr::-moz-range-track{height:8px;border-radius:99px;background:rgba(0,0,0,.5)}
input.kr::-moz-range-progress{height:8px;border-radius:99px;background:#35eefc}
input.kr::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d3e2ef 60%,#8ea3bb);box-shadow:0 0 0 3px rgba(53,238,252,.45)}
.mag{display:flex;flex-direction:column;gap:6px}
.mag .mh{font-size:10.5px;font-weight:700;letter-spacing:1.6px;color:var(--dim);text-align:center}
.mag button{min-height:44px;border-radius:14px;font-weight:800;font-size:16px;letter-spacing:.5px;background:linear-gradient(180deg,#22344c,#162537);border:1px solid var(--line);color:#a9bdd4;box-shadow:0 4px 0 rgba(0,0,0,.3);transition:.2s var(--ease)}
.mag button:hover{color:#fff}
.mag button.on{background:linear-gradient(180deg,#e9fbff,#bff4ff);color:#06303a;border-color:#bff4ff;box-shadow:0 0 18px rgba(53,238,252,.45),0 4px 0 rgba(0,0,0,.3)}
.mag button:disabled{opacity:.4;cursor:not-allowed}
.mag button.on:disabled{opacity:.75}

/* ---- sağ panel ---- */
.panel{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.pane{flex:1 1 auto;min-height:0;overflow:auto;padding:15px 18px;display:flex;flex-direction:column;gap:11px;scrollbar-width:thin}
.p-head{display:flex;align-items:center;gap:10px}
.p-step{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.4px;margin-left:auto;text-align:right}
.p-ttl{font-size:18px;font-weight:800;line-height:1.15}
.p-title{font-size:20px;font-weight:800;line-height:1.2}
.p-text{font-size:14.5px;line-height:1.55;color:#cfe0f2}
.p-text b{color:#fff}
.p-small{font-size:13px;line-height:1.5;color:var(--muted)}
.p-quote{font-size:15px;line-height:1.5;font-weight:600;color:#ffe3e7;padding:10px 14px;border-radius:14px;border-left:3px solid var(--oxy);background:rgba(255,59,85,.09)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.task{border-radius:18px;padding:14px 16px;background:linear-gradient(135deg,rgba(53,238,252,.16),rgba(53,238,252,.04));border:1.5px solid rgba(53,238,252,.55);box-shadow:0 0 22px rgba(53,238,252,.15),inset 0 1px 0 rgba(255,255,255,.08)}
.task.warn{background:linear-gradient(135deg,rgba(255,187,61,.16),rgba(255,187,61,.04));border-color:rgba(255,187,61,.6);box-shadow:0 0 22px rgba(255,187,61,.14)}
.task .tk{font-size:11px;font-weight:700;letter-spacing:1.8px;color:var(--cyan);text-transform:uppercase}
.task.warn .tk{color:var(--amber)}
.task .tt{font-size:23px;font-weight:800;margin:3px 0 4px;display:flex;align-items:center;gap:10px}
.task .td{font-size:14px;line-height:1.5;color:#cfe0f2}
.task .dots{display:flex;gap:6px;margin-left:auto}
.task .dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(53,238,252,.6)}
.task .dots i.on{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(47,227,155,.6)}
.netlik{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--muted)}
.netlik .zd-meter{flex:1}
.tlist{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tlist li{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:12px;font-size:13.5px;line-height:1.25;background:rgba(0,0,0,.2);border:1px solid var(--line);color:#a9bdd4}
.tlist li .b{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:rgba(255,255,255,.07)}
.tlist li .b svg{width:15px;height:15px}
.tlist li .n{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.tlist li.cur{border-color:rgba(53,238,252,.55);color:#fff;background:rgba(53,238,252,.08)}
.tlist li.cur .b{background:var(--cyan);color:#05262c}
.tlist li.ok{color:#bfeedd}
.tlist li.ok .b{background:var(--green);color:#032a1b}
.zd-meter.red>i{background:linear-gradient(90deg,#e0334a,#ff7385);box-shadow:0 0 12px rgba(255,84,104,.6)}
.zd-meter.amber>i{background:linear-gradient(90deg,#ffa41b,#ffd36b);box-shadow:0 0 12px rgba(255,187,61,.55)}
.zd-meter.green>i{background:linear-gradient(90deg,#16b979,#3ff0a8);box-shadow:0 0 12px rgba(47,227,155,.55)}
.mrow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:#c9d8ea;margin-bottom:5px}
.mrow b{font-size:15px;font-variant-numeric:tabular-nums}
.steps{list-style:none;display:grid;gap:6px}
.steps li{display:flex;gap:9px;align-items:center;padding:4px 9px;border-radius:12px;font-size:13.5px;line-height:1.3;color:#7f97b3;border:1px solid transparent;transition:.35s var(--ease)}
.steps li b{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:rgba(255,255,255,.07)}
.steps li.act{color:#fff;background:rgba(255,84,104,.1);border-color:rgba(255,84,104,.45)}
.steps li.act b{background:var(--red);color:#fff}
.steps li.done{color:#cfe0f2}
.steps li.done b{background:var(--green);color:#032a1b}
.steps li.fin{color:#fff;background:rgba(47,227,155,.1);border-color:rgba(47,227,155,.5)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:rgba(168,121,255,.1);border:1px solid rgba(168,121,255,.4);font-size:14px;line-height:1.45;color:#e4d8ff}
.note.pulse{animation:zd-gg 1s}
.note svg{width:20px;height:20px;flex:none;color:#c6a8ff;margin-top:1px}
.mk-stats{display:flex;gap:8px;flex:1}
.mk-stats div{flex:1;text-align:center;padding:6px 4px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.mk-stats b{display:block;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.mk-stats span{font-size:10.5px;font-weight:700;letter-spacing:1.1px;color:var(--muted);text-transform:uppercase}
.chart{position:relative;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);padding:6px 8px}
.chart canvas{width:100%;height:62px;display:block}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.legend{display:flex;gap:14px;font-size:12px;font-weight:600;color:#c9d8ea;padding:2px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg2{display:grid;gap:7px}
.lg2 div{display:flex;align-items:center;gap:10px;font-size:13.5px;line-height:1.35;color:#cfe0f2}
.lg2 .sw{width:30px;height:30px;flex:none}
.oxc{display:flex;gap:8px}
.oxc div{flex:1;text-align:center;padding:6px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.oxc b{display:block;font-size:20px;font-weight:800}
.oxc span{font-size:10.5px;font-weight:700;letter-spacing:1.1px;color:var(--muted)}
/* sayım grafiği */
.count{display:grid;gap:9px}
.crow{display:grid;grid-template-columns:168px 1fr 54px;gap:10px;align-items:center;font-size:14px;font-weight:600}
.crow .cbar{height:16px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.crow .cbar i{display:block;height:100%;min-width:8px;border-radius:99px;background:linear-gradient(90deg,var(--c2),var(--c));box-shadow:0 0 12px var(--c);width:0;transition:width 1.2s var(--ease)}
.crow b{text-align:right;font-variant-numeric:tabular-nums}
.crow .tag{font-size:10px;letter-spacing:1px;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
.cnote{font-size:13.5px;color:#cfe0f2;line-height:1.5}
/* bileşen kartları */
.comps{flex:none;padding:10px 12px 12px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line);transition:.2s var(--ease);min-height:44px}
.tile:hover{border-color:var(--line-2)}
.tile svg{width:32px;height:32px}
.tile .tn{font-size:12.5px;font-weight:700;white-space:nowrap}
.tile .tc{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--cyan);line-height:1.1}
.tile .tc small{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.6px}
.tile.on{border-color:rgba(53,238,252,.7);background:rgba(53,238,252,.09);box-shadow:0 0 16px rgba(53,238,252,.22)}
.tile.flash{animation:zd-gg .8s}
.cdef{margin-top:9px;font-size:14px;line-height:1.5;color:#cfe0f2;min-height:63px}
.cdef b{color:#fff}
.cdef .src{display:block;font-size:10.5px;color:var(--dim);letter-spacing:1px;margin-top:2px;font-weight:600}

/* ---- kan bağışı ---- */
.don{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:18px;height:var(--S)}
.don-l{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-width:0}
.pstack{position:relative;width:min(100%,580px)}
.pstack::before,.pstack::after{content:"";position:absolute;inset:0;border-radius:24px;background:linear-gradient(180deg,#10243c,#0b1a2c);border:1px solid rgba(73,243,255,.2);transform:rotate(-2.6deg) translate(-8px,9px)}
.pstack::after{transform:rotate(2.2deg) translate(9px,11px)}
.pcard{position:relative;z-index:1;border-radius:24px;padding:16px 20px 18px;background:linear-gradient(180deg,#15314f,#0c1d31);border:1.5px solid rgba(73,243,255,.65);box-shadow:0 0 26px rgba(73,243,255,.25),0 22px 44px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
.pcard.in{animation:cardIn .55s var(--spring) both}
.pcard.out{animation:cardOut .4s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateX(60px) rotate(4deg) scale(.95)}}
@keyframes cardOut{to{opacity:0;transform:translateX(-80px) rotate(-6deg) scale(.92)}}
.pc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pc-no{font-size:13px;font-weight:700;color:var(--muted)}
.pc-main{display:grid;grid-template-columns:148px minmax(0,1fr);gap:18px;align-items:center}
.ava{width:148px;height:148px;border-radius:50%;padding:4px;background:conic-gradient(from 210deg,#35eefc,#a879ff,#ff6fb0,#35eefc);box-shadow:0 0 24px rgba(53,238,252,.35),0 10px 24px rgba(0,0,0,.45)}
.ava svg{width:100%;height:100%;border-radius:50%;display:block}
.pc-info h3{font-size:26px;font-weight:800;line-height:1.1}
.quote{position:relative;font-size:14px;line-height:1.45;color:#d8e8f8;background:rgba(53,238,252,.08);border:1px solid rgba(53,238,252,.25);border-radius:14px 14px 14px 4px;padding:7px 12px;margin:7px 0 10px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.facts div{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:5px 10px;min-width:0}
.facts span{display:block;font-size:10.5px;letter-spacing:1.2px;color:var(--muted);font-weight:700;text-transform:uppercase}
.facts b{font-size:15px;font-weight:700}
.facts .wide{grid-column:1/-1}
.facts .bad b{color:#ff8a98}
.facts .good b{color:#7ff3c4}
.stamp{position:absolute;right:22px;top:58px;z-index:2;padding:5px 12px;border:3px solid;border-radius:10px;font-weight:900;font-size:17px;letter-spacing:2px;transform:rotate(-9deg) scale(1.7);opacity:0;transition:.45s var(--spring);background:rgba(5,12,22,.6)}
.stamp.show{opacity:1;transform:rotate(-9deg) scale(1)}
.stamp.ok{color:#2fe39b;border-color:#2fe39b;box-shadow:0 0 18px rgba(47,227,155,.45)}
.stamp.no{color:#ff5468;border-color:#ff5468;box-shadow:0 0 18px rgba(255,84,104,.45)}
.don-acts{display:flex;gap:64px;justify-content:center}
.nbtn{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:1.6px}
.nbtn .c{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;border:3px solid;background:radial-gradient(circle,rgba(255,255,255,.04),rgba(0,0,0,.3));transition:transform .2s var(--spring),box-shadow .2s}
.nbtn:hover .c{transform:scale(1.06)}
.nbtn:active .c{transform:scale(.94)}
.nbtn svg{width:42px;height:42px}
.nbtn.no{color:#ff8a78}.nbtn.no .c{border-color:#ff5468;box-shadow:0 0 20px rgba(255,84,104,.6),inset 0 0 20px rgba(255,84,104,.35)}
.nbtn.yes{color:#35eefc}.nbtn.yes .c{border-color:#35eefc;box-shadow:0 0 20px rgba(53,238,252,.6),inset 0 0 20px rgba(53,238,252,.3)}
.nbtn[disabled]{opacity:.35;pointer-events:none}
.don-r{padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.rules{list-style:none;display:grid;gap:7px}
.rules li{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line);font-size:14.5px;font-weight:600;transition:.3s var(--ease)}
.rules li .ri{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:rgba(53,238,252,.12);color:var(--cyan)}
.rules li .ri svg{width:20px;height:20px}
.rules li .rs{margin-left:auto;width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;opacity:0;transform:scale(.4);transition:.35s var(--spring)}
.rules li .rs svg{width:15px;height:15px}
.rules li.ok{border-color:rgba(47,227,155,.45)}
.rules li.ok .rs{opacity:1;transform:none;background:var(--green);color:#032a1b}
.rules li.no{border-color:rgba(255,84,104,.6);background:rgba(255,84,104,.1)}
.rules li.no .rs{opacity:1;transform:none;background:var(--red);color:#fff}
.fb{border-radius:14px;padding:11px 13px;font-size:14px;line-height:1.5;background:rgba(0,0,0,.22);border:1px solid var(--line);color:#cfe0f2;min-height:68px}
.fb.good{border-color:rgba(47,227,155,.55);background:rgba(47,227,155,.08)}
.fb.bad{border-color:rgba(255,84,104,.55);background:rgba(255,84,104,.08)}
.fb b{color:#fff}
.prog{display:flex;gap:6px;align-items:center}
.prog i{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.1)}
.prog i.ok{background:var(--green);box-shadow:0 0 8px rgba(47,227,155,.6)}
.prog i.no{background:var(--red);box-shadow:0 0 8px rgba(255,84,104,.6)}
.prog i.cur{background:var(--cyan);box-shadow:0 0 8px rgba(53,238,252,.6)}
/* 4 adım şeridi */
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.st4{position:relative;padding:12px 8px 10px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid var(--line);text-align:center;animation:zd-fi .5s var(--ease) both}
.st4:nth-child(2){animation-delay:.12s}.st4:nth-child(3){animation-delay:.24s}.st4:nth-child(4){animation-delay:.36s}
.st4 .ic{width:54px;height:54px;margin:0 auto 7px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#24476b,#0e2238);border:1.5px solid rgba(53,238,252,.55);box-shadow:0 0 16px rgba(53,238,252,.25)}
.st4 .ic svg{width:32px;height:32px}
.st4 .no{position:absolute;top:8px;left:10px;font-size:11px;font-weight:800;color:var(--cyan)}
.st4 b{display:block;font-size:12.5px;letter-spacing:.8px;line-height:1.25;margin-bottom:4px}
.st4 p{font-size:12.5px;color:var(--muted);line-height:1.4}
.st4:not(:last-child)::after{content:"";position:absolute;right:-9px;top:34px;width:8px;height:8px;border-top:2.5px solid var(--cyan);border-right:2.5px solid var(--cyan);transform:rotate(45deg);filter:drop-shadow(0 0 4px var(--cyan))}
.kiz{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(255,84,104,.14),rgba(255,84,104,.04));border:1px solid rgba(255,84,104,.45);font-size:14px;line-height:1.5;color:#ffe3e7}
.kiz svg{width:40px;height:40px;flex:none}
/* tarih modalı */
.malp{display:flex;gap:18px;align-items:center;text-align:left;margin-top:10px}
.malp svg{width:120px;height:120px;flex:none}
.malp p{font-size:14.5px}
.intro-art{width:230px;height:96px;margin:0 auto 4px;display:block}
.zd-btn[hidden]{display:none}
/* ---- duyarlı ---- */
@media (max-width:1100px) and (min-width:861px){
  .lab{grid-template-columns:var(--S) 130px minmax(0,1fr)}
}
@media (max-width:860px){
  .zd-body{padding:2px 12px 16px}
  .kl-top{flex-wrap:wrap}
  .hist{margin-left:0}
  .lab{grid-template-columns:minmax(0,1fr);height:auto;gap:14px}
  .scope-wrap{margin:0 auto}
  .ctrl{flex-direction:row;align-items:center;gap:12px}
  .mscope{width:96px;flex:none}
  .ctrl-r{flex:1;min-width:0}
  .mag{flex-direction:row}
  .mag .mh{display:none}
  .mag button{flex:1}
  .pane{overflow:visible}
  .don{grid-template-columns:minmax(0,1fr);height:auto}
  .pc-main{grid-template-columns:1fr;justify-items:center;text-align:center}
  .ava{width:118px;height:118px}
  .facts{text-align:left;width:100%}
  .don-acts{gap:40px}
  .steps4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .st4:nth-child(2)::after{display:none}
  .crow{grid-template-columns:96px 1fr 46px}
  .malp{flex-direction:column;text-align:center}
  .tile .tn{font-size:11px;white-space:normal;text-align:center;line-height:1.15}
  .tlist{grid-template-columns:1fr}
  .p-head .p-step{display:none}
  .mgrid{grid-template-columns:1fr}
  .zd-modal{position:fixed}
  .stamp{top:12px}
}
