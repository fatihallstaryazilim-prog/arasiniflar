<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Besinin Yolculuğu</title><link rel="stylesheet" href="assets/zd.css"><style>
/* ================= Yerleşim ================= */
.sim{display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:14px;padding:2px 16px 16px;height:calc(100vh - 186px);min-height:540px;max-height:880px}
.view{position:relative;min-height:0;border-radius:20px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(55% 50% at 45% 42%,rgba(53,238,252,.09),transparent 70%),radial-gradient(120% 80% at 50% 110%,rgba(20,70,130,.45),transparent 60%),linear-gradient(180deg,rgba(6,16,30,.55),rgba(3,9,18,.85));
  box-shadow:inset 0 0 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04)}
.view::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(140,210,255,.10) 1px,transparent 1.2px);background-size:22px 22px;mask-image:radial-gradient(ellipse at 50% 45%,#000 20%,transparent 75%)}
#bsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ovl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.vcap{position:absolute;left:14px;top:14px;z-index:5;display:flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:999px;background:rgba(6,18,34,.78);border:1px solid rgba(53,238,252,.35);font-size:12px;font-weight:800;letter-spacing:1.6px;color:#dff9ff;backdrop-filter:blur(6px);box-shadow:0 0 18px rgba(53,238,252,.15)}
.vcap i{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.vtags{position:absolute;left:14px;top:54px;z-index:5;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
.vtag{padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:1.4px;animation:tagIn .55s var(--spring) both;backdrop-filter:blur(4px);transition:opacity .5s,transform .5s}
.vtag.out{opacity:0;transform:translateX(-12px)}
.vtag.fiz{background:rgba(255,187,61,.16);color:#ffd27a;border:1px solid rgba(255,187,61,.55);box-shadow:0 0 18px rgba(255,187,61,.25)}
.vtag.kim{background:rgba(168,121,255,.18);color:#d4bfff;border:1px solid rgba(168,121,255,.6);box-shadow:0 0 18px rgba(168,121,255,.3)}
.vtag.ilet{background:rgba(53,238,252,.12);color:#9ff8ff;border:1px solid rgba(53,238,252,.5);box-shadow:0 0 18px rgba(53,238,252,.22)}
.vtag.emil{background:rgba(47,227,155,.14);color:#8ff5c8;border:1px solid rgba(47,227,155,.55);box-shadow:0 0 18px rgba(47,227,155,.25)}
@keyframes tagIn{from{opacity:0;transform:translateX(-16px) scale(.9)}to{opacity:1;transform:none}}
.vinfo{position:absolute;left:14px;bottom:14px;z-index:5;display:flex;gap:14px;align-items:center;padding:9px 14px;border-radius:16px;background:rgba(6,16,30,.78);border:1px solid var(--line);backdrop-filter:blur(6px);transition:opacity .4s}
.vinfo.hide{opacity:0}
.vinfo small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:700;text-transform:uppercase}
.vinfo b{display:block;font-size:20px;font-weight:800;color:var(--cyan);line-height:1.1;font-variant-numeric:tabular-nums}
.vinfo .sz{width:86px}
.vinfo .sz .zd-meter{height:8px;margin-top:6px}
.vinfo .sz .zd-meter>i{background:linear-gradient(90deg,#ffbb3d,#ffe08a);box-shadow:0 0 10px rgba(255,187,61,.5)}
.vinfo .stt{font-size:13px;font-weight:700;color:#eaf6ff;white-space:nowrap}
.vzoom{position:absolute;right:14px;bottom:14px;z-index:5;font-size:10.5px;font-weight:700;letter-spacing:1.6px;color:var(--dim);padding:6px 10px;border-radius:10px;background:rgba(6,16,30,.6);border:1px solid var(--line)}
.vzoom b{color:var(--cyan)}
/* SVG organ durumları */
#bsvg .org{transition:opacity .7s var(--ease),filter .7s var(--ease)}
#bsvg.focus .org{opacity:.28;filter:saturate(.45)}
#bsvg.focus .org.aux{opacity:.95;filter:none}
#bsvg.focus .org.on{opacity:1;filter:drop-shadow(0 0 2.2px rgba(53,238,252,.95)) drop-shadow(0 0 8px rgba(53,238,252,.55))}
#bsvg .lbl{opacity:0;transition:opacity .45s}
#bsvg .lbl.show{opacity:1}
#bsvg .scan{animation:scan 7s linear infinite}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(860px)}}
#bsvg .trailG{animation:trailPulse 2.4s ease-in-out infinite}
@keyframes trailPulse{50%{opacity:.55}}
/* Büyüteç (villus) */
.lens{position:absolute;right:18px;top:18px;z-index:6;width:min(330px,46%);opacity:0;transform:scale(.3) translate(30%,-30%);transition:opacity .45s,transform .7s var(--spring);pointer-events:none}
.lens.show{opacity:1;transform:none;pointer-events:auto}
.lens .ring{position:relative;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 3px #49f3ff,0 0 0 7px rgba(73,243,255,.15),0 0 34px rgba(73,243,255,.55),0 24px 60px rgba(0,0,0,.6);overflow:hidden;background:#1a0812}
.lens svg{width:100%;height:100%;display:block}
.lens .tag{position:absolute;left:50%;top:-13px;transform:translateX(-50%);z-index:2;white-space:nowrap;padding:5px 12px;border-radius:999px;background:#0b1a2d;border:1.5px solid #49f3ff;font-size:11px;font-weight:800;letter-spacing:1.6px;color:#bff9ff;box-shadow:0 0 14px rgba(73,243,255,.4)}
.lens .foot{margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.lens .cnt{font-size:12.5px;font-weight:700;color:#d8f6ff;padding:6px 12px;border-radius:999px;background:rgba(6,16,30,.85);border:1px solid var(--line-2);white-space:nowrap}
.lens .cnt b{color:var(--green);font-size:15px}
.lens .lg{display:flex;gap:10px;font-size:11px;color:var(--muted);font-weight:600;flex-wrap:wrap;justify-content:center;background:rgba(6,16,30,.8);padding:5px 10px;border-radius:12px}
.lens .lg span{display:inline-flex;align-items:center;gap:4px}
.lens .lg svg{width:12px;height:12px}
.lens .x{position:absolute;right:2%;top:2%;z-index:3;width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,#fff,#dfe8f2);color:#0b1626;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.3s}
.lens .x.show{opacity:1;pointer-events:auto}
.lens .x svg{width:20px;height:20px}
.vil{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite alternate}
.vil:nth-child(2n){animation-duration:2.9s;animation-delay:-1.2s}
.vil:nth-child(3n){animation-duration:3.8s;animation-delay:-.6s}
@keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
.flowA{stroke-dasharray:5 9;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
/* ================= Panel ================= */
.panel{display:flex;flex-direction:column;gap:10px;min-height:0}
.ptop{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ptop .zd-seg button{min-height:40px;padding:8px 16px;font-size:13.5px}
.foodchip{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);padding:4px 12px 4px 4px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid var(--line);min-height:40px}
.foodchip svg{width:32px;height:32px}
.foodchip.empty{padding:4px 14px}
.rail{position:relative;display:grid;grid-template-columns:repeat(7,1fr);padding:8px 6px 6px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.rail::before{content:"";position:absolute;left:7%;right:7%;top:21px;height:3px;border-radius:3px;background:rgba(255,255,255,.1)}
.rail .fill{position:absolute;left:7%;top:21px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--cyan-2),var(--cyan));box-shadow:0 0 10px var(--cyan-glow);transition:width .8s var(--ease)}
.rn{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:1}
.rn i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;background:#13263e;border:2px solid rgba(140,200,255,.25);color:var(--dim);transition:.4s var(--ease)}
.rn i svg{width:15px;height:15px}
.rn span{font-size:11px;font-weight:600;color:var(--dim);white-space:nowrap;transition:.4s}
.rn.done i{background:linear-gradient(180deg,#5ff6ff,#14c3dc);border-color:#bdfaff;color:#03303a}
.rn.done span{color:#9fdcec}
.rn.cur i{background:#0b1a2d;border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 4px rgba(53,238,252,.15),0 0 16px rgba(53,238,252,.6);transform:scale(1.12)}
.rn.cur span{color:#fff;font-weight:800}
.card{flex:1;min-height:0;position:relative;padding:16px 18px;overflow:auto;scrollbar-width:thin}
.pane{display:flex;flex-direction:column;gap:12px;min-height:100%}
.pane[hidden]{display:none}
.sh{display:flex;align-items:center;gap:12px}
.sh .ic{flex:none;width:56px;height:56px;border-radius:17px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#27507a,#0f2239 70%);border:1px solid var(--line-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 16px rgba(0,0,0,.35)}
.sh .ic svg{width:44px;height:44px}
.sh small{display:block;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--cyan);text-transform:uppercase}
.sh h3{font-size:22px;font-weight:800;line-height:1.15}
.ctx{font-size:14px;line-height:1.5;color:#cfe0f2;padding:10px 14px;border-radius:14px;background:rgba(53,238,252,.06);border:1px solid rgba(53,238,252,.18)}
.ctx b{color:#fff}
.q{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.q em{font-style:normal;color:var(--cyan)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;min-height:62px;border-radius:16px;background:linear-gradient(180deg,#1d3657,#13263f);border:1.5px solid rgba(140,200,255,.22);box-shadow:0 4px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06);font-weight:700;font-size:14.5px;line-height:1.2;transition:transform .15s var(--ease),border-color .2s,background .3s}
.opt:hover{border-color:rgba(53,238,252,.7);transform:translateY(-1px)}
.opt:active{transform:translateY(2px)}
.opt .oi{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(0,0,0,.28)}
.opt .oi svg{width:24px;height:24px}
.opt small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px}
.opt.bad{border-color:var(--red);background:linear-gradient(180deg,#46192a,#2d1020);opacity:.75}
.opt.good{border-color:var(--green);background:linear-gradient(180deg,#0f4433,#0a2e23);box-shadow:0 0 0 3px rgba(47,227,155,.2),0 0 22px rgba(47,227,155,.35)}
.opts.lock .opt{pointer-events:none}
.why{font-size:13.5px;line-height:1.5;padding:10px 14px;border-radius:14px;background:rgba(255,84,104,.1);border:1px solid rgba(255,84,104,.4);color:#ffd5db}
.why b{color:#ff9aa8}
.def{position:relative;font-size:13.5px;line-height:1.55;color:#d6e6f5;padding:12px 14px 12px 16px;border-radius:14px;background:rgba(0,0,0,.24);border:1px solid var(--line);border-left:3px solid var(--cyan)}
.def .bk{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--cyan);margin-bottom:4px}
.acts{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:16px;background:linear-gradient(180deg,rgba(53,238,252,.06),rgba(53,238,252,.02));border:1px dashed rgba(53,238,252,.3)}
.acts .hint{font-size:13px;color:var(--muted);line-height:1.45}
.acts .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.acts .zd-btn{min-height:48px}
.pips{display:flex;gap:6px;align-items:center}
.pips i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.1);border:1.5px solid rgba(140,200,255,.3);transition:.3s var(--spring)}
.pips i.on{background:var(--cyan);border-color:#c9fbff;box-shadow:0 0 10px var(--cyan);transform:scale(1.15)}
.meter2{flex:1;min-width:120px}
.abs{display:flex;gap:8px;flex-wrap:wrap}
.abs span{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim);transition:.4s}
.abs span svg{width:14px;height:14px}
.abs span.on{color:#d9fff0;border-color:rgba(47,227,155,.55);background:rgba(47,227,155,.12);box-shadow:0 0 12px rgba(47,227,155,.25)}
.nextb{align-self:flex-start}
.nextb.pulse{animation:nb 1.6s infinite}
@keyframes nb{0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.28),0 0 0 0 rgba(47,227,155,.6)}60%{box-shadow:0 5px 0 rgba(0,0,0,.28),0 0 0 14px rgba(47,227,155,0)}}
.okmsg{font-size:13.5px;line-height:1.45;padding:9px 14px;border-radius:14px;background:rgba(47,227,155,.1);border:1px solid rgba(47,227,155,.4);color:#c8f7e3}
/* besin seçimi */
.lead{font-size:14px;line-height:1.55;color:#cfe0f2}
.lead b{color:#fff}
.foods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.food{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px 12px;border-radius:18px;background:linear-gradient(180deg,#fbfdff,#dde8f3);color:#0b1a2d;box-shadow:0 6px 0 rgba(0,0,0,.28),0 16px 30px rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.06);transition:transform .2s var(--spring),box-shadow .2s}
.food:hover{transform:translateY(-4px) rotate(-1deg)}
.food:active{transform:translateY(2px)}
.food svg{width:100%;max-width:120px;height:auto;aspect-ratio:120/104}
.food b{font-size:15px;font-weight:800;line-height:1.15;text-align:center}
.food small{font-size:11.5px;color:#4a6280;font-weight:600;text-align:center;line-height:1.25}
.food .mini{display:flex;gap:3px;width:86%;margin-top:6px}
.food .mini i{flex:1;height:6px;border-radius:4px;background:#c9d6e4;position:relative;overflow:hidden}
.food .mini i::after{content:"";position:absolute;inset:0;width:var(--w);border-radius:inherit;background:var(--c)}
.tipbox{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--muted);padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.tipbox svg{flex:none;width:22px;height:22px;color:var(--amber)}
/* yardımcı organlar */
.aux{display:grid;gap:10px}
.auxc{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.auxc .ic{flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#27507a,#0f2239 70%);border:1px solid var(--line-2)}
.auxc .ic svg{width:40px;height:40px}
.auxc h4{font-size:16px;font-weight:800;margin-bottom:3px}
.auxc p{font-size:13px;line-height:1.5;color:#cfe0f2}
.auxc .tg{display:inline-block;margin-top:6px}
/* besin içeriği */
.nut{padding:10px 14px 12px}
.nut h5{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.nut h5 span{letter-spacing:.4px;text-transform:none;font-weight:600;color:var(--dim)}
.nrow{display:grid;grid-template-columns:118px 1fr 168px;gap:10px;align-items:center;padding:5px 0}
.nrow+.nrow{border-top:1px solid rgba(140,200,255,.08)}
.nname{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700}
.nname svg{width:16px;height:16px;flex:none}
.nbar{display:flex;flex-direction:column;gap:3px}
.nbar .zd-meter{height:9px}
.nbar small{font-size:10.5px;color:var(--muted);font-weight:600}
.badge{justify-self:end;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;border:1px solid;transition:.4s var(--ease)}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.b0{color:#8fa8c4;border-color:rgba(143,168,196,.3);background:rgba(143,168,196,.08)}
.b1{color:#ffd27a;border-color:rgba(255,187,61,.5);background:rgba(255,187,61,.12)}
.b2{color:#8ff5c8;border-color:rgba(47,227,155,.5);background:rgba(47,227,155,.12)}
.b3{color:#9ff8ff;border-color:rgba(53,238,252,.6);background:rgba(53,238,252,.14);box-shadow:0 0 14px rgba(53,238,252,.25)}
.badge.pop{animation:bpop .6s var(--spring)}
@keyframes bpop{40%{transform:scale(1.18)}}
.emul{font-size:10.5px;font-weight:700;color:#bff59f;margin-left:4px}
.nempty{font-size:13px;color:var(--dim);padding:8px 0}
/* sonuç şeridi */
.sumstrip{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;margin-top:14px}
.sumstrip span{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid}
.sumstrip span.ok{color:#8ff5c8;border-color:rgba(47,227,155,.5);background:rgba(47,227,155,.1)}
.sumstrip span.no{color:#ffd27a;border-color:rgba(255,187,61,.5);background:rgba(255,187,61,.1)}
.sumstrip em{font-style:normal;color:var(--cyan);font-weight:800}
.intro-art{display:flex;justify-content:center;gap:6px;margin-bottom:4px}
.intro-art svg{width:74px;height:64px}
/* ================= Duyarlı ================= */
@media (max-width:1180px){.sim{grid-template-columns:minmax(0,1fr) 440px}.nrow{grid-template-columns:104px 1fr 150px}}
@media (max-width:860px){
  .sim{grid-template-columns:1fr;height:auto;max-height:none;min-height:0;padding:2px 10px 12px}
  .view{height:min(60vh,470px);min-height:360px}
  .card{overflow:visible}
  .lens{width:min(270px,70%);right:50%;top:26px;transform:translateX(50%) scale(.3)}
  .lens.show{transform:translateX(50%)}
  .nrow{grid-template-columns:92px 1fr;row-gap:4px}
  .nrow .badge{grid-column:1 / -1;justify-self:start}
  .vinfo{padding:7px 10px;gap:10px}
  .vinfo b{font-size:17px}
  .vinfo .sz{width:60px}
  .vzoom{display:none}
  .rn span{font-size:9.5px}
  .opt{font-size:13.5px;padding:9px 10px}
  .opt .oi{width:30px;height:30px}
  .sh h3{font-size:19px}
}
@media (max-width:420px){.foods{gap:8px}.food b{font-size:13px}.food small{font-size:10.5px}.opts{grid-template-columns:1fr}.opt{min-height:52px}}
</style></head>
<body><div id="app"></div><script src="assets/zd.js"></script><script>
(function(){
'use strict';
/* ====================================================================
   Besinin Yolculuğu — sindirim sistemi simülasyonu
   ==================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const { $, $$ } = ZD;
const ui = ZD.mount({
  kicker: 'SİMÜLASYON · SİNDİRİM SİSTEMİ', title: 'Besinin Yolculuğu',
  crumb: ['7. Sınıf Fen Bilimleri', '3. Ünite', 'Sindirim Sistemi'],
  stats: [{ id: 'stop', label: 'Durak', value: '0/7' }, { id: 'score', label: 'Puan', value: 0, cls: 'cyan' }, { id: 'time', label: 'Süre', value: '0:00' }, { id: 'streak', label: 'Seri', value: '×0', cls: 'green' }],
  onHelp: help, onRestart: () => reset(true)
});
const timer = new ZD.Timer(t => ui.stat('time', ZD.Timer.fmt(t)));

/* ---------------- Kolaylıklar ---------------- */
const E = {
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  inq: t => t * t,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  lin: t => t
};
const rnd = (a, b) => a + Math.random() * (b - a);
const lerp = ZD.lerp, clamp = ZD.clamp;
function sv(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function tween(ms, fn, ease = E.io) {
  const g = S.gen;
  return new Promise(res => {
    const t0 = performance.now();

let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  try { frame(now); } catch (e) { console.error(e); }
}
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  // yemek borusu kası
  if (S.phase === 'act' && S.stop === 3 && !S.a.done) {
    if (S.esoHold) S.esoT = Math.min(1, S.esoT + dt * .3);
    const prev = S.esoP; S.esoP += (S.esoT - S.esoP) * Math.min(1, dt * 4.5);
    if (S.esoT - S.esoP < .002) S.esoP = S.esoT;
    S.bolusS = B[0] + S.esoP * (B[1] - B[0]); S.trailS = Math.max(S.trailS, S.bolusS);
    if (Math.floor(S.esoP * 6) > Math.floor(prev * 6)) ZD.sfx('squish');
    const m = $('#esoM'); if (m) m.style.width = Math.round(S.esoP * 100) + '%';
    if (S.esoP >= .995) esoDone();
  }
  S.esoPinch += ((S.esoHold ? 1 : 0) - S.esoPinch) * Math.min(1, dt * 5);
  if (S.stop === 3 || S.esoDirty) { drawEso(); S.esoDirty = false; }
  // lokma
  layoutPieces(dt, t);
  const c = bolusPos();
  bolusG.setAttribute('transform', `translate(${c.x.toFixed(2)},${c.y.toFixed(2)})`);
  bolusG.setAttribute('opacity', S.bolusO.toFixed(2));
  renderPieces(t);
  const tl = S.trailS.toFixed(1); if (trail._l !== tl) { trail._l = tl; trail.setAttribute('stroke-dasharray', `${tl} 99999`); trailGlow.setAttribute('stroke-dasharray', `${tl} 99999`); }
  updFx(dt);
  if (LV.on) lensTick(dt, t);
}

  <path d="M40,70 A130,130 0 0 1 150,22" fill="none" stroke="url(#lgGlass)" stroke-width="10" stroke-linecap="round"/>`;
  $('#lensX').onclick = () => { ZD.sfx('click'); lensClose(); };
})();
function lensOpen() {
  const f = FOODS[S.fk], q = [];
  [['k', 'bK'], ['p', 'bP'], ['y', 'bY']].forEach(([k, s]) => { const n = Math.max(1, Math.round(f.amt[k] * 22)); for (let i = 0; i < n; i++) q.push(s); });
  LV.queue = ZD.shuffle(q); LV.total = q.length; LV.absorbed = 0; LV.t = 0; LV.next = .4; LV.blocks.forEach(b => b.el.remove()); LV.blocks = [];
  updLensCnt(); $('#lens').classList.add('show'); $('#lens').setAttribute('aria-hidden', 'false'); $('#lensX').classList.remove('show');
  LV.on = true; ZD.sfx('whoosh');
}
function lensRun() { return new Promise(res => { LV.res = res; }); }
function lensClose() { $('#lens').classList.remove('show'); $('#lens').setAttribute('aria-hidden', 'true'); LV.on = false; LV.blocks.forEach(b => b.el.remove()); LV.blocks = []; $('#lensLine').setAttribute('opacity', 0); $('#lensDot').setAttribute('opacity', 0); if (LV.res) { const r = LV.res; LV.res = null; r(); } }
function updLensCnt() { $('#lvCnt').innerHTML = `Kana geçen yapı taşı <b>${LV.absorbed}</b> / ${LV.total}`; }
let lvSnd = 0;
function lensTick(dt, t) {
  LV.t += dt; const lay = $('#lvB');
  while (LV.queue.length && LV.t > LV.next) {
    const s = LV.queue.pop(), v = (Math.random() * LV.villi.length) | 0, vi = LV.villi[v], side = Math.random() < .5 ? -1 : 1;
    const el = sv('use', { href: '#' + s }, lay);
    LV.blocks.push({ el, s, x: rnd(20, 280), y: rnd(-6, 30), st: 'drift', v, side, ty: vi.y + rnd(22, 70), o: 0, ph: rnd(0, 6) });
    LV.next += 3.6 / LV.total;
  }
  for (let i = LV.blocks.length - 1; i >= 0; i--) {
    const b = LV.blocks[i], vi = LV.villi[b.v];
    b.o = Math.min(1, b.o + dt * 3);
    if (b.st === 'drift') {
      const tx = vi.x + b.side * 17, dx = tx - b.x, dy = b.ty - b.y, d = Math.hypot(dx, dy);
      const sp = 70; b.x += dx / d * sp * dt + Math.sin(t * 4 + b.ph) * .5; b.y += dy / d * sp * dt;
      if (d < 3) b.st = 'in';
    } else if (b.st === 'in') {
      const tx = vi.x + 8; b.x += (tx - b.x) * Math.min(1, dt * 7); b.y += 10 * dt;
      if (Math.abs(tx - b.x) < .8) { b.st = 'down'; LV.absorbed++; updLensCnt(); lvSnd += 1; if (lvSnd % 2 === 0) ZD.sfx('pop'); }
    } else if (b.st === 'down') {
      b.y += 95 * dt; b.x = vi.x + 8 + Math.sin(b.y * .05) * .6; if (b.y >= 274) { b.st = 'flow'; b.y = 276; }
    } else if (b.st === 'flow') {
      b.x += 110 * dt; if (b.x > 300) b.o = Math.max(0, b.o - dt * 6);
      if (b.x > 318) { b.el.remove(); LV.blocks.splice(i, 1); continue; }
    }
    const sc = b.st === 'drift' || b.st === 'in' ? .62 : .5;
    b.el.setAttribute('transform', `translate(${b.x.toFixed(2)},${b.y.toFixed(2)}) scale(${sc})`); b.el.setAttribute('opacity', b.o.toFixed(2));
  }
  // büyüteç bağlantı çizgisi
  const lr = $('#lens .ring').getBoundingClientRect(), vr = view.getBoundingClientRect(), ctm = svg.getScreenCTM();
  if (ctm && lr.width) {
    const c = bolusPos(), p = new DOMPoint(c.x, c.y).matrixTransform(ctm);
    const px = p.x - vr.left, py = p.y - vr.top, cx = lr.left + lr.width / 2 - vr.left, cy = lr.top + lr.height / 2 - vr.top;
    const ang = Math.atan2(py - cy, px - cx), R = lr.width / 2 + 6;
    const L1 = $('#lensLine'); L1.setAttribute('x1', cx + Math.cos(ang) * R); L1.setAttribute('y1', cy + Math.sin(ang) * R); L1.setAttribute('x2', px); L1.setAttribute('y2', py); L1.setAttribute('opacity', .8);
    const D = $('#lensDot'); D.setAttribute('cx', px); D.setAttribute('cy', py); D.setAttribute('opacity', .9);
  }
  if (!LV.queue.length && !LV.blocks.length && LV.absorbed >= LV.total && LV.res) { const r = LV.res; LV.res = null; r(); }
}

/* ---------------- Bitiş ---------------- */
async function finish() {
  S.phase = 'done'; timer.stop(); ZD.hideHand();
  S.tab = 'yol'; $$('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === 'yol')); pYol.hidden = false; pYard.hidden = true;
  applyFocus(); renderRail(); renderCard(); $('#vinfo').classList.add('hide');
  const g = S.gen; await camTo(OVERVIEW, 1300); if (g !== S.gen) return;
  ZD.sfx('level');
  const ok = S.first.filter(Boolean).length, f = FOODS[S.fk];
  const strip = `<div class="sumstrip">${[1, 2, 3, 4, 5, 6, 7].map(i => `<span class="${S.first[i] ? 'ok' : 'no'}">${S.first[i] ? '✓' : '↻'} ${STOPS[i].name}</span>${i < 7 ? '<em>→</em>' : ''}`).join('')}</div>`;
  ZD.result({ title: ok >= 6 ? 'Harika yolculuk!' : ok >= 4 ? 'Yolculuk tamam!' : 'Yolculuk tamamlandı', correct: ok, total: 7, score: S.score, time: timer.t,
    text: `${f.name} ağızdan anüse kadar 7 durağı geçti. Yeşil duraklar ilk denemede doğru yanıtlananlardır.`, extra: strip, onReplay: () => reset(true) });
}

/* ---------------- Yardım (el) ---------------- */
function help() {
  ZD.hideHand();
  if ($('.zd-modal.show')) return;
  if (S.tab === 'yard') { ZD.pointAt($('#tabs button[data-tab="yol"]'), { ms: 2600 }); ZD.toast('Yolculuğa dönmek için “Yolculuk” sekmesine dokun.', '', 2400); return; }

  if (S.phase === 'q') { ZD.pointAt($('#opts'), { ms: 2800 }); ZD.toast('Organın görevini düşün: besin burada parçalanıyor mu, yoksa yalnızca iletiliyor mu?', '', 3000); return; }
  if (S.phase === 'act') {
    const p = $('#pYol [data-primary]:not([disabled])'); if (p) { ZD.pointAt(p, { ms: 2800 }); return; }
    const nb = $('#nextB'); if (nb && !nb.hidden) { ZD.pointAt(nb, { ms: 2800 }); return; }

    ZD.toast('Animasyon sürüyor, biraz bekle…', '', 1800); return;
  }
  if (S.phase === 'done') { const b = $('#againB'); if (b) ZD.pointAt(b, { ms: 2600 }); return; }
  showIntro();
}

/* ---------------- Sıfırlama ---------------- */
function reset(animate) {
  S.gen++; timer.reset(); ZD.hideHand(); $$('.zd-modal').forEach(m => m.remove());
  if (LV.on || $('#lens').classList.contains('show')) lensClose(); LV.res = null;
  clearFx();
  Object.assign(S, { phase: 'select', fk: null, stop: 0, score: 0, streak: 0, first: [], tried: false, answered: false, st: { k: 0, p: 0, y: 0 }, emul: false, bolusS: 0, trailS: 0, pieces: [], fat: [], goo: false, spread: 1, sx: 1.6, sy: .7, swA: 0, swV: 0, a: {}, esoHold: false, esoT: 0, esoP: 0, esoPinch: 0, bolusO: 0, tab: 'yol', esoDirty: true });
  setJaw(JAW_REST); $('#tongue').removeAttribute('transform'); $('#stIn').removeAttribute('transform'); $('#phar').removeAttribute('transform'); $('#gallB').removeAttribute('transform'); posaColor(0);
  $('#vtags').innerHTML = ''; $('#vinfo').classList.add('hide'); setInfo(1, 1, 'Bütün lokma');
  $$('#tabs button').forEach(x => { x.classList.toggle('on', x.dataset.tab === 'yol'); x.setAttribute('aria-selected', x.dataset.tab === 'yol'); }); pYol.hidden = false; pYard.hidden = true;
  $('#foodchip').className = 'foodchip empty'; $('#foodchip').textContent = 'Besin seçilmedi';

}
