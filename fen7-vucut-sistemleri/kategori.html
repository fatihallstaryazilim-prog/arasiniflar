<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sırala ve Yerleştir · Kategori Oyunu</title><link rel="stylesheet" href="assets/zd.css">
<style>
/* ================= Kategori sıralama oyunu ================= */
.zd-body{position:relative;padding:4px 22px 20px}
.game{display:flex;flex-direction:column;gap:12px}

/* --- Kategori sütunları --- */
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.col{
  --c:#ffbb3d;position:relative;border-radius:16px;padding:12px 12px 12px;
  background:linear-gradient(180deg,rgba(22,42,68,.85),rgba(12,26,44,.85));
  border:1.5px solid rgba(140,200,255,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 28px rgba(0,0,0,.3);
  transition:border-color .2s,box-shadow .25s,transform .25s var(--spring);cursor:pointer;
}
.col::before{content:"";position:absolute;left:10px;right:10px;top:-1.5px;height:5px;border-radius:0 0 6px 6px;background:var(--c);box-shadow:0 0 14px var(--c),0 2px 10px var(--c)}
.col h3{text-align:center;font-size:clamp(15px,1.45vw,19px);font-weight:800;line-height:1.15;margin-top:4px}
.col .sub{text-align:center;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.25;min-height:16px}
.col .cnt{position:absolute;right:12px;top:10px;font-size:15px;font-weight:800;color:#c9d8ea;min-width:14px;text-align:right}
.col .cnt.bump{animation:zd-bump .45s var(--spring)}
.slots{display:grid;grid-template-columns:repeat(var(--sc,2),1fr);gap:8px;margin-top:10px}
.slot{height:clamp(40px,7.2vh,66px);border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);box-shadow:inset 0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center;overflow:hidden}
.slot svg{width:92%;height:92%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.slot.fill{background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.26),rgba(255,255,255,.06) 72%);border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.slot.fill svg{animation:slotIn .6s var(--spring) both}
@keyframes slotIn{0%{transform:scale(1.8);opacity:0}100%{transform:none;opacity:1}}
.col.over,.col.sel-target:hover{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 26px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 30px color-mix(in srgb,var(--c) 14%,transparent);transform:translateY(-3px)}
.col.good{animation:colGood .8s var(--ease)}
@keyframes colGood{0%{box-shadow:0 0 0 0 rgba(47,227,155,.9),0 0 30px rgba(47,227,155,.6)}100%{box-shadow:0 0 0 18px rgba(47,227,155,0),0 0 0 rgba(47,227,155,0)}}
.col.bad{border-color:var(--red);box-shadow:0 0 26px rgba(255,84,104,.55)}

/* --- Seçili öğe bilgisi --- */
.info{min-height:62px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 10px}
.info .nm{font-size:clamp(20px,2.2vw,28px);font-weight:800;color:#b993ff;text-shadow:0 0 18px rgba(168,121,255,.45);line-height:1.15}
.info .tx{font-size:clamp(14px,1.3vw,17px);color:#dbe7f5;line-height:1.35}
.info.hint .nm{color:var(--muted);text-shadow:none;font-size:clamp(17px,1.8vw,22px)}
.info.swap{animation:zd-fi .35s var(--ease)}

/* --- Öğe kartları --- */
.items{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:1120px;margin:0 auto;width:100%}
.item{
  position:relative;width:calc((100% - 36px)/4);height:clamp(96px,17.8vh,172px);
  border-radius:16px;background:linear-gradient(180deg,#ffffff 0%,#f2f6fb 100%);
  box-shadow:0 2px 0 #fff inset,0 6px 0 rgba(0,0,0,.22),0 12px 26px rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 8px 9px;
  cursor:grab;user-select:none;-webkit-user-select:none;
  transition:transform .3s var(--spring),box-shadow .2s,opacity .35s var(--ease);
  animation:itemIn .6s var(--spring) both;animation-delay:var(--d,0s)
}
@keyframes itemIn{0%{transform:translateY(40px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.item:hover{transform:translateY(-4px)}
.item .art{flex:1;width:100%;min-height:0;display:grid;place-items:center}
.item .art svg{height:100%;width:auto;max-width:100%}
.item .lb{font-size:clamp(13px,1.35vw,18px);font-weight:600;color:#17263a;text-align:center;line-height:1.15;letter-spacing:.1px}
.item.sel{box-shadow:0 0 0 3px var(--cyan),0 0 26px rgba(53,238,252,.6),0 6px 0 rgba(0,0,0,.22),0 12px 26px rgba(0,0,0,.35);transform:translateY(-4px)}
.item.gone{opacity:1!important;transform:none!important;pointer-events:none;background:rgba(255,255,255,.025);border:2px dashed rgba(140,200,255,.16);box-shadow:inset 0 2px 10px rgba(0,0,0,.3);animation:none}
.item.gone>*{opacity:0;transform:scale(.5);transition:.35s var(--ease)}
.item>*{transition:.35s var(--ease)}
.item.miss{animation:zd-shake .45s}
.item .x{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;background:#ff5468;color:#fff;display:none;place-items:center;box-shadow:0 0 10px rgba(255,84,104,.6)}
.item .x svg{width:13px;height:13px}
.item.tried .x{display:grid}
.zd-ghost{box-shadow:0 0 0 3px var(--cyan),0 24px 40px rgba(0,0,0,.5)!important;animation:none!important}
.pts{position:absolute;z-index:40;font-size:24px;font-weight:900;color:var(--green);text-shadow:0 0 14px rgba(47,227,155,.7),0 3px 0 rgba(0,0,0,.35);pointer-events:none;transform:translate(-50%,-50%);animation:pts .95s var(--ease) forwards;white-space:nowrap}
@keyframes pts{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.wave{position:absolute;left:50%;top:50%;z-index:45;transform:translate(-50%,-50%);padding:12px 26px;border-radius:16px;font-size:22px;font-weight:900;letter-spacing:1px;color:#fff;background:linear-gradient(180deg,#7c4dff,#5a2fd6);box-shadow:0 0 30px rgba(168,121,255,.6),0 14px 30px rgba(0,0,0,.4);animation:wave 1.3s var(--ease) forwards;pointer-events:none}
@keyframes wave{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}

/* --- Set seçici --- */
.picker{padding:10px 0 8px}
.picker h2{text-align:center;font-size:clamp(20px,2.4vw,28px);font-weight:800;margin-bottom:4px}
.picker>p{text-align:center;color:var(--muted);font-size:15px;margin-bottom:20px}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1060px;margin:0 auto}
.set{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 16px 18px;border-radius:20px;background:linear-gradient(170deg,#173252,#0d1f35);border:1.5px solid rgba(140,200,255,.18);box-shadow:0 14px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .3s var(--spring),border-color .2s,box-shadow .2s;text-align:center}
.set:hover,.set:focus-visible{transform:translateY(-5px);border-color:rgba(53,238,252,.7);box-shadow:0 0 24px rgba(53,238,252,.3),0 18px 40px rgba(0,0,0,.45);outline:none}
.set .thumbs{display:flex;gap:8px}
.set .thumbs span{width:76px;height:66px;border-radius:12px;background:linear-gradient(180deg,#fff,#eef3f9);display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.set .thumbs svg{width:92%;height:92%}
.set h3{font-size:18px;font-weight:800}
.set .cats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.set .cats i{font-style:normal;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;border:1.5px solid var(--c);color:#e8f1fb;background:color-mix(in srgb,var(--c) 14%,transparent)}
.set small{font-size:12px;color:var(--dim);font-weight:600}

/* --- Sonuç --- */
.rv{margin-top:14px;text-align:left}
.rv .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.rv h4{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:700}
.rv ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:clamp(70px,calc(100vh - 600px),240px);overflow:auto;padding-right:4px}
.rv li{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-size:13px;line-height:1.25;color:#d6e4f3}
.rv li .th{flex:none;width:42px;height:36px;border-radius:8px;background:#fff;display:grid;place-items:center}
.rv li .th svg{width:94%;height:94%}
.rv li b{display:block;color:#fff;font-weight:700}
.rv li span i{font-style:normal;color:var(--c);font-weight:700}
.rv .ok{padding:12px;border-radius:12px;background:rgba(47,227,155,.08);border:1px solid rgba(47,227,155,.35);color:#bff5dc;font-size:14px;text-align:center}
.zd-stat .v.seri{color:var(--green);text-shadow:0 0 18px rgba(47,227,155,.4)}

/* --- Duyarlı --- */
@media (max-width:860px){
  .zd-body{padding:2px 10px 12px}
  .zd-crumb{display:none}
  .zd-stat{padding:0 9px}
  .zd-stat .l{font-size:10px;letter-spacing:1.1px}
  .game{gap:8px}
  .cols{grid-template-columns:1fr 1fr;gap:8px}
  .col{padding:8px 7px 7px;border-radius:13px}
  .col::before{left:8px;right:8px;height:4px}
  .col h3{font-size:13.5px;margin-top:2px;padding:0 14px}
  .col .sub{font-size:10.5px;min-height:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .col .cnt{font-size:12px;right:8px;top:6px}
  .slots{gap:5px;margin-top:6px}
  .slot{height:38px;border-radius:9px}
  .info{min-height:50px}
  .info .nm{font-size:18px}
  .info .tx{font-size:12.5px}
  .info.hint .nm{font-size:15px}
  .items{gap:7px}
  .item{width:calc((100% - 21px)/4);height:96px;padding:3px 3px 6px;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.22),0 8px 16px rgba(0,0,0,.3)}
  .item .lb{font-size:10.5px;font-weight:700;line-height:1.1;min-height:23px;display:flex;align-items:center}
  .item .x{width:18px;height:18px;right:4px;top:4px}
  .sets{grid-template-columns:1fr;gap:10px}
  .set{padding:12px;gap:7px}
  .set .thumbs span{width:62px;height:52px}
  .picker>p{margin-bottom:12px;font-size:14px}
  .zd-modal{padding:12px}
  .zd-toast{width:calc(100% - 28px);font-size:14px;padding:10px 14px}
  .zd-modal .box{padding:20px 16px 18px}
  .zd-modal h2{font-size:22px;margin:6px 0}
  .zd-modal p{font-size:14px}
  .zd-stars svg{width:40px;height:40px}
  .zd-stars svg:nth-child(2){width:52px;height:52px;margin-top:-6px}
  .rv ul{grid-template-columns:1fr;max-height:150px}
  .zd-modal .acts{margin-top:16px;gap:8px}
  .zd-modal .acts .zd-btn{padding:11px 16px;font-size:14px}
}
.zd-howto li strong{color:#fff;font-weight:700}
</style></head>
<body><div id="app"></div><script src="assets/zd.js"></script><script>
(function(){
'use strict';

/* ==================================================================
   SVG İLLÜSTRASYON KİTİ — gradyan hacim, specular parlama, rim ışığı,
   yumuşak gölge. Her çizim benzersiz id önekiyle üretilir.
   ================================================================== */
let UID = 0;
function svg(draw, vb = '0 0 120 100') {
  const p = 'k' + (UID++) + '_'; let n = 0; const D = [];
  const stops = s => s.map((c, i) => Array.isArray(c)
    ? `<stop offset="${c[0]}" stop-color="${c[1]}"${c[2] != null ? ` stop-opacity="${c[2]}"` : ''}/>`
    : `<stop offset="${s.length > 1 ? i / (s.length - 1) : 0}" stop-color="${c}"/>`).join('');
  const k = {
    lg(s, x1 = 0, y1 = 0, x2 = 0, y2 = 1) { const id = p + (n++); D.push(`<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stops(s)}</linearGradient>`); return `url(#${id})`; },
    rg(s, cx = .38, cy = .32, r = .78) { const id = p + (n++); D.push(`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${stops(s)}</radialGradient>`); return `url(#${id})`; },
    sh: `filter="url(#${p}sh)"`, soft: `filter="url(#${p}sf)"`, glow: `filter="url(#${p}gl)"`,
    pat(color = '#fff', op = .2, sz = 5, r = 1.1) { const id = p + (n++); D.push(`<pattern id="${id}" patternUnits="userSpaceOnUse" width="${sz}" height="${sz}"><circle cx="${sz / 2}" cy="${sz / 2}" r="${r}" fill="${color}" fill-opacity="${op}"/><circle cx="0" cy="0" r="${r * .8}" fill="${color}" fill-opacity="${op * .7}"/><circle cx="${sz}" cy="${sz}" r="${r * .8}" fill="${color}" fill-opacity="${op * .7}"/></pattern>`); return `url(#${id})`; },
    clip(d) { const id = p + (n++); D.push(`<clipPath id="${id}"><path d="${d}"/></clipPath>`); return `clip-path="url(#${id})"`; },
    ground(cx = 60, cy = 91, rx = 34, ry = 4.5) { return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${k.rg([[0, '#0b1626', .38], [1, '#0b1626', 0]], .5, .5, .5)}"/>`; },
    hl(cx, cy, rx, ry, rot = 0, op = .85) { return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${cx} ${cy})" fill="${k.rg([[0, '#fff', op], [1, '#fff', 0]], .5, .5, .5)}"/>`; },
    ball(cx, cy, r, c1, c2, c3) {
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${k.rg([[0, c1], [.6, c2], [1, c3 || c2]], .36, .3, .78)}"/>` +
        `<circle cx="${cx}" cy="${cy}" r="${r - .5}" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1"/>` +
        k.hl(cx - r * .32, cy - r * .4, r * .42, r * .26, -32, .95);
    },
    stick(x1, y1, x2, y2, w = 4, c = '#c9d3e0') { return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><line x1="${x1}" y1="${y1 - w * .18}" x2="${x2}" y2="${y2 - w * .18}" stroke="#fff" stroke-opacity=".55" stroke-width="${w * .28}" stroke-linecap="round"/>`; },
    dropPath(cx, cy, s) { return `M${cx},${cy - 2.1 * s} C${cx + .3 * s},${cy - 1.4 * s} ${cx + s},${cy - .8 * s} ${cx + s},${cy} A${s},${s} 0 1 1 ${cx - s},${cy} C${cx - s},${cy - .8 * s} ${cx - .3 * s},${cy - 1.4 * s} ${cx},${cy - 2.1 * s} Z`; },
    drop(cx, cy, s, c1, c2, op = 1) {
      return `<path d="${k.dropPath(cx, cy, s)}" fill="${k.rg([[0, c1], [1, c2]], .42, .62, .75)}" fill-opacity="${op}" stroke="${c2}" stroke-opacity=".5" stroke-width="1"/>` +
        k.hl(cx - s * .38, cy - s * .35, s * .22, s * .42, 18, .95) +
        `<path d="M${cx + s * .55},${cy + s * .35} A${s * .7},${s * .7} 0 0 1 ${cx + s * .05},${cy + s * .8}" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="${s * .1}" stroke-linecap="round"/>`;
    },
    cube(x, y, s, top = '#ffffff', left = '#dfe8f3', right = '#b9c8db') {
      const a = s * .87;
      return `<g ${k.sh}><path d="M${x},${y} L${x + a},${y + s / 2} L${x},${y + s} L${x - a},${y + s / 2}Z" fill="${top}"/>` +
        `<path d="M${x - a},${y + s / 2} L${x},${y + s} L${x},${y + 2 * s} L${x - a},${y + 1.5 * s}Z" fill="${left}"/>` +
        `<path d="M${x},${y + s} L${x + a},${y + s / 2} L${x + a},${y + 1.5 * s} L${x},${y + 2 * s}Z" fill="${right}"/>` +
        `<path d="M${x - a},${y + s / 2} L${x},${y} L${x + a},${y + s / 2}" fill="none" stroke="#fff" stroke-width=".8" stroke-opacity=".9"/></g>`;
    },
    /* kan hücreleri */
    rbc(cx, cy, r, rot = 0, dark = false) {
      const c1 = dark ? '#e0566a' : '#ff6f80', c2 = dark ? '#a3122e' : '#d81c3c', c3 = dark ? '#6e0a1e' : '#9c0d26';
      return `<g transform="rotate(${rot} ${cx} ${cy})" ${k.sh}><ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r * .78}" fill="${k.rg([[0, c1], [.7, c2], [1, c3]], .4, .3, .8)}"/>` +
        `<ellipse cx="${cx + r * .04}" cy="${cy + r * .04}" rx="${r * .5}" ry="${r * .36}" fill="${k.rg([[0, c3, .9], [1, c2, .2]], .5, .55, .6)}"/>` +
        `<ellipse cx="${cx}" cy="${cy}" rx="${r * .62}" ry="${r * .47}" fill="none" stroke="#ff9aa6" stroke-opacity=".55" stroke-width="${r * .08}"/>` +
        k.hl(cx - r * .45, cy - r * .42, r * .3, r * .14, -20, .8) + `</g>`;
    },
    wbc(cx, cy, r) {
      const N = 9, pt = (a, rr) => (cx + Math.cos(a) * rr).toFixed(1) + ',' + (cy + Math.sin(a) * rr).toFixed(1);
      let d = 'M' + pt(0, r * .94);
      for (let i = 0; i < N; i++) { const a0 = i / N * Math.PI * 2, a1 = (i + 1) / N * Math.PI * 2, am = (a0 + a1) / 2; d += ' Q' + pt(am, r * (1.14 + (i % 3) * .03)) + ' ' + pt(a1, r * .94); }
      return `<g ${k.sh}><path d="${d}Z" stroke-linejoin="round" fill="${k.rg([[0, '#ffffff'], [.65, '#eef1fb'], [1, '#c6cde3']], .38, .32, .8)}" stroke="#aeb9d6" stroke-width="1.2"/>` +
        `<g fill="${k.rg([[0, '#c9a6ff'], [.6, '#8b5cf6'], [1, '#5b2bbf']], .35, .3, .8)}"><circle cx="${cx - r * .32}" cy="${cy - r * .05}" r="${r * .3}"/><circle cx="${cx + r * .08}" cy="${cy - r * .3}" r="${r * .28}"/><circle cx="${cx + r * .3}" cy="${cy + r * .14}" r="${r * .29}"/><circle cx="${cx - r * .02}" cy="${cy + r * .32}" r="${r * .24}"/></g>` +
        k.hl(cx - r * .42, cy - r * .48, r * .32, r * .18, -30, .95) + `</g>`;
    },
    plt(cx, cy, s, rot = 0) {
      return `<g transform="rotate(${rot} ${cx} ${cy})"><path d="M${cx - s},${cy} C${cx - s},${cy - s * .8} ${cx - s * .2},${cy - s * .9} ${cx + s * .3},${cy - s * .6} C${cx + s},${cy - s * .3} ${cx + s * 1.1},${cy + s * .4} ${cx + s * .4},${cy + s * .7} C${cx - s * .2},${cy + s} ${cx - s},${cy + s * .6} ${cx - s},${cy}Z" fill="${k.rg([[0, '#f6d9ff'], [.6, '#d39cf0'], [1, '#9a59c8']], .35, .3, .8)}" stroke="#8a4cb8" stroke-opacity=".5" stroke-width=".8"/>` +
        `<circle cx="${cx}" cy="${cy}" r="${s * .18}" fill="#8a4cb8" fill-opacity=".5"/><circle cx="${cx + s * .35}" cy="${cy + s * .2}" r="${s * .13}" fill="#8a4cb8" fill-opacity=".45"/>` + k.hl(cx - s * .45, cy - s * .35, s * .3, s * .15, -20, .8) + `</g>`;
    },
    germ(cx, cy, r) {
      let sp = '';
      for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + .2, x1 = cx + Math.cos(a) * r * .9, y1 = cy + Math.sin(a) * r * .9, x2 = cx + Math.cos(a) * r * 1.45, y2 = cy + Math.sin(a) * r * 1.45; sp += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#3a9a2a" stroke-width="${r * .14}" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="${r * .17}" fill="#7ed957"/>`; }
      return `<g ${k.sh}>${sp}<circle cx="${cx}" cy="${cy}" r="${r}" fill="${k.rg([[0, '#d6ff9e'], [.6, '#7ed957'], [1, '#2f8a22']], .36, .3, .8)}"/>` +
        `<circle cx="${cx - r * .2}" cy="${cy + r * .25}" r="${r * .16}" fill="#2f8a22" fill-opacity=".5"/><circle cx="${cx + r * .35}" cy="${cy - r * .05}" r="${r * .12}" fill="#2f8a22" fill-opacity=".5"/>` + k.hl(cx - r * .35, cy - r * .4, r * .35, r * .2, -30, .9) + `</g>`;
    }
  };
  const body = draw(k);
  return `<svg viewBox="${vb}" aria-hidden="true" focusable="false"><defs>${D.join('')}` +
    `<filter id="${p}sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.2" stdDeviation="1.8" flood-color="#0b1626" flood-opacity=".32"/></filter>` +

   ================================================================== */
const WAVE = 8;
const params = new URLSearchParams(location.search);
let setId = params.get('set'); if (!SETS[setId]) setId = null;
let ui, S, queue = [], wave = [], placed = {}, total = 0, done = 0, firstOk = 0, score = 0, streak = 0, misses = [];
let sel = null, busy = false, over = true, timer, gen = 0, dragMoved = false;
const $ = ZD.$, $$ = ZD.$$;

function mountUI() {
  const s = setId ? SETS[setId] : null;
  ui = ZD.mount({
    kicker: s ? s.kicker : 'SIRALA VE YERLEŞTİR',
    title: s ? s.name : 'Sırala ve Yerleştir',
    crumb: ['7. Sınıf Fen Bilimleri', '3. Ünite', s ? s.crumb : 'Vücudumuzdaki Sistemler'],
    stats: [{ id: 'time', label: 'Süre', value: '0:00' }, { id: 'ok', label: 'Doğru', value: s ? `0 / ${s.items.length}` : '—' },
            { id: 'score', label: 'Puan', value: 0 }, { id: 'seri', label: 'Seri', value: '×0', cls: 'seri' }],
    onHelp: help,
    onRestart() { if (setId) restart(); else renderPicker(); }
  });
  timer = new ZD.Timer(t => ui.stat('time', ZD.Timer.fmt(t)));
}

/* ---------------- Set seçici ---------------- */
function renderPicker() {
  const thumbs = { atik: ['co2', 'ter', 'idrar'], kan: ['oksijen', 'beyaz', 'pihti'], organ: ['kalp', 'akciger', 'bobrek'] };
  ui.body.innerHTML = `<div class="picker zd-fade-in"><h2>Bir set seç</h2><p>Kartları sürükleyip doğru sütuna bırak.</p>
    <div class="sets">${Object.entries(SETS).map(([id, s]) => `
      <button class="set" data-id="${id}" aria-label="${s.name} setini oyna">
        <span class="thumbs">${thumbs[id].map(a => `<span>${A[a]()}</span>`).join('')}</span>
        <h3>${s.name}</h3>
        <span class="cats">${s.cats.map(c => `<i style="--c:${c.c}">${c.name}</i>`).join('')}</span>
        <small>${s.items.length} kart · ${s.crumb}</small>
      </button>`).join('')}</div></div>`;
  $$('.set', ui.body).forEach(b => b.onclick = () => {
    ZD.sfx('click'); setId = b.dataset.id;
    try { history.replaceState(null, '', '?set=' + setId); } catch (e) { }
    mountUI(); setup(); showIntro();
  });
}

/* ---------------- Kurulum ---------------- */
function setup() {
  S = SETS[setId];
  const cap = Math.max(...S.cats.map(c => S.items.filter(i => i.c === c.id).length));
  const sc = cap <= 4 ? 2 : 3, nslots = Math.ceil(cap / sc) * sc;
  ui.body.innerHTML = `<div class="game">
    <div class="cols">${S.cats.map(c => `
      <div class="col" data-cat="${c.id}" style="--c:${c.c};--sc:${sc}" role="button" tabindex="0" aria-label="${c.name} sütunu">
        <span class="cnt" aria-label="yerleşen">0</span><h3>${c.name}</h3><div class="sub">${c.sub}</div>
        <div class="slots">${'<div class="slot"></div>'.repeat(nslots)}</div>
      </div>`).join('')}</div>
    <div class="info hint" id="info" aria-live="polite"><div class="nm">Bir kart seç</div><div class="tx">Kartı sürükleyip doğru sütuna bırak ya da önce karta, sonra sütuna dokun.</div></div>
    <div class="items" id="items"></div>
  </div>`;
  $$('.col', ui.body).forEach(col => {
    col.addEventListener('click', () => { if (sel && !busy) attempt(sel, col); });
    col.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && sel) { e.preventDefault(); attempt(sel, col); } });
  });
  reset();
}

function reset() {
  gen++;
  S.items.forEach(i => { i._done = false; i._tried = false; });
  queue = ZD.shuffle(S.items); total = queue.length; done = 0; firstOk = 0; score = 0; streak = 0; misses = []; sel = null; busy = false; over = false;
  placed = {}; S.cats.forEach(c => placed[c.id] = 0);
  $$('.slot', ui.body).forEach(s => { s.innerHTML = ''; s.classList.remove('fill'); });
  $$('.col .cnt', ui.body).forEach(c => c.textContent = '0');
  ui.stat('ok', `0 / ${total}`); ui.stat('score', 0); ui.stat('seri', '×0');
  timer.reset();
  $$('.zd-modal').forEach(m => m.remove());
  setInfo(null);
  nextWave(true);
}

function nextWave(first) {
  wave = queue.splice(0, WAVE);
  const box = $('#items'); box.innerHTML = '';
  wave.forEach((it, i) => {
    const el = ZD.h('div', { class: 'item', tabindex: '0', role: 'button', 'aria-label': it.n + ' kartı' }, `<span class="x">${ZD.I.x}</span><div class="art">${A[it.a]()}</div><div class="lb">${it.n}</div>`);
    el.style.setProperty('--d', (i * 0.06) + 's');
    el._it = it; it._tried = false;
    box.appendChild(el);
    ZD.drag(el, {
      enabled: () => !busy && !over && !el.classList.contains('gone'),
      onStart() { dragMoved = false; select(el, true); },
      onMove(x, y, ghost) {
        dragMoved = true;
        const t = document.elementFromPoint(x, y), col = t && t.closest('.col');
        $$('.col', ui.body).forEach(c => c.classList.toggle('over', c === col));
      },
      onDrop(x, y, tgt) {
        $$('.col', ui.body).forEach(c => c.classList.remove('over'));
        if (!dragMoved) return true; // dokunma: yalnız seç
        const col = tgt && tgt.closest('.col');
        if (!col) return false;
        return attempt(el, col, x, y);
      }
    });
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(el); } });
  });
  if (!first) {
    ZD.sfx('level');
    const w = ZD.h('div', { class: 'wave' }, 'YENİ DALGA!'); ui.stage.appendChild(w); setTimeout(() => w.remove(), 1300);
  }
}

function setInfo(it) {
  const info = $('#info'); if (!info) return;
  info.classList.remove('swap'); void info.offsetWidth; info.classList.add('swap');
  if (!it) { info.classList.add('hint'); info.innerHTML = `<div class="nm">Bir kart seç</div><div class="tx">Kartı sürükleyip doğru sütuna bırak ya da önce karta, sonra sütuna dokun.</div>`; return; }
  info.classList.remove('hint');
  info.innerHTML = `<div class="nm">${it.n}</div><div class="tx">${it.i}</div>`;
}
function select(el, fromDrag) {
  if (over || el.classList.contains('gone')) return;
  ZD.hideHand();
  $$('.item.sel', ui.body).forEach(e => e !== el && e.classList.remove('sel'));
  if (!fromDrag && sel === el) { el.classList.remove('sel'); sel = null; setInfo(null); return; }
  sel = el; el.classList.add('sel');
  $$('.col', ui.body).forEach(c => c.classList.add('sel-target'));
  setInfo(el._it);
  if (!fromDrag) ZD.sfx('tap');
}

/* yerleştirme denemesi → true: doğru */
function attempt(el, col, x, y) {
  if (busy || over) return false;
  const it = el._it, cat = S.cats.find(c => c.id === col.dataset.cat), right = S.cats.find(c => c.id === it.c);
  if (it.c === cat.id) {
    // doğru
    streak++; done++;
    if (!it._tried) firstOk++;
    const pts = (it._tried ? 40 : 100) + Math.min(streak - 1, 5) * 20;
    score += pts;
    ui.stat('ok', `${done} / ${total}`, true); ui.stat('score', score, true); ui.stat('seri', '×' + streak, true);
    const slot = $$('.slot', col)[placed[cat.id]++];
    if (slot) { slot.innerHTML = A[it.a](); slot.classList.add('fill'); slot.title = it.n; }
    const cnt = $('.cnt', col); cnt.textContent = placed[cat.id]; cnt.classList.remove('bump'); void cnt.offsetWidth; cnt.classList.add('bump');
    col.classList.remove('good'); void col.offsetWidth; col.classList.add('good');
    el.classList.remove('sel'); el.classList.add('gone'); sel = null;
    $$('.col', ui.body).forEach(c => c.classList.remove('sel-target'));
    ZD.sfx('good');
    popPts(col, pts);
    if (streak > 0 && streak % 4 === 0) say(`Harika seri! <b>×${streak}</b>`, 'good', 1400);
    setInfo(it);
    if (wave.every(w => w._done || w === it)) {
      it._done = true;
      const g = gen; busy = true;
      setTimeout(() => {
        if (g !== gen) return; busy = false;
        if (queue.length) nextWave(false); else finish();
      }, 650);
    } else it._done = true;
    return true;
  }
  // yanlış
  streak = 0; ui.stat('seri', '×0');
  if (!it._tried) { it._tried = true; misses.push(it); }
  el.classList.add('tried');
  ZD.sfx('bad');
  col.classList.remove('zd-shake'); void col.offsetWidth; col.classList.add('zd-shake', 'bad');
  setTimeout(() => col.classList.remove('zd-shake', 'bad'), 650);
  if (!x) { el.classList.remove('miss'); void el.offsetWidth; el.classList.add('miss'); }
  say(`<span><b>${it.n}</b> → ${right.name}. ${it.w || it.i}</span>`, 'bad', 3200);
  return false;
}

function popPts(col, pts) {
  const sr = ui.stage.getBoundingClientRect(), r = col.getBoundingClientRect();
  const p = ZD.h('div', { class: 'pts' }, '+' + pts);
  p.style.left = (r.left + r.width / 2 - sr.left) + 'px'; p.style.top = (r.top + r.height * .45 - sr.top) + 'px';
  ui.stage.appendChild(p); setTimeout(() => p.remove(), 950);
}

/* tostu ortadaki bilgi alanının üstüne konumla (sütunları örtmesin) */
function say(msg, type, ms) {
  const t = $('#zd-toast'), info = $('#info');
  if (t && info) { const sr = ui.stage.getBoundingClientRect(), r = info.getBoundingClientRect(); t.style.top = Math.max(70, r.top - sr.top - 4) + 'px'; }
  ZD.toast(msg, type, ms);
}

/* ---------------- Bitiş ---------------- */
function finish() {
  over = true; timer.stop();
  const catName = id => S.cats.find(c => c.id === id);
  const rv = misses.length
    ? `<div class="hd"><h4>Gözden geçir · ilk denemede kaçanlar</h4></div><ul>${misses.map(it => { const c = catName(it.c); return `<li><span class="th">${A[it.a]()}</span><span><b>${it.n}</b><i style="--c:${c.c}">→ ${c.name}</i></span></li>`; }).join('')}</ul>`
    : `<div class="ok">Tüm kartları ilk denemede doğru yerleştirdin!</div>`;
  setTimeout(() => {
    ZD.result({
      title: misses.length === 0 ? 'Kusursuz!' : firstOk / total >= .6 ? 'Harika iş!' : 'Tamamlandı!',
      correct: firstOk, total, score, time: timer.t,
      text: `${total} kartın <b style="color:#fff">${firstOk}</b> tanesini ilk denemede doğru yerleştirdin.`,
      onReplay: restart,
      extra: `<div class="rv">${rv}</div>`
    });
  }, 500);
}

function restart() { reset(); timer.start(); }

/* ---------------- Yönerge ---------------- */
function steps() {
  return [
    `Alttaki kartı tut, sürükle ve doğru <strong>sütuna</strong> bırak. İstersen önce karta, sonra sütuna dokunabilirsin.`,
    `Seçtiğin kartın adı ve kısa bilgisi ortada görünür. Yanlış sütunda kart geri döner ve nedeni yazılır.`,
    `Art arda doğrular <strong style="color:var(--green)">seri</strong> puanı kazandırır. Kartlar bitince yeni dalga gelir!`
  ];
}
function showIntro() {
  ZD.intro({
    kicker: S.kicker, title: S.name, text: S.intro, steps: steps(), start: 'Başla',
    onStart() { timer.start(); setTimeout(demo, 500); }
  });
}
function demo() {
  const el = $$('.item', ui.body).find(e => !e.classList.contains('gone')); if (!el) return;
  ZD.pointAt(el, { fy: .45 });
  setTimeout(() => { const col = $(`.col[data-cat="${el._it.c}"]`, ui.body); if (col && !over) ZD.pointAt(col, { fy: .55, ms: 1300 }); }, 1300);
}
function help() {
  if (!setId) { ZD.toast('Önce bir set seç.', '', 1800); return; }
  if (over) return;
  const was = timer.run; timer.stop();
  ZD.modal({
    html: `<span class="zd-chip">NASIL OYNANIR?</span><h2>${S.name}</h2><ul class="zd-howto">${steps().map((s, i) => `<li><b>${i + 1}</b><span>${s}</span></li>`).join('')}</ul>`,
    actions: [{ label: ZD.I.play + 'Devam et', cls: 'lg', onClick() { if (was) timer.start(); setTimeout(demo, 300); } }]
  });
}

/* test/otomasyon için salt-okunur durum */
window.__kategori = () => ({ over, done, total, wave: wave.map(w => ({ n: w.n, c: w.c, done: !!w._done })) });

mountUI();
if (setId) { setup(); showIntro(); } else renderPicker();
})();
</script></body></html>
