<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hangisi? · İkili Kart Oyunu</title><link rel="stylesheet" href="assets/zd.css">
<style>
/* ================= İkili kart oyunu ================= */
.zd-body{position:relative;padding:0 22px 22px}
.arena{position:relative;display:flex;flex-direction:column;align-items:center}
.prompt{min-height:34px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:600;color:var(--muted);text-align:center;padding:2px 10px 0}
.prompt{position:relative;width:min(600px,100%)}
.prompt .streak{position:absolute;right:0;top:50%;margin-top:-13px;z-index:30;display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:1px;color:#032a1b;background:linear-gradient(180deg,#5cf5b6,#16b979);box-shadow:0 0 18px rgba(47,227,155,.45);transform:scale(0);transition:transform .45s var(--spring)}
.prompt .streak.on{transform:scale(1)}

/* --- Kart yığını --- */
.stack{position:relative;width:min(600px,100%);height:clamp(220px,38vh,330px);margin:8px auto 0;perspective:1200px}
.card{
  position:absolute;inset:0;border-radius:24px;
  background:
    radial-gradient(120% 90% at 50% 0%,rgba(73,170,255,.13),transparent 60%),
    linear-gradient(165deg,#173252 0%,#10243d 55%,#0c1c31 100%);
  border:1.5px solid rgba(140,200,255,.20);
  box-shadow:0 22px 50px rgba(0,0,0,.55),0 4px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 40px rgba(53,238,252,.04);
  transition:transform .6s var(--spring),opacity .4s var(--ease),box-shadow .25s,border-color .25s;
  will-change:transform;touch-action:none;user-select:none;-webkit-user-select:none;
  display:flex;align-items:center;justify-content:center;
}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 32%);}
.card.d1{filter:brightness(.82)}
.card.d2{filter:brightness(.68)}
.card .content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:18px;padding:26px 34px;text-align:center;transition:opacity .35s var(--ease)}
.card:not(.d0) .content{opacity:0}
.card.d0{cursor:grab}
.card.d0.dragging{cursor:grabbing;transition:box-shadow .15s,border-color .15s}
.tag{
  display:inline-block;padding:7px 26px 6px;border-radius:10px;transform:rotate(-1.6deg);
  font-size:clamp(17px,2vw,24px);font-weight:800;letter-spacing:1.5px;color:var(--cyan);
  border:2.5px solid var(--cyan);background:rgba(53,238,252,.07);
  box-shadow:0 0 14px rgba(53,238,252,.55),inset 0 0 12px rgba(53,238,252,.25);
  text-shadow:0 0 14px rgba(53,238,252,.6);
}
.q{font-size:clamp(22px,2.7vw,34px);font-weight:800;line-height:1.22;letter-spacing:.1px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35);max-width:520px}
.q small{display:block;margin-top:10px;font-size:clamp(15px,1.6vw,19px);font-weight:600;color:#a9c3de;letter-spacing:.2px}
.q.long{font-size:clamp(20px,2.3vw,29px)}
.stamp{position:absolute;top:22px;z-index:2;padding:6px 14px;border-radius:10px;border:3px solid currentColor;font-weight:900;font-size:20px;letter-spacing:1.5px;opacity:0;pointer-events:none;background:rgba(5,12,22,.55)}
.stamp.l{left:20px;color:#ff7a66;transform:rotate(-12deg);text-shadow:0 0 12px rgba(255,90,80,.7);box-shadow:0 0 16px rgba(255,90,80,.5)}
.stamp.r{right:20px;color:var(--cyan);transform:rotate(12deg);text-shadow:0 0 12px rgba(53,238,252,.7);box-shadow:0 0 16px rgba(53,238,252,.5)}
.card.wrong{border-color:#ff5468;box-shadow:0 0 0 2px rgba(255,84,104,.6),0 0 40px rgba(255,84,104,.55),0 22px 50px rgba(0,0,0,.55)}
.card.wrong .content{animation:zd-shake .45s}
.card.right{border-color:#2fe39b;box-shadow:0 0 0 2px rgba(47,227,155,.6),0 0 40px rgba(47,227,155,.5),0 22px 50px rgba(0,0,0,.55)}
.card .mark{position:absolute;right:16px;bottom:14px;z-index:2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transform:scale(0);transition:transform .4s var(--spring)}
.card .mark svg{width:24px;height:24px}
.card.wrong .mark{transform:scale(1);background:var(--red);color:#fff;box-shadow:0 0 18px rgba(255,84,104,.7)}
.card.right .mark{transform:scale(1);background:var(--green);color:#032a1b;box-shadow:0 0 18px rgba(47,227,155,.7)}

/* --- Açıklama --- */
.fb{position:relative;height:80px;width:min(600px,100%);display:flex;align-items:flex-start;justify-content:center;padding-top:12px}
.fb .box{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-radius:14px;background:#341521;border:1.5px solid var(--red);box-shadow:0 0 22px rgba(255,84,104,.35);font-size:14.5px;line-height:1.4;color:#ffdfe4;opacity:0;transform:translateY(-8px) scale(.96);transition:.35s var(--spring);max-width:100%}
.fb .box.show{opacity:1;transform:none}
.fb .box b{color:#fff}
.fb .box .ic{flex:none;width:24px;height:24px;border-radius:50%;background:var(--red);display:grid;place-items:center;margin-top:1px}
.fb .box .ic svg{width:14px;height:14px}
.pts{position:absolute;left:50%;top:40%;z-index:20;font-size:30px;font-weight:900;color:var(--green);text-shadow:0 0 18px rgba(47,227,155,.7),0 3px 0 rgba(0,0,0,.35);pointer-events:none;transform:translate(-50%,0);animation:pts 1s var(--ease) forwards;white-space:nowrap}
.pts small{font-size:17px;color:#fff;margin-left:6px;text-shadow:none;opacity:.9}
@keyframes pts{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}

/* --- Seçim butonları --- */
.choices{display:flex;justify-content:center;gap:clamp(40px,12vw,150px);padding-top:2px}
.choice{display:flex;flex-direction:column;align-items:center;gap:10px;--c:#ff4a3d;--c2:#ff8a73;--ca:rgba(255,74,61,.35)}
.choice.r{--c:#35eefc;--c2:#4ef7ff;--ca:rgba(53,238,252,.32)}
.ring{
  width:clamp(84px,14vh,118px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 45%,#0f2238 0%,#081526 70%);
  border:3px solid var(--c);
  box-shadow:0 0 0 1px var(--ca),0 0 22px var(--c),0 0 60px var(--ca),inset 0 0 22px var(--ca);
  transition:transform .25s var(--spring),box-shadow .25s;
}
.ring svg{width:46%;height:46%;color:var(--c2);filter:drop-shadow(0 0 8px var(--c))}
.choice:hover .ring{transform:scale(1.06)}
.choice:active .ring,.choice.hot .ring{transform:scale(1.12);box-shadow:0 0 0 2px var(--c),0 0 34px var(--c),0 0 90px var(--ca),inset 0 0 32px var(--ca)}
.choice .lb{font-size:clamp(17px,2vw,24px);font-weight:900;letter-spacing:.8px;color:var(--c2);text-shadow:0 0 14px var(--ca)}
.choice[disabled]{pointer-events:none}
.kbd{display:flex;justify-content:center;gap:8px;margin-top:10px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.4px}
.kbd i{font-style:normal;display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:6px;border:1px solid var(--line-2);color:var(--muted);background:rgba(0,0,0,.25)}

/* --- Deste seçici --- */
.picker{padding:6px 0 4px}
.picker h2{text-align:center;font-size:clamp(20px,2.4vw,28px);font-weight:800;margin:4px 0 4px}
.picker>p{text-align:center;color:var(--muted);font-size:15px;margin-bottom:18px}
.decks{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.deck{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 14px 18px;border-radius:20px;text-align:center;
  background:linear-gradient(170deg,#173252,#0d1f35);border:1.5px solid rgba(140,200,255,.18);
  box-shadow:0 14px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .3s var(--spring),border-color .2s,box-shadow .2s}
.deck:hover,.deck:focus-visible{transform:translateY(-5px);border-color:rgba(53,238,252,.7);box-shadow:0 0 24px rgba(53,238,252,.3),0 18px 40px rgba(0,0,0,.45);outline:none}
.deck .ico{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#12304f,#081627);border:1.5px solid rgba(53,238,252,.35);box-shadow:inset 0 0 20px rgba(53,238,252,.15),0 0 18px rgba(53,238,252,.15)}
.deck .ico svg{width:58px;height:58px}
.deck h3{font-size:17px;font-weight:800;line-height:1.25}
.deck .pair{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.deck .pair span{font-size:11px;font-weight:800;letter-spacing:.8px;padding:4px 9px;border-radius:999px}
.deck .pair .l{color:#ff8a73;border:1.5px solid rgba(255,90,70,.6);background:rgba(255,74,61,.08)}
.deck .pair .r{color:var(--cyan);border:1.5px solid rgba(53,238,252,.6);background:rgba(53,238,252,.07)}
.deck small{font-size:12px;color:var(--dim);font-weight:600}

/* --- Sonuç gözden geçirme --- */
.rv{margin-top:16px;text-align:left}
.rv .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.rv .hd h4{margin:0}
.rv h4{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.rv ul{list-style:none;display:grid;gap:7px;max-height:clamp(96px,calc(100vh - 590px),260px);overflow:auto;padding-right:4px}
.rv li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-size:13.5px;line-height:1.35;color:#d6e4f3}
.rv li .t{flex:1}
.rv li .t small{display:block;color:var(--dim);font-size:12px}
.rv li .a{flex:none;font-size:11px;font-weight:800;letter-spacing:.8px;padding:4px 9px;border-radius:999px}
.rv .a.l{color:#ff8a73;border:1.5px solid rgba(255,90,70,.6)}
.rv .a.r{color:var(--cyan);border:1.5px solid rgba(53,238,252,.6)}
.rv .ok{padding:12px;border-radius:12px;background:rgba(47,227,155,.08);border:1px solid rgba(47,227,155,.35);color:#bff5dc;font-size:14px;text-align:center}
.rv .note{margin-top:8px;font-size:12.5px;color:var(--muted);text-align:center}
.rv .swap{flex:none}
.zd-stat .v.warn{color:#ff6b7d;text-shadow:0 0 18px rgba(255,84,104,.6);animation:warn 1s infinite}
@keyframes warn{50%{opacity:.55}}

@media (max-width:1100px){.decks{grid-template-columns:repeat(3,1fr)}}
@media (max-width:860px){
  .zd-body{padding:0 12px 16px}
  .card .content{padding:22px 20px;gap:14px}
  .stamp{font-size:15px;top:14px}
  .decks{grid-template-columns:1fr;gap:10px}
  .deck{flex-direction:row;text-align:left;padding:12px 14px;gap:14px}
  .deck .ico{width:62px;height:62px;flex:none}
  .deck .ico svg{width:44px;height:44px}
  .deck .meta{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .deck .pair{justify-content:flex-start}
  .picker>p{margin-bottom:12px;font-size:14px}
  .kbd{display:none}
  .fb{height:84px}
  .zd-crumb{display:none}
  .zd-modal{padding:12px}
  .zd-modal .box{padding:20px 16px 18px}
  .zd-modal h2{font-size:22px;margin:6px 0 6px}
  .zd-modal p{font-size:14px}
  .zd-stars svg{width:40px;height:40px}
  .zd-stars svg:nth-child(2){width:52px;height:52px;margin-top:-6px}
  .zd-res-grid{margin-top:12px}
  .rv{margin-top:12px}
  .rv .hd h4{font-size:11px;letter-spacing:1.2px}
  .rv ul{max-height:150px}
  .rv li{flex-direction:column;align-items:flex-start;gap:5px;font-size:13px;padding:8px 10px}
  .zd-modal .acts{margin-top:16px;gap:8px}
  .zd-modal .acts .zd-btn{padding:11px 16px;font-size:14px}
  .stack{height:clamp(200px,29vh,280px)}
  .ring{width:92px}
  .prompt{font-size:13.5px;min-height:28px}
  .fb .box{font-size:13.5px}
}
@media (min-width:861px){.deck .meta{display:contents}}
</style></head>

const params = new URLSearchParams(location.search);
let deckId = params.get('deste');
if (!DECKS[deckId]) deckId = null;

let ui, D, cards = [], idx = 0, score = 0, streak = 0, correct = 0, wrongs = [];
let gen = 0, els = [], locked = true, over = false, shownAt = 0, timer, lastSec = -1, started = false, introOpen = false;

const $ = ZD.$;

function mountUI() {
  const d = deckId ? DECKS[deckId] : null;
  ui = ZD.mount({
    kicker: d ? d.kicker : 'İKİLİ KART OYUNU',
    title: d ? d.name : 'Hangisi? · İkili Kart Oyunu',
    crumb: ['7. Sınıf Fen Bilimleri', '3. Ünite', d ? d.crumb : 'Vücudumuzdaki Sistemler'],
    stats: [{ id: 'left', label: 'Kalan', value: d ? d.cards.length + ' / ' + d.cards.length : '—' },
            { id: 'time', label: 'Süre', value: ZD.Timer.fmt(LIMIT), cls: 'cyan' },
            { id: 'score', label: 'Puan', value: 0 }],
    onHelp: help,
    onRestart() { if (deckId) restart(); else renderPicker(); }
  });
  timer = new ZD.Timer(onTick);
}

/* ---------------- Deste seçici ---------------- */
function renderPicker() {
  ui.body.innerHTML = `<div class="picker zd-fade-in"><h2>Bir deste seç</h2><p>Kartı doğru tarafa fırlat. Süren 90 saniye!</p>
    <div class="decks">${Object.entries(DECKS).map(([id, d]) => `
      <button class="deck" data-id="${id}" aria-label="${d.name} destesini oyna">
        <span class="ico">${ICONS[d.icon]}</span>
        <span class="meta"><h3>${d.name}</h3>
        <span class="pair"><span class="l">${d.L}</span><span class="r">${d.R}</span></span>
        <small>${d.cards.length} kart · ${d.crumb}</small></span>
      </button>`).join('')}</div></div>`;
  ZD.$$('.deck', ui.body).forEach(b => b.onclick = () => {
    ZD.sfx('click');
    deckId = b.dataset.id;
    try { history.replaceState(null, '', '?deste=' + deckId); } catch (e) { }
    $('#app').innerHTML = ''; mountUI(); setupGame(); showIntro();
  });
}

/* ---------------- Oyun ---------------- */
function setupGame() {
  D = DECKS[deckId];
  ui.body.innerHTML = `
    <div class="arena">
      <div class="prompt"><span class="pq">${D.q}</span><span class="streak" id="streak">SERİ ×2</span></div>
      <div class="stack" id="stack" aria-live="polite"></div>
      <div class="fb" id="fb"><div class="box" role="status"><span class="ic">${ZD.I.x}</span><span class="tx"></span></div></div>
      <div class="choices">
        <button class="choice l" id="btnL" aria-label="${D.L} (sol ok)"><span class="ring">${ZD.I.arrowL}</span><span class="lb">${D.L}</span></button>
        <button class="choice r" id="btnR" aria-label="${D.R} (sağ ok)"><span class="ring">${ZD.I.arrowR}</span><span class="lb">${D.R}</span></button>
      </div>
      <div class="kbd"><i>←</i> ${D.L.toLocaleLowerCase('tr')} &nbsp;·&nbsp; <i>→</i> ${D.R.toLocaleLowerCase('tr')} &nbsp;·&nbsp; ya da kartı sürükle</div>
    </div>`;
  $('#btnL').onclick = () => choose('L');
  $('#btnR').onclick = () => choose('R');
  reset();
}

function reset() {
  gen++; cards = ZD.shuffle(D.cards); idx = 0; score = 0; streak = 0; correct = 0; wrongs = []; over = false; locked = true; lastSec = -1;
  timer.reset(); ui.statClass('time', 'cyan');
  ui.stat('score', 0); ui.stat('left', cards.length + ' / ' + cards.length); ui.stat('time', ZD.Timer.fmt(LIMIT));
  $('#streak').classList.remove('on'); $('#fb .box').classList.remove('show');
  ZD.$$('.zd-modal').forEach(m => m.remove());
  buildStack();
}

function cardHTML(c) {
  const long = c.t.length > 44 && !c.s;
  return `<div class="stamp l">${D.L}</div><div class="stamp r">${D.R}</div>
    <div class="content"><span class="tag">${c.tag}</span><div class="q${long ? ' long' : ''}">${c.t}${c.s ? `<small>${c.s}</small>` : ''}</div></div>
    <div class="mark"></div>`;
}
const DEPTH = [
  'translate3d(0,0,0) rotate(0deg)',
  'translate3d(-14px,14px,0) rotate(-3.6deg) scale(.97)',
  'translate3d(16px,24px,0) rotate(3deg) scale(.94)'
];
function setDepth(el, d) {
  el.classList.remove('d0', 'd1', 'd2'); el.classList.add('d' + d);
  el.style.zIndex = 10 - d; el.style.transform = DEPTH[d];
}
function makeCard(i, d) {
  const el = ZD.h('div', { class: 'card' }, cardHTML(cards[i]));
  el._i = i; setDepth(el, d); return el;
}
function buildStack() {
  const st = $('#stack'); st.innerHTML = ''; els = [];
  for (let d = 0; d < 3 && idx + d < cards.length; d++) { const el = makeCard(idx + d, d); els.push(el); st.appendChild(el); }
  armTop();
}
function armTop() {
  const el = els[0]; if (!el) return;
  shownAt = performance.now();
  if (!el._bound) { el._bound = true; bindDrag(el); }
}

/* sürükleyip fırlatma */
function bindDrag(el) {
  let sx = 0, sy = 0, dx = 0, dy = 0, lastX = 0, lastT = 0, vx = 0, down = false;
  const W = () => el.parentNode ? el.parentNode.offsetWidth : 500;
  el.addEventListener('pointerdown', e => {
    if (locked || over || el !== els[0]) return;
    down = true; sx = e.clientX; sy = e.clientY; dx = dy = 0; lastX = e.clientX; lastT = performance.now(); vx = 0;
    el.setPointerCapture(e.pointerId); el.classList.add('dragging');
  });
  el.addEventListener('pointermove', e => {
    if (!down) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    const n = performance.now(); vx = (e.clientX - lastX) / Math.max(1, n - lastT); lastX = e.clientX; lastT = n;
    el.style.transform = `translate3d(${dx}px,${dy * .35}px,0) rotate(${dx * .055}deg)`;
    tint(el, dx / (W() * .32));
  });
  const up = () => {
    if (!down) return; down = false; el.classList.remove('dragging');
    const th = Math.min(120, W() * .26);
    if (Math.abs(dx) > th || (Math.abs(vx) > .6 && Math.abs(dx) > 40)) { choose(dx > 0 ? 'R' : 'L', { dx, dy }); }
    else { tint(el, 0); el.style.transform = DEPTH[0]; }
  };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
}
function tint(el, p) {
  p = ZD.clamp(p, -1, 1); const a = Math.abs(p);
  $('.stamp.l', el).style.opacity = p < 0 ? a : 0;
  $('.stamp.r', el).style.opacity = p > 0 ? a : 0;
  if (a < .02) { el.style.boxShadow = ''; el.style.borderColor = ''; }
  else if (p < 0) { el.style.boxShadow = `0 0 ${a * 46}px rgba(255,80,64,${a * .75}),0 22px 50px rgba(0,0,0,.55)`; el.style.borderColor = `rgba(255,110,90,${.25 + a * .7})`; }
  else { el.style.boxShadow = `0 0 ${a * 46}px rgba(53,238,252,${a * .7}),0 22px 50px rgba(0,0,0,.55)`; el.style.borderColor = `rgba(53,238,252,${.25 + a * .7})`; }
  $('#btnL').classList.toggle('hot', p < -.35); $('#btnR').classList.toggle('hot', p > .35);
}

function choose(side, drag) {
  if (locked || over) return;
  const el = els[0]; if (!el) return;
  locked = true;
  const c = cards[idx], g = gen;
  const btn = side === 'L' ? $('#btnL') : $('#btnR');
  btn.classList.add('hot'); setTimeout(() => btn.classList.remove('hot'), 220);
  if (side === c.a) {
    const dt = (performance.now() - shownAt) / 1000;
    streak++; correct++;
    const mult = streak >= 6 ? 3 : streak >= 3 ? 2 : 1;
    const bonus = Math.max(0, Math.round((5 - dt) * 12));
    const pts = (100 + bonus) * mult;
    score += pts; ui.stat('score', score, true);
    const sk = $('#streak'); sk.textContent = 'SERİ ×' + mult; sk.classList.toggle('on', mult > 1);
    ZD.sfx('good'); setTimeout(() => ZD.sfx('whoosh'), 40);
    el.classList.add('right'); $('.mark', el).innerHTML = ZD.I.check;
    popPoints(pts, bonus, mult);
    fly(el, side, drag);
    setTimeout(() => g === gen && advance(), 260);
  } else {
    streak = 0; $('#streak').classList.remove('on');
    wrongs.push(c);
    ZD.sfx('bad');
    tint(el, 0); el.style.transform = DEPTH[0];
    el.classList.add('wrong'); $('.mark', el).innerHTML = ZD.I.x;
    const fb = $('#fb .box');
    $('.tx', fb).innerHTML = `<span><b>Doğrusu: ${c.a === 'L' ? D.L : D.R}</b> · ${c.why}</span>`;
    fb.classList.add('show');
    setTimeout(() => {
      if (g !== gen) return;
      fb.classList.remove('show');
      if (over) return;
      fly(el, c.a);
      setTimeout(() => g === gen && advance(), 260);
    }, 1550);
  }
}
function fly(el, side, drag) {
  const dir = side === 'R' ? 1 : -1, W = Math.max(innerWidth, 900);
  const dy = drag ? drag.dy * .35 : -20;
  el.style.transition = 'transform .55s cubic-bezier(.3,.5,.3,1),opacity .5s ease';
  el.style.transform = `translate3d(${dir * W * .75}px,${dy - 60}px,0) rotate(${dir * 32}deg)`;
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 600);
}
function popPoints(pts, bonus, mult) {
  const p = ZD.h('div', { class: 'pts' }, `+${pts}${mult > 1 ? `<small>×${mult}</small>` : bonus > 30 ? '<small>hızlı!</small>' : ''}`);
  $('#stack').appendChild(p); setTimeout(() => p.remove(), 1000);
}
function advance() {
  if (over) return;
  els.shift(); idx++;
  ui.stat('left', (cards.length - idx) + ' / ' + cards.length, true);
  if (idx >= cards.length) { finish('done'); return; }
  els.forEach((e, d) => setDepth(e, d));
  if (idx + 2 < cards.length) {
    const el = makeCard(idx + 2, 2); el.style.opacity = '0'; el.style.transform = 'translate3d(16px,40px,0) rotate(6deg) scale(.88)';
    $('#stack').appendChild(el); els.push(el);
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.opacity = ''; setDepth(el, 2); }));
  }
  locked = false; armTop();
}

/* ---------------- Süre ---------------- */
function onTick(t) {
  const rem = Math.max(0, LIMIT - t), s = Math.ceil(rem);
  ui.stat('time', ZD.Timer.fmt(s));
  if (s !== lastSec) {
    lastSec = s;
    if (s <= 10 && started) ui.statClass('time', 'warn');
    if (s <= 5 && s > 0 && started) ZD.sfx('tick');
  }
  if (rem <= 0 && started) finish('time');
}

/* ---------------- Bitiş ---------------- */
function finish(reason) {
  if (over) return; over = true; locked = true; timer.stop();
  const used = Math.min(LIMIT, timer.t);
  const unanswered = cards.length - idx - (reason === 'time' && els.length && els[0] && els[0].classList.contains('wrong') ? 1 : 0);
  const swap = `<button class="zd-btn sm ghost swap" id="swapDeck">Deste değiştir</button>`;
  const rv = wrongs.length
    ? `<div class="hd"><h4>Gözden geçir · doğru cevaplar</h4>${swap}</div><ul>${wrongs.map(c => `<li><span class="t">${c.t}${c.s ? `<small>${c.s}</small>` : ''}</span><span class="a ${c.a === 'L' ? 'l' : 'r'}">${c.a === 'L' ? D.L : D.R}</span></li>`).join('')}</ul>`
    : `<div class="hd"><h4>Gözden geçir</h4>${swap}</div><div class="ok">Hiç yanlışın yok, harika!</div>`;
  const note = reason === 'time' && unanswered > 0 ? `<div class="note">Süre bittiğinde ${unanswered} kart cevaplanmadan kaldı.</div>` : '';
  setTimeout(() => {
    const m = ZD.result({
      title: reason === 'time' ? 'Süre doldu!' : (wrongs.length === 0 ? 'Kusursuz!' : 'Deste bitti!'),
      correct, total: cards.length, score, time: used,
      text: `${D.name} destesinde ${cards.length} kartın <b style="color:#fff">${correct}</b> tanesini doğru ayırdın.`,
      onReplay: restart,
      extra: `<div class="rv">${rv}${note}</div>`
    });
    const sw = $('#swapDeck', m.box); if (sw) sw.onclick = () => { ZD.sfx('click'); location.href = 'ikili.html'; };
  }, reason === 'time' ? 350 : 650);
}

function restart() { reset(); locked = false; started = true; timer.start(); armTop(); }

/* ---------------- Yönerge ---------------- */
function introSteps() {
  return [
    `Kartı oku ve doğru tarafa <b>fırlat</b>: sola <b style="color:#ff8a73">${D.L}</b>, sağa <b style="color:var(--cyan)">${D.R}</b>.`,
    'Kartı parmağınla sürükleyebilir, alttaki büyük butonlara dokunabilir ya da klavyede <b>←</b> / <b>→</b> tuşlarını kullanabilirsin.',
    'Hızlı cevap ek puan, art arda doğrular <b>seri çarpanı</b> kazandırır. Süren <b>90 saniye</b>!'
  ];
}
function showIntro() {
  introOpen = true;
  ZD.intro({
    kicker: D.kicker, title: 'Hangisi? · ' + D.name, text: D.q,
    steps: introSteps(), start: 'Başla',
    onStart() { introOpen = false; started = true; locked = false; timer.start(); armTop(); setTimeout(() => ZD.pointAt(els[0], { fy: .6, ms: 1500 }), 300); }
  });
}
function help() {
  if (!deckId) { ZD.toast('Önce bir deste seç.', '', 1800); return; }
  if (over || introOpen) return;
  const was = timer.run; timer.stop(); locked = true; introOpen = true;
  ZD.modal({
    html: `<span class="zd-chip">NASIL OYNANIR?</span><h2>Hangisi?</h2><ul class="zd-howto">${introSteps().map((s, i) => `<li><b>${i + 1}</b><span>${s}</span></li>`).join('')}</ul>`,
    actions: [{ label: ZD.I.play + 'Devam et', cls: 'lg', onClick() { introOpen = false; if (started) { locked = false; if (was) timer.start(); } ZD.pointAt(els[0], { fy: .6, ms: 1500 }); } }]
  });
}

/* ---------------- Klavye ---------------- */
addEventListener('keydown', e => {
  if (!deckId || introOpen) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); choose('L'); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); choose('R'); }
});

/* test/otomasyon için salt-okunur durum */
window.__ikili = () => ({ answer: cards[idx] && cards[idx].a, idx, over });

/* ---------------- Başlat ---------------- */
mountUI();
if (deckId) { setupGame(); showIntro(); } else renderPicker();
})();
</script></body></html>
