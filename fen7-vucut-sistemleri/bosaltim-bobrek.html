<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Böbrek Laboratuvarı</title><link rel="stylesheet" href="assets/zd.css"><style>
/* ================= Böbrek Laboratuvarı — sayfa stilleri ================= */
#zd-body{display:flex;flex-direction:column;gap:10px;padding:2px 18px 14px;position:relative}
@media (min-width:861px){#zd-body{height:clamp(560px,calc(100vh - 176px),860px)}}
.bb-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:none}
.bb-bar .zd-seg button{font-size:14px;padding:9px 16px;display:inline-flex;align-items:center;gap:8px}
.bb-bar .zd-seg button svg{width:18px;height:18px}
.bb-live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.bb-view{flex:1;min-height:0;display:none}
.bb-view.on{display:grid}
.ttl-s{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--cyan);text-transform:uppercase}
.h3{font-size:18px;font-weight:800;line-height:1.15}

/* ---------- SİMÜLASYON ---------- */
#v-sim{grid-template-columns:minmax(240px,.7fr) minmax(0,1.22fr) minmax(360px,.98fr);grid-template-rows:minmax(0,1fr);gap:14px}
.bb-a{position:relative;display:flex;flex-direction:column;padding:12px 12px 12px;min-height:0;overflow:hidden;gap:8px}
.a-head{display:flex;align-items:center;gap:8px;flex:none}
.a-svg{flex:1;min-height:0;position:relative}
.a-svg>svg{position:absolute;inset:0;width:100%;height:100%}
.skin-badge{position:absolute;right:0;top:0;width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.skin-badge svg{width:66px;height:66px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.skin-badge span{margin-top:-10px;font-size:10px;font-weight:800;letter-spacing:1.4px;color:#ffd9bf;background:rgba(6,18,32,.85);border:1px solid rgba(243,199,166,.5);padding:3px 8px;border-radius:99px}
.a-legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:12px;color:#cfe0f2;justify-content:center;flex:none;font-weight:500}
.a-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;box-shadow:0 0 8px currentColor}
.a-foot{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid var(--line);flex:none}
.bl-ring{position:relative;width:50px;height:50px;flex:none}
.bl-ring svg{width:50px;height:50px}
.bl-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.bl-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.bl-txt small{font-size:10.5px;font-weight:700;letter-spacing:1.4px;color:var(--muted)}
.bl-txt span{font-size:15px;font-weight:700}
#btnWC{padding:10px 13px;font-size:13.5px;gap:6px;flex:none}
#btnWC svg{width:16px;height:16px}
#btnWC.pulse{animation:wcp 1.1s infinite}
@keyframes wcp{50%{box-shadow:0 5px 0 rgba(0,0,0,.28),0 0 0 8px rgba(255,187,61,.0),0 0 28px rgba(255,187,61,.75)}}
.need-pill{position:absolute;left:50%;top:4px;transform:translate(-50%,10px) scale(.9);opacity:0;transition:.35s var(--spring);pointer-events:none;
  display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;font-weight:800;font-size:14px;white-space:nowrap;
  background:linear-gradient(180deg,#4a2a06,#2c1904);border:1.5px solid #ffbb3d;color:#ffd77a;box-shadow:0 0 22px rgba(255,187,61,.55)}
.need-pill.on{opacity:1;transform:translate(-50%,0) scale(1)}
.need-pill i{width:10px;height:10px;border-radius:50%;background:#ffbb3d;animation:zd-pd 1s infinite;box-shadow:0 0 0 0 rgba(255,187,61,.7)}
.blad-g.tremble{animation:tremble .16s infinite}
@keyframes tremble{0%{transform:translate(0,0)}25%{transform:translate(1.4px,-.6px)}50%{transform:translate(-1.2px,.5px)}75%{transform:translate(.8px,.8px)}100%{transform:translate(0,0)}}
.kid-ring{animation:kring 2.4s infinite}
@keyframes kring{0%{opacity:.9;stroke-width:2}100%{opacity:0;stroke-width:.5}}

.bb-b{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.filter-card{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 14px;gap:8px;position:relative}
.f-head{display:flex;align-items:flex-end;gap:10px;flex:none}
.f-count{margin-left:auto;display:flex;gap:8px}
.f-count div{display:flex;flex-direction:column;align-items:flex-end;padding:4px 10px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.f-count small{font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
.f-count b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.f-canvas{flex:1;min-height:0;position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(53,238,252,.22);
  background:radial-gradient(120% 90% at 50% 45%,#0f2742 0%,#081627 70%,#050f1c 100%);box-shadow:inset 0 0 40px rgba(0,0,0,.55)}
.f-canvas canvas{position:absolute;inset:0;width:100%;height:100%}
.f-legend{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;flex:none}
.f-legend>div{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);min-width:0}
.f-legend svg{width:26px;height:26px;flex:none}
.f-legend b{display:block;font-size:12px;font-weight:700;line-height:1.1;white-space:nowrap}
.f-legend span{display:block;font-size:10.5px;line-height:1.15;font-weight:600}
.f-legend .kal{color:#ff8a98}.f-legend .don{color:#5ff0b0}.f-legend .idr{color:#ffd45a}
.story{position:absolute;left:10px;right:10px;bottom:10px;padding:9px 40px 9px 12px;border-radius:16px;
  background:linear-gradient(180deg,rgba(14,34,56,.94),rgba(8,20,36,.96));border:1.5px solid rgba(53,238,252,.55);
  box-shadow:0 0 26px rgba(53,238,252,.25),0 18px 40px rgba(0,0,0,.5);transform:translateY(20px);opacity:0;pointer-events:none;transition:.45s var(--spring);display:flex;gap:12px;align-items:flex-start}
.story.on{transform:none;opacity:1;pointer-events:auto}
.story svg.si{width:38px;height:38px;flex:none}
.story h4{font-size:15px;font-weight:800;margin-bottom:2px}
.story p{font-size:13px;line-height:1.4;color:#d4e3f3}
.story.done .tx{display:none}
.story p.res{margin-top:4px;color:#7ff5c4;font-weight:600;display:none}
.story p.res.on{display:block;animation:zd-fi .5s var(--ease) both}
.story .x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
.story .x svg{width:16px;height:16px}

.scen-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:none}
.scen{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;text-align:left;min-height:74px;
  background:linear-gradient(180deg,rgba(26,48,76,.75),rgba(14,30,50,.75));border:1.5px solid var(--line);transition:.25s var(--ease);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 24px rgba(0,0,0,.25)}
.scen:hover{border-color:rgba(53,238,252,.5);transform:translateY(-2px)}
.scen.on{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(53,238,252,.35),0 0 24px rgba(53,238,252,.3),inset 0 0 22px rgba(53,238,252,.08)}
.scen svg{width:46px;height:46px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.scen b{display:block;font-size:15px;font-weight:800;line-height:1.15}
.scen span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.scen em{position:absolute;right:10px;top:8px;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:1.2px;color:var(--cyan);opacity:.8}

.bb-c{padding:12px 16px 12px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.c-sec{display:flex;align-items:center;gap:8px}
.c-sec .ttl-s{flex:none}
.c-sec hr{flex:1;border:0;height:1px;background:linear-gradient(90deg,rgba(53,238,252,.35),transparent)}
/* özel kaydırıcı */
.sl{display:flex;flex-direction:column;gap:1px;outline:none;border-radius:14px;padding:2px 2px}
.sl:focus-visible{box-shadow:0 0 0 2px var(--cyan)}
.sl-head{display:flex;align-items:center;gap:8px}
.sl-head svg{width:22px;height:22px;flex:none}
.sl-head b{font-size:14.5px;font-weight:700}
.sl-val{margin-left:auto;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.35);border:1px solid var(--line-2);color:var(--sc);white-space:nowrap;transition:color .3s}
.sl-track{position:relative;height:26px;margin:0 14px;cursor:pointer;touch-action:none}
.sl-rail{position:absolute;left:0;right:0;top:50%;height:10px;margin-top:-5px;border-radius:99px;background:rgba(0,0,0,.45);box-shadow:inset 0 1px 3px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.05)}
.sl-fill{position:absolute;left:0;top:50%;height:10px;margin-top:-5px;border-radius:99px;background:var(--sg);box-shadow:0 0 14px var(--sglow)}
.sl-tick{position:absolute;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.25)}
.sl-tick.on{background:#fff;box-shadow:0 0 6px #fff}
.sl-thumb{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#dfe9f5 60%,#b9c9dc);box-shadow:0 0 0 3px var(--sc),0 0 16px var(--sglow),0 6px 12px rgba(0,0,0,.45);transition:transform .2s var(--spring)}
.sl-thumb::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--sc);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.sl.drag .sl-thumb{transform:scale(1.15)}
.sl-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);font-weight:600;margin:0 2px}
.sl-labels span{flex:1;text-align:center;transition:color .2s}
.sl-labels span:first-child{text-align:left}.sl-labels span:last-child{text-align:right}
.sl-labels span.on{color:#e8f3ff}
/* göstergeler */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:14px;background:rgba(0,0,0,.26);border:1px solid var(--line);min-width:0}
.t-row{display:flex;align-items:center;gap:6px}
.t-l{font-size:10.5px;font-weight:700;letter-spacing:.6px;white-space:nowrap;color:var(--muted);text-transform:uppercase;line-height:1.15}
.t-l small{display:block;font-size:9.5px;letter-spacing:.6px;text-transform:none;color:var(--dim)}
.tile .chip{margin-left:auto;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;background:rgba(0,0,0,.35);border:1px solid var(--line-2);white-space:nowrap}
.leds{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;height:13px}
.leds i{border-radius:3px;background:rgba(255,255,255,.07);transition:background .3s,box-shadow .3s}
.leds i.on{background:linear-gradient(180deg,#8fe3ff,#2b8cf0);box-shadow:0 0 8px rgba(64,170,255,.6)}
.gg-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);font-weight:600;margin-top:-2px}
.ucol{display:flex;align-items:center;gap:8px}
.ucol .tube{width:15px;height:30px;flex:none}
.ustrip{position:relative;flex:1;height:14px;border-radius:99px;background:linear-gradient(90deg,#fff6be,#ffe06a 35%,#f2a900 70%,#be7008);box-shadow:inset 0 1px 2px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.12)}
.ustrip .mk{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.4),0 0 14px rgba(255,220,120,.7);transition:left .5s var(--ease)}
.tile.dial{flex-direction:row;align-items:center;gap:8px}
.tile.dial svg{width:64px;height:auto;flex:none}
.tile.dial .t-l{white-space:normal}
.tile.dial b{display:block;font-size:17px;font-weight:800;margin-top:2px}
.anl{position:relative;padding:10px 12px;border-radius:16px;background:linear-gradient(180deg,rgba(53,238,252,.08),rgba(53,238,252,.03));border:1px solid rgba(53,238,252,.3);font-size:13.5px;line-height:1.45;color:#d9e8f6}
.anl b{color:#fff}
.risk{display:none;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:14px;background:linear-gradient(180deg,rgba(255,84,104,.22),rgba(255,84,104,.1));border:1.5px solid rgba(255,84,104,.7);color:#ffd0d6;font-size:13px;line-height:1.35;font-weight:600;box-shadow:0 0 20px rgba(255,84,104,.3)}
.risk.on{display:flex;animation:zd-fi .5s var(--ease) both}
.risk i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:14px;box-shadow:0 0 0 0 rgba(255,84,104,.7);animation:rpd 1.4s infinite}
@keyframes rpd{70%{box-shadow:0 0 0 10px rgba(255,84,104,0)}100%{box-shadow:0 0 0 0 rgba(255,84,104,0)}}

/* ---------- OYUN: Böbrek Sensin! ---------- */
#v-game{grid-template-columns:minmax(0,1fr) minmax(360px,1.45fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:16px}
.gz{position:relative;border-radius:24px;padding:14px 14px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid;transition:box-shadow .3s,border-color .3s,transform .3s var(--spring);min-height:0;overflow:hidden}
.gz.blue{--zc:#4cc3ff;border-color:rgba(76,195,255,.45);background:radial-gradient(120% 70% at 50% 0%,rgba(40,120,220,.28),rgba(10,26,50,.4) 70%)}
.gz.yellow{--zc:#ffd23f;border-color:rgba(255,210,63,.45);background:radial-gradient(120% 70% at 50% 0%,rgba(220,160,20,.22),rgba(40,28,8,.4) 70%)}
.gz.hot{border-color:var(--zc);box-shadow:0 0 0 2px var(--zc),0 0 40px color-mix(in srgb,var(--zc) 55%,transparent),inset 0 0 40px color-mix(in srgb,var(--zc) 18%,transparent);transform:scale(1.02)}
.gz.flash-good{animation:zd-gg .8s}
.gz .gz-art{width:100%;max-width:280px;height:auto;flex:none;margin-top:10px}
.gz h3{font-size:26px;font-weight:900;letter-spacing:1.5px;color:var(--zc);text-shadow:0 0 16px color-mix(in srgb,var(--zc) 60%,transparent)}
.gz p{font-size:14px;color:#c9d9ea;text-align:center;line-height:1.4}
.gz-tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:auto;align-content:flex-end;min-height:44px}
.gz-tray i{width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid color-mix(in srgb,var(--zc) 35%,transparent);display:grid;place-items:center;animation:pop .45s var(--spring)}
.gz-tray i svg{width:34px;height:30px}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.g-mid{position:relative;display:flex;flex-direction:column;align-items:center;min-height:0;gap:10px}
.g-stagewrap{position:relative;flex:1;min-height:250px;width:100%}
.belt{position:absolute;left:50%;top:0;bottom:6px;width:74%;transform:translateX(-50%);perspective:560px;pointer-events:none}
.belt-s{position:absolute;inset:0;transform:rotateX(42deg);transform-origin:50% 100%;border-radius:20px;
  background:repeating-linear-gradient(180deg,#183050 0 16px,#0f2038 16px 32px);border:2px solid rgba(53,238,252,.3);
  box-shadow:0 0 30px rgba(53,238,252,.15),inset 0 0 40px rgba(0,0,0,.6);animation:beltmove .6s linear infinite;animation-play-state:paused}
.belt-s::before,.belt-s::after{content:"";position:absolute;top:0;bottom:0;width:10px;background:linear-gradient(90deg,#2b4566,#13243a);border-radius:6px}
.belt-s::before{left:-12px}.belt-s::after{right:-12px}
.belt.run .belt-s{animation-play-state:running}
@keyframes beltmove{to{background-position:0 32px}}
.belt-q{position:absolute;left:50%;top:6px;transform:translateX(-50%);display:flex;gap:8px;opacity:.7}
.belt-q div{width:58px;height:46px;border-radius:10px;background:rgba(12,28,48,.9);border:1px solid rgba(53,238,252,.3);display:grid;place-items:center;filter:blur(.3px)}
.belt-q div svg{width:44px;height:36px}
.g-slot{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(330px,92%);}
.g-card{position:relative;padding:14px 16px 16px;border-radius:22px;text-align:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  background:linear-gradient(180deg,#14304d,#0c1f35);border:1.5px solid rgba(73,243,255,.55);
  box-shadow:0 0 26px rgba(53,238,252,.22),0 26px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.g-card:active{cursor:grabbing}
.g-card.enter{animation:cardin .7s var(--ease) both}
@keyframes cardin{from{transform:translateY(-190px) scale(.42);opacity:.2;filter:blur(2px)}to{transform:none;opacity:1;filter:none}}
.gc-tag{display:inline-block;padding:4px 14px;border-radius:10px;border:2px solid var(--cyan);color:var(--cyan);font-weight:900;font-size:14px;letter-spacing:1.6px;box-shadow:0 0 14px rgba(53,238,252,.4),inset 0 0 10px rgba(53,238,252,.15);transform:rotate(-2deg)}
.gc-art{width:150px;height:120px;margin:6px auto 2px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.g-card h3{font-size:23px;font-weight:800;line-height:1.15}
.g-card p{font-size:14px;color:#b9cde2;margin-top:4px;line-height:1.35}
.g-exp{width:100%;min-height:58px;padding:9px 14px;border-radius:16px;font-size:14px;line-height:1.4;display:flex;align-items:center;gap:12px;
  background:rgba(0,0,0,.25);border:1px solid var(--line);color:#c9d9ea;transition:.3s}
.g-exp.good{background:rgba(47,227,155,.12);border-color:rgba(47,227,155,.6);color:#d6fbe9}
.g-exp.bad{background:rgba(255,84,104,.12);border-color:rgba(255,84,104,.65);color:#ffdce1}
.g-exp b{color:#fff}
.g-exp .zd-btn{margin-left:auto;flex:none}
.g-btns{display:flex;gap:46px;justify-content:center;flex:none}
.neon{display:flex;flex-direction:column;align-items:center;gap:6px;--nc:#4cc3ff}
.neon .ring{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;border:4px solid var(--nc);
  box-shadow:0 0 18px var(--nc),0 0 40px color-mix(in srgb,var(--nc) 40%,transparent),inset 0 0 22px color-mix(in srgb,var(--nc) 45%,transparent);
  background:radial-gradient(circle,#0b1a2d 55%,color-mix(in srgb,var(--nc) 20%,#0b1a2d));transition:transform .15s var(--ease)}
.neon:hover .ring{transform:scale(1.06)}
.neon:active .ring{transform:scale(.94)}
.neon svg{width:40px;height:40px;color:var(--nc);filter:drop-shadow(0 0 6px var(--nc))}
.neon b{font-size:18px;font-weight:900;color:var(--nc);letter-spacing:1.2px;text-shadow:0 0 12px color-mix(in srgb,var(--nc) 70%,transparent)}
.neon.yellow{--nc:#ffd23f}
.neon[disabled]{opacity:.45;pointer-events:none}

/* ---------- YARDIMCI ORGANLAR ---------- */
#v-org{grid-template-columns:minmax(270px,350px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:16px}
.o-body{position:relative;padding:8px;min-height:0;overflow:hidden}
.o-body>svg{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px)}
.o-right{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.o-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;flex:none}
.o-card{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:18px;text-align:left;min-height:62px;
  background:linear-gradient(180deg,rgba(26,48,76,.75),rgba(14,30,50,.75));border:1.5px solid var(--line);transition:.25s var(--ease)}
.o-card:hover{transform:translateY(-2px);border-color:rgba(53,238,252,.5)}
.o-card.on{border-color:var(--oc);box-shadow:0 0 0 1px color-mix(in srgb,var(--oc) 50%,transparent),0 0 26px color-mix(in srgb,var(--oc) 40%,transparent)}
.o-card svg{width:46px;height:46px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.o-card b{display:block;font-size:15px;font-weight:800;line-height:1.15}
.o-card span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.o-card .seen{width:18px;height:18px;border-radius:50%;margin-left:auto;flex:none;border:2px solid rgba(255,255,255,.2);display:grid;place-items:center}
.o-card .seen.on{background:var(--green);border-color:var(--green);color:#032a1b}
.o-card .seen svg{width:12px;height:12px;filter:none;opacity:0}
.o-card .seen.on svg{opacity:1}
.o-info{padding:10px 16px;flex:none;min-height:104px;display:flex;gap:16px;align-items:center}
.o-info .oi-art{width:72px;height:72px;flex:none}
.o-info h3{font-size:19px;font-weight:800;margin-bottom:2px}
.o-info p{font-size:14px;line-height:1.45;color:#d4e3f3}
.o-outs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.o-outs span{font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:99px;background:rgba(0,0,0,.3);border:1px solid var(--oc,#35eefc);color:var(--oc,#35eefc)}
.o-quiz{padding:10px 14px;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px}
.q-row{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;align-items:center;padding:5px 10px;border-radius:14px;background:rgba(0,0,0,.24);border:1px solid var(--line);transition:.3s}
.q-row>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--cyan);color:#05262c}
.q-row .q{font-size:14px;line-height:1.4;font-weight:500}
.q-row .why{grid-column:2/4;font-size:12.5px;color:#cde0f2;line-height:1.4;display:none}
.q-row.done .why{display:block;animation:zd-fi .4s var(--ease) both}
.q-row.ok{border-color:rgba(47,227,155,.6);background:rgba(47,227,155,.08)}
.q-row.no{border-color:rgba(255,84,104,.6);background:rgba(255,84,104,.08)}
.dy{display:flex;gap:8px}
.dy button{width:50px;height:40px;border-radius:12px;font-weight:900;font-size:17px;background:linear-gradient(180deg,#2a3c55,#1c2b40);box-shadow:0 4px 0 rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08);transition:.15s}
.dy button:hover{filter:brightness(1.2)}
.dy button.sel-ok{background:linear-gradient(180deg,#3ff0a8,#16b979);color:#022a1a}
.dy button.sel-no{background:linear-gradient(180deg,#ff7385,#e0334a);color:#fff}
.dy button[disabled]{pointer-events:none}
.body-o .org,.body-o .torso-rim{transition:opacity .5s}
.body-o .org{cursor:pointer}
.body-o[data-sel] .org{opacity:.2}
.body-o[data-sel="deri"] .org{opacity:.32}
.body-o[data-sel="akciger"] .org-lung,.body-o[data-sel="karaciger"] .org-liver,.body-o[data-sel="kalin"] .org-int{opacity:1}
.body-o .olbl{opacity:0;transition:opacity .4s}
.body-o[data-sel="deri"] .olbl[data-k="deri"],.body-o[data-sel="akciger"] .olbl[data-k="akciger"],.body-o[data-sel="karaciger"] .olbl[data-k="karaciger"],.body-o[data-sel="kalin"] .olbl[data-k="kalin"]{opacity:1}
.body-o[data-sel="deri"] .torso-rim{stroke:#ffb27a}
.body-o[data-sel="deri"] .torso-warm{opacity:1}
.torso-warm{opacity:0;transition:opacity .6s}
.body-s .org-lung,.body-s .org-liver,.body-s .org-int{opacity:.13}
.zd-howto li span b{all:unset;font-weight:800;color:#fff}
.zd-stat .v.warnc{color:#ffbb3d;text-shadow:0 0 18px rgba(255,187,61,.5)}

/* ---------- Duyarlı ---------- */
@media (max-width:1180px) and (min-width:861px){
  #v-sim{grid-template-columns:minmax(230px,.7fr) minmax(0,1.2fr) minmax(300px,.95fr)}
  .f-legend{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:860px){
  #zd-body{padding:2px 10px 14px}
  .bb-bar .zd-seg{width:100%;display:flex}
  .bb-bar .zd-seg button{flex:1;justify-content:center;padding:8px 6px;font-size:12px;gap:5px;white-space:normal;line-height:1.15;text-align:center}
  .bb-bar .zd-seg button svg{display:none}
  .bb-live{display:none}
  #v-sim,#v-game,#v-org{grid-template-columns:minmax(0,1fr);grid-template-rows:none}
  .bb-a .a-svg{height:380px;flex:none}
  .filter-card .f-canvas{height:auto;aspect-ratio:560/290;flex:none}
  .f-legend{grid-template-columns:repeat(3,minmax(0,1fr))}
  .scen-row{grid-template-columns:minmax(0,1fr)}
  .scen{min-height:60px}
  .bb-c{overflow:visible}
  /* oyun */
  #v-game{grid-template-columns:1fr 1fr;grid-template-areas:"l r" "m m";gap:10px}
  #gzL{grid-area:l}#gzR{grid-area:r}.g-mid{grid-area:m}
  .gz{padding:10px 8px}
  .gz .gz-art{max-width:150px}
  .gz h3{font-size:19px}
  .gz p{font-size:12px}
  .gz-tray i{width:32px;height:32px}.gz-tray i svg{width:26px;height:24px}
  .g-stagewrap{min-height:330px;flex:none}
  .g-btns{gap:28px}
  .neon .ring{width:76px;height:76px}
  /* organlar */
  .o-body{height:420px}
  .o-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .o-info{flex-direction:column;align-items:flex-start}
  .o-info .oi-art{display:none}
  .o-quiz{overflow:visible}
  .q-row{grid-template-columns:24px 1fr}
  .q-row .dy{grid-column:2}
  .q-row .why{grid-column:1/3}
}

(function(){

  rbc(cx,cy,r,rot=0){return `<g transform="translate(${cx} ${cy}) rotate(${rot})"><ellipse cy="${r*.72}" rx="${r*.85}" ry="${r*.2}" fill="#000" opacity=".3"/><g transform="scale(1 .62)"><circle r="${r}" fill="url(#ga-rbc)" stroke="#ffc0c8" stroke-opacity=".6" stroke-width="1.3"/><circle r="${r*.55}" cy="${r*.08}" fill="url(#ga-rbcIn)" opacity=".72"/><ellipse cx="${-r*.32}" cy="${-r*.52}" rx="${r*.42}" ry="${r*.16}" fill="#fff" opacity=".42"/></g></g>`;},
  wbc(cx,cy,r){let d='';for(let i=0;i<=40;i++){const a=i/40*Math.PI*2,rr=r*(1+.07*Math.sin(a*7)+.03*Math.sin(a*3));d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1);}

const SPS={rbc:22,prot:34,water:18,salt:16,urea:22,glu:20};
function fResize(){

function spawn(t){

const qb=(a,b,c,t)=>(1-t)*(1-t)*a+2*(1-t)*t*b+t*t*c;
function fStep(dt){
  F.t+=dt;const fl=cur.flow;
  const R={rbc:3.0,prot:.6,water:2.0*cur.I,salt:1.1*cur.sf,urea:.9,glu:.8};
  for(const t in R){F.acc[t]=(F.acc[t]||0)+R[t]*fl*dt;while(F.acc[t]>=1){F.acc[t]-=1;if(F.ps.length<170)spawn(t);}}
  F.ps=F.ps.filter(p=>{
    p.rot+=p.vr*dt;
    if(p.st==='blood'){p.x+=p.vx*fl*dt;p.y=BC+p.lane+Math.sin(F.t*2+p.ph)*3;
      if(p.fx&&!p.returned&&p.x>=p.fx-16){p.st='cross';p.k=0;p.sx=p.x;p.sy=p.y;p.cx=p.fx;p.cy=MEM;p.ex=p.fx+16;p.ey=TOPY+rnd(-14,14);}
      else if(p.bx&&p.x>=p.bx){p.st='bounce';p.k=0;p.by=p.y;p.bx=0;}
      if(p.x>F.xr+20)return false;}
    else if(p.st==='bounce'){p.x+=p.vx*fl*dt;p.k+=dt*2.4;const dep=(MEM-12)-p.by;p.y=p.by+Math.sin(Math.min(1,p.k)*Math.PI)*dep;
      if(p.k>=.5&&!p.hit){p.hit=true;F.fl.push({x:p.x,y:MEM-4,life:1,c:'255,90,110'});}
      if(p.k>=1){p.st='blood';p.hit=false;}}
    else if(p.st==='cross'||p.st==='up'){p.k+=dt/(p.st==='cross'?.6:.7);const k=Math.min(1,p.k),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;p.x=qb(p.sx,p.cx,p.ex,e);p.y=qb(p.sy,p.cy,p.ey,e);
      if(p.st==='cross'&&!p.fl&&k>.45){p.fl=1;F.fl.push({x:p.cx,y:MEM,life:1,c:'53,238,252'});}
      if(p.st==='up'&&!p.fl&&k>.45){p.fl=1;F.fl.push({x:p.x,y:MEM,life:1,c:'47,227,155'});}
      if(k>=1){if(p.st==='cross'){p.st='tube';p.lane=p.ey-TOPY;p.fl=0;
          const d=p.t==='glu'?'ret':p.t==='urea'?'uri':p.t==='water'?(Math.random()<cur.fu?'uri':'ret'):(Math.random()<cur.fs?'uri':'ret');p.dest=d;if(d==='ret')p.rx=rnd(GATE0+8,GATE1-10);}
        else{p.st='blood';p.returned=true;p.lane=p.y-BC;sim.ret++;}}}
    else if(p.st==='tube'){p.x+=52*fl*dt;p.y=TOPY+p.lane+Math.sin(F.t*2.4+p.ph)*2;
      if(p.dest==='ret'&&p.x>=p.rx){p.st='up';p.k=0;p.sx=p.x;p.sy=p.y;p.cx=p.x+4;p.cy=MEM;p.ex=p.x+26;p.ey=BC+rnd(-18,18);}
      else if(p.dest==='uri'&&p.x>=ARCX){p.st='arc';p.th=-Math.PI/2;p.r=ARCR-p.lane;}}
    else if(p.st==='arc'){p.th+=dt*52*fl/Math.max(20,p.r);p.x=ARCX+p.r*Math.cos(p.th);p.y=ARCY+p.r*Math.sin(p.th);
      if(p.th>=Math.PI/2){p.st='urine';p.lane=p.y-BOTY;sim.uri++;}}
    else if(p.st==='urine'){p.x-=56*fl*dt;p.y=BOTY+p.lane+Math.sin(F.t*2.2+p.ph)*2;if(p.x<F.xl-20)return false;}

function fly(card,side,ms=480){card.style.transition=`transform ${ms}ms var(--ease),opacity ${ms}ms`;card.style.transform=`translate(${side==='L'?-420:420}px,60px) rotate(${side==='L'?-24:24}deg) scale(.35)`;card.style.opacity='0';}
function decide(dir){
  if(G.busy||!G.active||G.done)return;const it=G.deck[G.i];if(!it)return;G.busy=true;
  const card=$('.g-card',gSlot),ok=dir===it.ans;card.classList.remove('enter');
  if(ok){
    G.ok++;G.streak++;G.best=Math.max(G.best,G.streak);G.score+=100+20*Math.min(G.streak-1,5);
    sfx('good');fly(card,dir);const z=dir==='L'?gzL:gzR;z.classList.remove('flash-good');void z.offsetWidth;z.classList.add('flash-good');
    setTimeout(()=>addToken(dir,it),300);
    gExp.className='g-exp good';gExp.innerHTML=`<span><b>Doğru!</b> ${it.why}</span>`;
    gameStats();ui.stat('s3',G.score,true);ui.stat('s4','×'+G.streak,true);
    setTimeout(next,1250);
  }else{
    G.streak=0;sfx('bad');card.style.transition='none';card.style.transform='';card.classList.remove('zd-shake');void card.offsetWidth;card.classList.add('zd-shake');
    gExp.className='g-exp bad zd-shake';gExp.innerHTML=`<span><b>Yanlış.</b> ${it.why}</span><button class="zd-btn sm" id="gNext" aria-label="Devam et">Devam ${ZD.I.arrowR}</button>`;
    gameStats();
    setTimeout(()=>{fly(card,it.ans,600);setTimeout(()=>addToken(it.ans,it),350);},520);
    $('#gNext').onclick=()=>{sfx('click');next();};
  }
}
function next(){
  if(G.done)return;G.i++;
  if(G.i>=G.deck.length){G.done=true;G.timer.stop();G.busy=true;gSlot.innerHTML='';beltQ.innerHTML='';
    gExp.className='g-exp';gExp.innerHTML='<span>Tüm maddeler ayrıldı!</span>';
    setTimeout(()=>ZD.result({title:G.ok>=14?'Harika bir böbreksin!':G.ok>=10?'İyi süzdün!':'Biraz daha süzgeç çalışması!',correct:G.ok,total:16,score:G.score,time:G.timer.t,
      text:`En uzun seri: ×${G.best}. Böbrekler yararlı maddeleri kana geri kazandırır; fazla su, tuz, vitamin, hormon ve üreyi idrarla uzaklaştırır.`,onReplay:startGame}),500);
    return;}
  gExp.className='g-exp';gExp.innerHTML=`<span>Madde <b>${G.i+1}/16</b> geliyor… Kana mı, idrara mı?</span>`;
  showCard();
}
$('#gBL').onclick=()=>decide('L');$('#gBR').onclick=()=>decide('R');
document.addEventListener('keydown',e=>{
  if(S.mode!=='game'||$('.zd-modal.show'))return;
  if(e.key==='ArrowLeft'){e.preventDefault();decide('L');}else if(e.key==='ArrowRight'){e.preventDefault();decide('R');}
  else if(e.key==='Enter'&&$('#gNext')){e.preventDefault();$('#gNext').click();}
});
function gameIntro(isHelp){
  if(G.timer.run)G.timer.stop();
  ZD.intro({kicker:'OYUN · BÖBREK SENSİN!',title:'Süzgeç sensin!',art:`<svg viewBox="0 0 240 70" style="width:220px;height:64px;margin:0 auto 6px">${A.rbc(36,36,16,-10)}${A.glu(84,36,14)}${A.drop(124,34,13)}${A.cube(164,32,13)}${A.urea(206,36,40,-25)}</svg>`,
    text:'Bant üzerinde kandaki maddeler tek tek geliyor. Sen böbreksin: her maddeye karar ver!',
    steps:['Kanda kalması gereken ya da kana geri dönmesi gereken maddeyi <b style="color:#4cc3ff">sola (KANA)</b> gönder.','Fazla su, fazla tuz, üre gibi maddeleri <b style="color:#ffd23f">sağa (İDRARA)</b> gönder.','Kartı sürükleyebilir, düğmelere ya da klavyede ← → oklarına basabilirsin. 16 kart, seri yaptıkça puan artar!'],
    start:isHelp&&G.active&&!G.done?'Devam et':'Oyunu başlat',onStart(){if(!G.active||G.done||!isHelp)startGame();else G.timer.start();setTimeout(()=>ZD.pointAt($('#gBL .ring'),{ms:2200}),400);}});
}

/* =====================================================================
   3) YARDIMCI ORGANLAR
   ===================================================================== */
const ORGS={
  deri:{name:'Deri',sub:'Terleme',oc:'#ffb27a',icon:ICON.deri,text:'Vücuttaki su ve tuzun bir kısmı terleme yoluyla vücuttan uzaklaştırılır. Terleme aynı zamanda vücut sıcaklığını dengeler.',out:['Su','Tuz','Vücut sıcaklığı dengesi']},
  akciger:{name:'Akciğerler',sub:'Soluk verme',oc:'#ff9fb8',icon:ICON.akciger,text:'Solunum olayı sonucunda oluşan karbon dioksit ve su buharının vücuttan uzaklaştırılmasını sağlar.',out:['Karbon dioksit','Su buharı']},
  kalin:{name:'Kalın bağırsak',sub:'Dışkı yoluyla',oc:'#f08d7e',icon:ICON.kalin,text:'Sindirilmeyen besinlerin ve fazla suyun vücuttan atılmasını sağlar.',out:['Sindirilmeyen besinler','Fazla su']},
  karaciger:{name:'Karaciğer',sub:'Dönüştürme',oc:'#e0786e',icon:ICON.karaciger,text:'Sindirim sonucu oluşan zararlı maddelerin daha az zararlı maddelere dönüşmesini sağlar.',out:['Zararlı madde → daha az zararlı madde']}
};
const QUIZ=[
  {q:'İdrar kesesi (mesane), kandaki atık maddeleri süzerek idrar oluşturur.',a:false,why:'Kanı süzen organ <b>böbreklerdir</b>. Mesane idrarı yalnızca vücut dışına atılıncaya kadar depolar.'},
  {q:'Böbrek ve deri, aynı atık maddeleri vücuttan uzaklaştırır.',a:false,why:'Böbrekler fazla su, tuz, vitamin, hormon ve üreyi uzaklaştırır; deri ise terle <b>su ve tuzun bir kısmını</b> atar.'},
  {q:'Karbon dioksit, tuz ve su, soluk verildiğinde akciğerlerden atılır.',a:false,why:'Akciğerler <b>karbon dioksit ve su buharını</b> uzaklaştırır; tuz akciğerlerden atılmaz.'},
  {q:'Deri, boşaltıma yardımcı bir organdır.',a:true,why:'Doğru! Terleme ile su ve tuzun bir kısmı atılır; terleme vücut sıcaklığını da dengeler.'}
];
const O={sel:null,seen:new Set(),ans:[null,null,null,null],ok:0,score:0,parts:[],acc:0,t0:performance.now(),resShown:false};
const OS=$('#o-svg'),OFX=$('.fx',OS),oInfo=$('#oInfo');
$('#oCards').innerHTML=Object.entries(ORGS).map(([k,o])=>`<button class="o-card" data-k="${k}" style="--oc:${o.oc}" aria-label="${o.name}: göster">${o.icon}<div><b>${o.name}</b><span>${o.sub}</span></div><i class="seen">${ZD.I.check}</i></button>`).join('');
$$('#oCards .o-card').forEach(b=>b.onclick=()=>selOrgan(b.dataset.k));
$$('.org',OS).forEach(g=>g.addEventListener('click',()=>{const k=g.dataset.k;if(ORGS[k])selOrgan(k);}));
$('.torso-path',OS).style.cursor='pointer';$('.torso-path',OS).addEventListener('click',()=>selOrgan('deri'));
function orgStats(){setStats([{label:'Keşif',value:O.seen.size+'/4',cls:'cyan'},{label:'Doğru',value:O.ok+'/4'},{label:'Puan',value:O.score},null]);}
function infoDefault(){oInfo.style.removeProperty('--oc');oInfo.innerHTML=`<svg class="oi-art" viewBox="0 0 48 48">${ICON.deri.replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg><div><h3>Boşaltıma yardımcı organlar</h3><p>Böbreklerin yanında <b>deri, akciğerler, kalın bağırsak</b> ve <b>karaciğer</b> de vücuttaki atıkların uzaklaştırılmasına yardımcı olur. Bir organ kartına dokun; gövdede neyi nasıl uzaklaştırdığını izle.</p></div>`;}
function selOrgan(k){
  if(O.sel===k)return;O.sel=k;const o=ORGS[k];
  OS.setAttribute('data-sel',k);sfx('whoosh');
  $$('#oCards .o-card').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  $$('.org',OS).forEach(g=>g.removeAttribute('filter'));
  const map={akciger:'.org-lung',karaciger:'.org-liver',kalin:'.org-int'};if(map[k])$(map[k],OS).setAttribute('filter','url(#o-hl)');
  oInfo.style.setProperty('--oc',o.oc);
  oInfo.innerHTML=`<svg class="oi-art" viewBox="0 0 48 48">${o.icon.replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg><div><h3 style="color:${o.oc}">${o.name}</h3><p>${o.text}</p><div class="o-outs">${o.out.map(x=>`<span>${x}</span>`).join('')}</div></div>`;
  oInfo.classList.remove('zd-fade-in');void oInfo.offsetWidth;oInfo.classList.add('zd-fade-in');
  if(!O.seen.has(k)){O.seen.add(k);O.score+=25;$(`#oCards .o-card[data-k="${k}"] .seen`).classList.add('on');}
  O.parts.forEach(p=>p.g.remove());O.parts=[];O.acc=0;orgStats();checkOrgDone();
}
function renderQuiz(){
  $('#oQuiz').innerHTML=QUIZ.map((q,i)=>`<div class="q-row" data-i="${i}"><b>${i+1}</b><div class="q">${q.q}</div><div class="dy"><button data-v="1" aria-label="Doğru">D</button><button data-v="0" aria-label="Yanlış">Y</button></div><div class="why">${q.why}</div></div>`).join('');
  $$('#oQuiz .q-row').forEach(r=>$$('button',r).forEach(b=>b.onclick=()=>answer(+r.dataset.i,b.dataset.v==='1',b)));
}
function answer(i,v,btn){
  if(O.ans[i]!==null)return;const q=QUIZ[i],ok=v===q.a,row=btn.closest('.q-row');O.ans[i]=ok;
  row.classList.add('done',ok?'ok':'no');$$('button',row).forEach(b=>{b.disabled=true;if((b.dataset.v==='1')===q.a)b.classList.add('sel-ok');else if(b===btn)b.classList.add('sel-no');});
  if(ok){O.ok++;O.score+=100;sfx('good');row.classList.add('zd-glow-good');toast('Doğru!','good',1300);}
  else{sfx('bad');row.classList.add('zd-shake');toast('Yanlış — açıklamayı oku.','bad',1600);}
  orgStats();ui.stat('s3',O.score,true);checkOrgDone();
}
function checkOrgDone(){
  if(O.resShown||O.ans.some(a=>a===null))return;O.resShown=true;
  setTimeout(()=>ZD.result({title:O.ok===4?'Boşaltım uzmanı!':O.ok>=3?'Çok iyi!':'Tekrar deneyelim!',correct:O.ok,total:4,score:O.score,time:(performance.now()-O.t0)/1000,
    text:`Keşfedilen yardımcı organ: ${O.seen.size}/4. Deri, akciğerler, kalın bağırsak ve karaciğer boşaltıma yardımcı olur; ama her biri farklı maddeleri uzaklaştırır.`,onReplay:resetOrg}),900);
}
function resetOrg(){
  O.sel=null;O.seen.clear();O.ans=[null,null,null,null];O.ok=0;O.score=0;O.resShown=false;O.t0=performance.now();
  O.parts.forEach(p=>p.g.remove());O.parts=[];OS.removeAttribute('data-sel');$$('.org',OS).forEach(g=>g.removeAttribute('filter'));
  $$('#oCards .o-card').forEach(b=>b.classList.remove('on'));$$('#oCards .seen').forEach(s=>s.classList.remove('on'));
  infoDefault();renderQuiz();orgStats();
}
function orgIntro(isHelp){
  ZD.intro({kicker:'KEŞİF · YARDIMCI ORGANLAR',title:'Boşaltıma yardımcı organlar',art:`<svg viewBox="0 0 220 56" style="width:220px;height:56px;margin:0 auto 6px"><g transform="translate(4 4)">${ICON.deri.replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g><g transform="translate(60 4)">${ICON.akciger.replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g><g transform="translate(116 4)">${ICON.kalin.replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g><g transform="translate(170 4)">${ICON.karaciger.replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g></svg>`,
    text:'Atıkları yalnızca böbrekler uzaklaştırmaz. Dört yardımcı organı keşfet, sonra hızlı kontrolü çöz.',
    steps:['Bir organ kartına (ya da gövdedeki organa) dokun: organ parlar ve uzaklaştırdığı maddeler hareket eder.','Altta 4 ifade var: her biri için <b>D</b> (doğru) ya da <b>Y</b> (yanlış) seç.'],
    start:isHelp?'Devam et':'Keşfe başla',onStart(){setTimeout(()=>ZD.pointAt($('#oCards .o-card'),{ms:2200}),350);}});
}
/* organ efekt parçacıkları (SVG) */
let TORSO_PTS=[];
function prepTorso(){const tp=$('.torso-path',OS),L=tp.getTotalLength();for(let i=0;i<260;i++){const pt=tp.getPointAtLength(L*i/260);if(pt.y>90&&pt.y<570&&Math.abs(pt.x-200)>60)TORSO_PTS.push([pt.x,pt.y]);}}
const INT_EL=$('.int-path',OS);let INT_LEN=0;
function mkP(html){const g=document.createElementNS(NS,'g');g.innerHTML=html;OFX.appendChild(g);return g;}
function along(pts,k){const n=pts.length-1,f=clamp(k,0,.9999)*n,i=Math.floor(f),t=f-i;return[lerp(pts[i][0],pts[i+1][0],t),lerp(pts[i][1],pts[i+1][1],t)];}
const harm=`<polygon transform="scale(1.4)" points="0,-9 2.6,-3 9,-3 4,1.4 6,8 0,4 -6,8 -4,1.4 -9,-3 -2.6,-3" fill="#5a0d2a" stroke="#ff4d6d" stroke-width="1.6"/>`;
const safe=`<circle r="9" fill="#5be3a0" stroke="#d5ffe9" stroke-width="1.4"/><circle cx="-2" cy="-2" r="1.8" fill="#fff" opacity=".7"/>`;
function orgStep(dt,t){
  const k=O.sel;if(!k)return;
  const lb=$('.lung-b',OS);lb.setAttribute('transform',k==='akciger'?`translate(200 190) scale(${1+.035*Math.sin(t*2.2)}) translate(-200 -190)`:'');
  const rate={deri:6,akciger:2.6,kalin:1.6,karaciger:1.3}[k];O.acc+=dt*rate;
  while(O.acc>=1&&O.parts.length<40){O.acc-=1;
    if(k==='deri'){const p=pick(TORSO_PTS),salt=Math.random()<.35;O.parts.push({k,g:mkP(salt?A.cube(0,0,6):A.drop(0,0,7)),x:p[0],y:p[1],vx:(p[0]<200?-1:1)*rnd(8,22),vy:rnd(-4,6),t:0,life:rnd(1.6,2.4)});}
    else if(k==='akciger'){const L=Math.random()<.5,co2=Math.random()<.6;const st=L?[rnd(125,175),rnd(170,250)]:[rnd(225,275),rnd(170,245)];
      O.parts.push({k,co2,g:mkP(co2?`<circle r="12" fill="#9fb3c8" fill-opacity=".92" stroke="#e6f0ff" stroke-width="1.4"/><text y="3.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="#0b1a2d" font-family="Lexend,system-ui,sans-serif">CO₂</text>`:`<circle r="8" fill="#fff" fill-opacity=".4"/><circle r="4" fill="#fff" fill-opacity=".6"/>`),pts:[st,[L?186:214,138],[200,110],[200,40],[200+rnd(-30,30),-20]],t:0,life:2.6});}
    else if(k==='kalin'){const w=Math.random()<.35;O.parts.push({k,g:mkP(w?A.drop(0,0,7):`<ellipse rx="9" ry="6.5" fill="#7a4a2c" stroke="#c48a5c" stroke-width="1.4"/><ellipse cx="-2" cy="-2" rx="2.5" ry="1.4" fill="#fff" opacity=".3"/>`),s:0,t:0,sp:rnd(70,95)});}
    else if(k==='karaciger'){O.parts.push({k,g:mkP(harm),pts:[[rnd(150,250),420],[rnd(150,190),rnd(296,316)]],out:[[208,250],[208,200]],t:0,ph:0});}
  }
  O.parts=O.parts.filter(p=>{p.t+=dt;let x,y,op=1,s=1;
    if(p.k==='deri'){p.vy+=dt*22;p.x+=p.vx*dt;p.y+=p.vy*dt;x=p.x;y=p.y;const q=p.t/p.life;op=q<.15?q/.15:1-Math.max(0,(q-.6)/.4);s=.6+Math.min(1,q*4)*.6;if(q>=1){p.g.remove();return false;}}
    else if(p.k==='akciger'){const q=p.t/p.life;[x,y]=along(p.pts,easeOut(q));op=q>.8?(1-q)/.2:1;s=p.co2?1:1+q*1.4;if(q>=1){p.g.remove();return false;}}
    else if(p.k==='kalin'){p.s+=p.sp*dt;if(p.s<INT_LEN){const pt=INT_EL.getPointAtLength(p.s);x=pt.x;y=pt.y;}else{const pt=INT_EL.getPointAtLength(INT_LEN);x=pt.x;y=pt.y+(p.s-INT_LEN);op=Math.max(0,1-(p.s-INT_LEN)/40);if(op<=0){p.g.remove();return false;}}}
    else if(p.k==='karaciger'){if(p.ph===0){const q=Math.min(1,p.t/1.4);[x,y]=along(p.pts,easeOut(q));p.x=x;p.y=y;s=1;if(q>=1){p.ph=1;p.t=0;p.g.innerHTML=safe;sfx('pop');}}
      else{const q=Math.min(1,p.t/1.6);const pts=[[p.x,p.y]].concat(p.out);[x,y]=along(pts,q);s=q<.15?1+Math.sin(q/.15*Math.PI)*.6:1;op=q>.75?(1-q)/.25:1;if(q>=1){p.g.remove();return false;}}}
    p.g.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(2)})`);p.g.setAttribute('opacity',op.toFixed(2));return true;});
}

/* =====================================================================
   ANA DÖNGÜ
   ===================================================================== */
let last=performance.now(),T=0;
function loop(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;T+=dt;
  if(S.mode==='sim'){simStep(dt,T);if(F.warm){fStep(dt);fDraw();}else fResize();}
  else if(S.mode==='org')orgStep(dt,T);
  else if(S.mode==='game'){const w=$('#gzR .gwave');if(w)w.setAttribute('transform',`translate(${(-((T*18)%40)).toFixed(1)} 0)`);const v=$('#gzL .vrun');if(v)v.setAttribute('transform',`translate(${((T*30)%40).toFixed(1)} 0)`);}
  requestAnimationFrame(loop);
}
/* başlat */
prepTorso();INT_LEN=INT_EL.getTotalLength();infoDefault();renderQuiz();updateSimStats(true);updateGauges();
requestAnimationFrame(loop);
simIntro(false);
window.__bb={sim,S,G,O,setMode,applyScen,decide,selOrgan,answer:(i,v)=>answer(i,v,$$(`#oQuiz .q-row[data-i="${i}"] button`)[v?0:1])};
})();
</script></body></html>
